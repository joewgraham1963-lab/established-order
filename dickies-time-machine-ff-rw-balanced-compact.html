<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dickinson's Clock</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Futura, "Century Gothic", Arial, sans-serif;
      font-size: 48px;
      background: radial-gradient(
  circle at center,
  #666666 0%,
  #5c5c5c 30%,
  #444444 70%
);
      transition: background-color 20s ease;
      color: #111;
    }
#face {
    width: 250px;
    height: 250px;
    border: 4px solid black;
    border-radius: 50%;
    margin: 0 auto 40px auto;
    position: relative;
    background-color: #848482;
    box-shadow: 0 3px 8px rgba(0,0,0,0.25);
}
#facePlate {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background-color: rgba(132, 132, 130, 0.72);
    z-index: 1;
    transition: background-color 20s ease;
}
#pivot {
    width: 12px;
    height: 12px;
    background: black;
    border: 2px solid #C0C0C0;
box-sizing: border-box;
    border-radius: 50%;

    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
} #secondHand {
    width: 2px;
    height: 105px;
    background: red;

    position: absolute;
    left: 50%;
    top: 50%;

    transform-origin: bottom center;
    transform: translateX(-50%) rotate(0deg);

    margin-top: -105px;
} #minuteHand {
    width: 5px;
    height: 90px;
    background: black;

    position: absolute;
    left: 50%;
    top: 50%;

    transform-origin: bottom center;
    transform: translateX(-50%) rotate(0deg);

    margin-top: -90px;
}#hourHand {
    width: 7px;
    height: 65px;
    background: black;

    position: absolute;
    left: 50%;
    top: 50%;

    transform-origin: bottom center;
    transform: translateX(-50%) rotate(0deg);

    margin-top: -65px;
}.marker {
    position: absolute;
    width: 4px;
    height: 18px;
    background: black;

    left: 50%;
    top: 8px;

    transform-origin: 50% 117px;
    z-index: 2;
}.m12 { transform: translateX(-50%) rotate(0deg); }
.m1  { transform: translateX(-50%) rotate(30deg); }
.m2  { transform: translateX(-50%) rotate(60deg); }
.m3  { transform: translateX(-50%) rotate(90deg); }
.m4  { transform: translateX(-50%) rotate(120deg); }
.m5  { transform: translateX(-50%) rotate(150deg); }
.m6  { transform: translateX(-50%) rotate(180deg); }
.m7  { transform: translateX(-50%) rotate(210deg); }
.m8  { transform: translateX(-50%) rotate(240deg); }
.m9  { transform: translateX(-50%) rotate(270deg); }
.m10 { transform: translateX(-50%) rotate(300deg); }
.m11 { transform: translateX(-50%) rotate(330deg); }#hourHand,
#minuteHand,
#secondHand {
    z-index: 3;
}

#pivot {
    z-index: 8;
}#logo {
    position: absolute;
    top: 38px;
    width: 100%;
    text-align: center;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 16px;
    font-weight: bold;
    color: black;
    z-index: 2;
}

#tagline {
    position: absolute;
    top: 58px;
    width: 100%;
    text-align: center;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1px;
    color: #333333;
    z-index: 2;
}

#dayDate {
  position: absolute;
  top: 66%;
  left: 50%;
  transform: translateX(-50%);
  width: auto;
  white-space: nowrap;
  text-align: center;
  font-size: 12px;
  font-weight: 600;
  color: #222;
  background: #ffffff;
  border: 1px solid #222;
  border-radius: 2px;
  padding: 2px 5px;
  letter-spacing: 0.5px;
  z-index: 6;
}
#clockContainer {
    display: flex;
    flex-direction: column;
    align-items: center;
}

#moon {
    width: 32px;
    height: 32px;
    background: #111;
    border: 1px solid black;
    border-radius: 50%;
    position: absolute;
    top: 50%;
    left: 50%;
    z-index: 10;
    overflow: hidden;
}

#moonLight {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: white;
    transform-origin: center;
    z-index: 2;
}

#sun {
    width: 32px;
    height: 32px;
    background: gold;
    border: 1px solid black;
    border-radius: 50%;

    position: absolute;
    top: 50%;
    left: 50%;

    z-index: 9;
}#northLabel {
    font-size: 16px;
    font-weight: bold;
    color: #111;
    margin-bottom: 12px;
    letter-spacing: 1px;
}
#clock {
  font-size: 24px;
  margin-top: 10px;
  opacity: 0.65;
  } 


.trail-dot {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  transform: translate(-50%, -50%);
  z-index: 8;
}
.trail-dot.sun-trail {
  width: 4px;
  height: 4px;
  background: gold;
}

#moonTrailSvg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 8;
  overflow: visible;
}
#moonTrailPath {
  fill: none;
  stroke: white;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: 0.95;
}

.planet-marker {
  position: absolute; left: 50%; top: 50%; border-radius: 50%;
  transform: translate(-50%, -50%); pointer-events: none; z-index: 11; box-sizing: border-box;
}
#mercury { width: 7px; height: 7px; background: #b9b9b9; border: 1px solid #222; }
#venus { width: 9px; height: 9px; background: #f4efe2; border: 1px solid #7c725c; }
#mars { width: 8px; height: 8px; background: #b84f35; border: 1px solid #4e1f16; }


.planet-label {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  font: 700 9px Futura, "Century Gothic", Arial, sans-serif;
  pointer-events: none;
  z-index: 12;
  text-shadow: 0 0 2px #848482, 0 0 2px #848482;
}
#mercuryLabel { color: #222; }
#venusLabel   { color: #f4efe2; }
#marsLabel    { color: #8f2f20; }
#jupiterLabel { color: #8a642f; }
#saturnLabel  { color: #7a6b3f; }

#planetTrailSvg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 7;
  overflow: visible;
}
.planet-trail {
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: 0.9;
}
#mercuryTrail { stroke: #777; }
#venusTrail   { stroke: #f4efe2; }
#marsTrail    { stroke: #b84f35; }
#jupiterTrail { stroke: #b98545; }
#saturnTrail  { stroke: #c8ad63; }




#eclipseControls {
  margin-top: 8px;
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
}
#eclipseControls button {
  font: 600 12px Futura, "Century Gothic", Arial, sans-serif;
  padding: 6px 10px;
  border: 1px solid #222;
  border-radius: 12px;
  background: #848482;
  color: #111;
  cursor: pointer;
}
#eclipseControls button.active {
  background: #222;
  color: #f2f2f2;
}
#eclipseStatus {
  min-width: 76px;
  font: 700 10px Futura, "Century Gothic", Arial, sans-serif;
  letter-spacing: 0.4px;
  color: #ddd;
}
#eclipseShadow {
  position: absolute;
  width: 72px;
  height: 72px;
  left: 50%;
  top: 50%;
  border-radius: 50%;
  background:
    radial-gradient(circle at 58% 46%,
      rgba(120,35,20,0.80) 0%,
      rgba(72,18,13,0.92) 56%,
      rgba(24,8,8,0.97) 100%);
  transform: translate(-50%, -50%) translate(200px, 0);
  opacity: 0;
  pointer-events: none;
  z-index: 20;
}
body.true-scale #eclipseShadow {
  display: none !important;
}

#projectionControls {
  margin-top: 8px;
  display: flex;
  justify-content: center;
}
#projectionControls button {
  font: 600 12px Futura, "Century Gothic", Arial, sans-serif;
  padding: 6px 10px;
  border: 1px solid #222;
  border-radius: 12px;
  background: #848482;
  color: #111;
  cursor: pointer;
}
#projectionControls button.active {
  background: #222;
  color: #f2f2f2;
}

#starMapGrid {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 220px;
  height: 150px;
  transform: translate(-50%, -50%);
  border: 1px solid rgba(0,0,0,0.45);
  border-radius: 6px;
  pointer-events: none;
  z-index: 2;
  display: none;
  box-sizing: border-box;
}
#starMapGrid::before,
#starMapGrid::after {
  content: "";
  position: absolute;
  background: rgba(0,0,0,0.22);
}
#starMapGrid::before {
  left: 50%;
  top: 0;
  bottom: 0;
  width: 1px;
}
#starMapGrid::after {
  left: 0;
  right: 0;
  top: 50%;
  height: 1px;
}
#starMapCaption {
  position: absolute;
  left: 50%;
  top: calc(50% + 82px);
  transform: translateX(-50%);
  font: 700 9px Futura, "Century Gothic", Arial, sans-serif;
  color: rgba(0,0,0,0.72);
  z-index: 3;
  display: none;
  pointer-events: none;
}
body.star-map #starMapGrid,
body.star-map #starMapCaption {
  display: block;
}
body.star-map #hourHand,
body.star-map #minuteHand,
body.star-map #secondHand,
body.star-map #pivot,
body.star-map #sun,
body.star-map #moon,
body.star-map #moonLight,
body.star-map #moonTrailSvg {
  opacity: 0.10 !important;
}
body.star-map .marker,
body.star-map #dayDate,
body.star-map #dateBox {
  opacity: 0.18 !important;
}

#scaleControls {
  margin-top: 8px;
  display: flex;
  justify-content: center;
}
#scaleControls button {
  font: 600 12px Futura, "Century Gothic", Arial, sans-serif;
  padding: 6px 10px;
  border: 1px solid #222;
  border-radius: 12px;
  background: #848482;
  color: #111;
  cursor: pointer;
}
#scaleControls button.active {
  background: #222;
  color: #f2f2f2;
}
body.true-scale #sun,
body.true-scale #moon,
body.true-scale #mercury,
body.true-scale #venus,
body.true-scale #mars,
body.true-scale #jupiter,
body.true-scale #saturn {
  width: 1px !important;
  height: 1px !important;
  min-width: 1px !important;
  min-height: 1px !important;
  border: 0 !important;
  box-shadow: none !important;
}
body.true-scale #moonLight {
  display: none !important;
}
body.true-scale .planet-label {
  opacity: 0 !important;
}


#scrubControls {
  width: min(92vw, 390px);
  margin: 10px auto 4px;
  text-align: center;
}
.scrub-labels {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font: 700 11px Futura, "Century Gothic", Arial, sans-serif;
  color: #ddd;
  letter-spacing: 0.4px;
}
#scrubReadout {
  font-size: 12px;
  color: #fff;
}
#timeScrubber {
  width: 100%;
}
.scrub-hint {
  font: 9px Futura, "Century Gothic", Arial, sans-serif;
  color: #ccc;
  opacity: 0.78;
  margin-top: 2px;
}

#timeControls {
  margin-top: 12px;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: center;
}
#timeControls button {
  font: 600 12px Futura, "Century Gothic", Arial, sans-serif;
  padding: 6px 9px;
  border: 1px solid #222;
  border-radius: 12px;
  background: #848482;
  color: #111;
  cursor: pointer;
}
#timeControls button.active {
  background: #222;
  color: #f2f2f2;
}
#simLabel {
  margin-top: 6px;
  font-size: 11px;
  letter-spacing: 0.6px;
  color: #dddddd;
  opacity: 0.8;
  min-height: 14px;
}

  


@media (max-width: 600px) {
  #clockContainer {
    transform: scale(1.02);
    transform-origin: top center;
    margin-top: 6px;
    margin-bottom: 18px;
  }

  #clock {
    margin-top: 4px;
  }

  #eclipseControls,
  #projectionControls,
  #scaleControls,
  #scrubControls {
    margin-top: 5px;
  }

  #timeControls {
    margin-top: 5px;
  }

  #timeControls button,
  #eclipseControls button,
  #projectionControls button,
  #scaleControls button {
    padding: 5px 8px;
    font-size: 11px;
  }

  #scrubControls {
    width: min(96vw, 390px);
  }

  .scrub-hint {
    font-size: 8px;
  }
}

</style>
</head>

<body>


<div id="clockContainer">

    <div id="northLabel">N</div>

    
   <div id="face">
    <div id="facePlate"></div> 
    <div class="marker m12"></div>
    <div class="marker m1"></div>
    <div class="marker m2"></div>
    <div class="marker m3"></div>
    <div class="marker m4"></div>
    <div class="marker m5"></div>
    <div class="marker m6"></div>
    <div class="marker m7"></div>
    <div class="marker m8"></div>
    <div class="marker m9"></div>
    <div class="marker m10"></div>
    <div class="marker m11"></div>
    <div id="logo">DICKINSON'S</div>
<div id="tagline">Rhyl Deal</div>
<div id="dayDate"></div>

    <svg id="moonTrailSvg" viewBox="0 0 250 250" aria-hidden="true">
      <polyline id="moonTrailPath" points=""></polyline>
    </svg>
    <div id="starMapGrid"></div>
    <div id="starMapCaption">RA → · DEC ↑</div>
    <svg id="planetTrailSvg" viewBox="0 0 250 250" aria-hidden="true">
      <path id="mercuryTrail" class="planet-trail" d=""></path>
      <path id="venusTrail" class="planet-trail" d=""></path>
      <path id="marsTrail" class="planet-trail" d=""></path>
      <path id="jupiterTrail" class="planet-trail" d=""></path>
      <path id="saturnTrail" class="planet-trail" d=""></path>
    </svg>
    <div id="mercury" class="planet-marker" title="Mercury"></div>
    <div id="venus" class="planet-marker" title="Venus"></div>
    <div id="mars" class="planet-marker" title="Mars"></div>
    <div id="jupiter" class="planet-marker" title="Jupiter"></div>
    <div id="saturn" class="planet-marker" title="Saturn"></div>
    <div id="mercuryLabel" class="planet-label">Me</div>
    <div id="venusLabel" class="planet-label">V</div>
    <div id="marsLabel" class="planet-label">Ma</div>
    <div id="jupiterLabel" class="planet-label">J</div>
    <div id="saturnLabel" class="planet-label">Sa</div>

    <div id="hourHand"></div>
    <div id="minuteHand"></div>
    <div id="secondHand"></div>
   <div id="moon"><div id="moonLight"></div>
      <div id="eclipseShadow"></div></div>
<div id="sun"></div>
    <div id="pivot"></div>

</div>
    <div id="clock"></div>

    <div id="eclipseControls" aria-label="Lunar eclipse display">
      <button type="button" id="eclipseToggle" class="active" aria-pressed="true">ECLIPSE ON</button>
      <span id="eclipseStatus"></span>
    </div>
    <div id="projectionControls" aria-label="Projection mode">
      <button type="button" id="projectionToggle">STAR MAP</button>
    </div>
    <div id="scaleControls" aria-label="Celestial body scale">
      <button type="button" id="scaleToggle" title="Show celestial bodies at roughly true apparent angular scale">TRUE SCALE</button>
    </div>
    <div id="scrubControls" aria-label="Time direction and speed">
      <div class="scrub-labels">
        <span>RW</span>
        <span id="scrubReadout">LIVE</span>
        <span>FF</span>
      </div>
      <input id="timeScrubber" type="range" min="-6" max="6" step="1" value="0"
             aria-label="Reverse or fast-forward simulated time">
      <div class="scrub-hint">centre = live · left = backwards · right = forwards</div>
    </div>
    <div id="timeControls" aria-label="Time speed">
      <button type="button" data-speed="live" class="active">LIVE</button>
      <button type="button" data-speed="1440">1440×</button>
      <button type="button" data-speed="8640">8640×</button>
      <button type="button" data-speed="43200">43200×</button>
      <button type="button" data-speed="525949">1 YEAR/MIN</button>
    </div>
    <div id="simLabel"></div>

<script>



    let starMapMode = false;

    function setProjectionMode(useStarMap) {
      starMapMode = useStarMap;
      document.body.classList.toggle("star-map", starMapMode);

      const button = document.getElementById("projectionToggle");
      if (button) {
        button.classList.toggle("active", starMapMode);
        button.textContent = starMapMode ? "RHYL SKY" : "STAR MAP";
        button.setAttribute("aria-pressed", String(starMapMode));
      }

      clearPlanetTrails();
      lastPlanetTrailRender.mercury = 0;
      lastPlanetTrailRender.venus = 0;
      lastPlanetTrailRender.mars = 0;
      lastPlanetTrailRender.jupiter = 0;
      lastPlanetTrailRender.saturn = 0;
    }

    const projectionToggle = document.getElementById("projectionToggle");
    if (projectionToggle) {
      projectionToggle.addEventListener("click", () => setProjectionMode(!starMapMode));
      projectionToggle.setAttribute("aria-pressed", "false");
    }

    let trueScaleMode = false;

    function setTrueScale(enabled) {
      trueScaleMode = enabled;
      document.body.classList.toggle("true-scale", trueScaleMode);

      const button = document.getElementById("scaleToggle");
      if (button) {
        button.classList.toggle("active", trueScaleMode);
        button.textContent = trueScaleMode ? "DISPLAY SCALE" : "TRUE SCALE";
        button.setAttribute("aria-pressed", String(trueScaleMode));
      }
    }

    const scaleToggle = document.getElementById("scaleToggle");
    if (scaleToggle) {
      scaleToggle.addEventListener("click", () => setTrueScale(!trueScaleMode));
      scaleToggle.setAttribute("aria-pressed", "false");
    }


    const scrubSpeeds = {
      "-6": -525949,
      "-5": -43200,
      "-4": -8640,
      "-3": -1440,
      "-2": -240,
      "-1": -24,
      "0": 1,
      "1": 24,
      "2": 240,
      "3": 1440,
      "4": 8640,
      "5": 43200,
      "6": 525949
    };

    function setScrubberSpeed(stepValue) {
      const step = String(stepValue);
      const speed = scrubSpeeds[step];
      const readout = document.getElementById("scrubReadout");

      if (step === "0") {
        setTimeSpeed("live");
        if (readout) readout.textContent = "LIVE";
        return;
      }

      setTimeSpeed(String(speed));

      if (readout) {
        if (Math.abs(speed) === 525949) {
          readout.textContent = speed < 0 ? "◀ 1 YEAR/MIN" : "1 YEAR/MIN ▶";
        } else {
          readout.textContent = speed < 0 ? `◀ ${Math.abs(speed)}×` : `${speed}× ▶`;
        }
      }
    }

    let timeSpeed = 1;
    let isLiveTime = true;
    let simulatedBaseTime = Date.now();
    let realBaseTime = Date.now();

    function getDickieTime() {
      if (isLiveTime) return new Date();
      const elapsedRealMs = Date.now() - realBaseTime;
      return new Date(simulatedBaseTime + elapsedRealMs * timeSpeed);
    }

    function setTimeSpeed(value) {
      const currentDickieTime = getDickieTime().getTime();

      if (value === "live") {
        isLiveTime = true;
        timeSpeed = 1;
      } else {
        isLiveTime = false;
        simulatedBaseTime = currentDickieTime;
        realBaseTime = Date.now();
        timeSpeed = Number(value);
      }

      document.querySelectorAll("#timeControls button").forEach(button => {
        button.classList.toggle("active", button.dataset.speed === String(value));
      });

      const slider = document.getElementById("timeScrubber");
      const readout = document.getElementById("scrubReadout");
      if (slider) {
        if (value === "live") {
          slider.value = "0";
          if (readout) readout.textContent = "LIVE";
        } else {
          const numeric = Number(value);
          const found = Object.entries(scrubSpeeds).find(([, speed]) => speed === numeric);
          if (found) slider.value = found[0];
        }
      }

      clearTrails();
      clearPlanetTrails();

      const simLabel = document.getElementById("simLabel");
      simLabel.textContent = isLiveTime
        ? ""
        : `${timeSpeed}× TIME · ${getDickieTime().toLocaleDateString("en-GB")}`;
    }

    document.querySelectorAll("#timeControls button").forEach(button => {
      button.addEventListener("click", () => setTimeSpeed(button.dataset.speed));
    });


    const trailState = {
      sun: [],
      moonPoints: [],
      lastStamp: 0
    };

    function clearTrails() {
      document.querySelectorAll(".trail-dot").forEach(dot => dot.remove());
      trailState.sun = [];
      trailState.moonPoints = [];
      trailState.lastStamp = 0;
      const moonPath = document.getElementById("moonTrailPath");
      if (moonPath) moonPath.setAttribute("points", "");
    }

    function addSunTrailDot(x, y) {
      const face = document.getElementById("face");
      const dot = document.createElement("div");
      dot.className = "trail-dot sun-trail";
      dot.style.left = `calc(50% + ${x}px)`;
      dot.style.top = `calc(50% + ${y}px)`;
      face.appendChild(dot);

      const list = trailState.sun;
      list.push(dot);

      const maxDots = 3800;
      while (list.length > maxDots) {
        list.shift().remove();
      }

      list.forEach((item, index) => {
        const age = (index + 1) / list.length;
        item.style.opacity = String(0.16 + age * 0.62);
      });
    }

    function addMoonTrailPoint(x, y) {
      const path = document.getElementById("moonTrailPath");
      if (!path) return;

      const point = `${125 + x},${125 + y}`;
      trailState.moonPoints.push(point);

      const maxMoonPoints = 3800;
      while (trailState.moonPoints.length > maxMoonPoints) {
        trailState.moonPoints.shift();
      }

      path.setAttribute("points", trailState.moonPoints.join(" "));
    }

    function recordTrails(sunX, sunY, moonX, moonY) {
      if (isLiveTime) return;

      const nowReal = performance.now();
      const trailInterval = Math.abs(timeSpeed) >= 525949 ? 30 : 90;
      if (nowReal - trailState.lastStamp < trailInterval) return;
      trailState.lastStamp = nowReal;

      addSunTrailDot(sunX, sunY);

    function updateLunarEclipse(date, moonPosition) {

      const status = document.getElementById("eclipseStatus");
      const moonLightEl = document.getElementById("moonLight");
      if (!shadow || !status || !moonLightEl) return;

      moonLightEl.style.background = "white";
      moonLightEl.style.filter = "none";
      moonLightEl.style.opacity = "1";
      shadow.style.opacity = "0";
      status.textContent = "";

      if (!eclipseMode) return;

      /*
        Calibrated to NASA/GSFC contact times for the
        2026 Aug 28 partial lunar eclipse (UTC):
        P1 01:23:55
        U1 02:33:48
        MAX 04:12:49
        U4 05:51:55
        P4 07:01:41
      */
      const P1  = Date.parse("2026-08-28T01:23:55Z");
      const U1  = Date.parse("2026-08-28T02:33:48Z");
      const MAX = Date.parse("2026-08-28T04:12:49Z");
      const U4  = Date.parse("2026-08-28T05:51:55Z");
      const P4  = Date.parse("2026-08-28T07:01:41Z");

      const t = date.getTime();

      if (t < P1 || t > P4) return;

      let eclipseStrength = 0;
      let umbraStrength = 0;

      if (t < U1) {
        eclipseStrength = (t - P1) / (U1 - P1);
        status.textContent = "PENUMBRA";
      } else if (t <= MAX) {
        eclipseStrength = 1;
        umbraStrength = (t - U1) / (MAX - U1);
        status.textContent = "UMBRA";
      } else if (t <= U4) {
        eclipseStrength = 1;
        umbraStrength = (U4 - t) / (U4 - MAX);
        status.textContent = "UMBRA";
      } else {
        eclipseStrength = (P4 - t) / (P4 - U4);
        status.textContent = "PENUMBRA";
      }

      eclipseStrength = Math.max(0, Math.min(1, eclipseStrength));
      umbraStrength = Math.max(0, Math.min(1, umbraStrength));

      if (status.textContent === "PENUMBRA") {
        moonLightEl.style.filter =
          `brightness(${(1 - 0.28 * eclipseStrength).toFixed(2)})`;
        shadow.style.opacity = String(0.10 + 0.18 * eclipseStrength);
      } else {
        // At maximum, ~93% of the Moon's diameter is in the umbra.
        // Visually sweep a large dark reddish shadow across the enlarged Moon.
        const maxCoverage = 0.93;
        const coverage = maxCoverage * umbraStrength;

        moonLightEl.style.filter =
          `brightness(${(0.78 - 0.48 * coverage).toFixed(2)}) ` +
          `sepia(${(0.20 + 0.65 * coverage).toFixed(2)})`;

        // Shadow centre moves from left to right across the lunar disk.
        // At maximum it is nearly centred but offset enough to leave a bright sliver.
        let phase;
        if (t <= MAX) {
          phase = (t - U1) / (MAX - U1);
        } else {
          phase = 1 + (t - MAX) / (U4 - MAX);
        }

        const x = -34 + phase * 34;
        const y = -2 + 4 * Math.sin(phase * Math.PI);

        shadow.style.transform =
          `translate(-50%, -50%) translate(${x.toFixed(1)}px, ${y.toFixed(1)}px)`;
        shadow.style.opacity = String(0.68 + 0.28 * coverage);

        moonLightEl.style.background =
          `rgb(${Math.round(245 - 150 * coverage)},` +
          `${Math.round(242 - 175 * coverage)},` +
          `${Math.round(238 - 190 * coverage)})`;
      }
    }

  const declination = Math.asin(
    Math.sin(eclipticLatitude) * Math.cos(obliquity) +
      Math.cos(eclipticLatitude) * Math.sin(obliquity) * Math.sin(eclipticLongitude)
  );
  const observerLatitude = latitudeDegrees * radians;
  const westLongitude = -longitudeDegrees * radians;
  const siderealTime = (280.16 + 360.9856235 * daysSinceJ2000) * radians - westLongitude;
  const hourAngle = siderealTime - rightAscension;
  const altitude = Math.asin(
    Math.sin(observerLatitude) * Math.sin(declination) +
      Math.cos(observerLatitude) * Math.cos(declination) * Math.cos(hourAngle)
  );
  const southBasedAzimuth = Math.atan2(
    Math.sin(hourAngle),
    Math.cos(hourAngle) * Math.sin(observerLatitude) -
      Math.tan(declination) * Math.cos(observerLatitude)
  );
  const azimuthDegrees = ((southBasedAzimuth / radians + 180) % 360 + 360) % 360;
  return {
    azimuth: azimuthDegrees,
    altitude: altitude / radians,
    eclipticLongitude: ((eclipticLongitude / radians) % 360 + 360) % 360,
    eclipticLatitude: eclipticLatitude / radians,
    rightAscension: ((rightAscension / radians) % 360 + 360) % 360,
    declination: declination / radians
  };
}

const moonPosition = getMoonPosition(now, 53.32, -3.49);
updateLunarEclipse(now, moonPosition);
const moonAzimuth = moonPosition.azimuth;
const moonAltitude = moonPosition.altitude;
/*
  Use the clock disc as the whole sky dome.

  Horizon sits near the rim.
  As the Moon moves either upward or downward away from the horizon,
  she travels inward across the disc.
*/
const moonHorizonRadius = 109;
const moonZenithRadius = 26;
const displayedMoonAltitude = Math.max(-90, Math.min(90, moonAltitude));
const moonRadius = moonHorizonRadius -
  (Math.abs(displayedMoonAltitude) / 90) *
  (moonHorizonRadius - moonZenithRadius);
const moonX = Math.sin(moonAzimuth * Math.PI / 180) * moonRadius;
const moonY = -Math.cos(moonAzimuth * Math.PI / 180) * moonRadius;
moon.style.transform =
  `translate(calc(-50% + ${moonX}px), calc(-50% + ${moonY}px))`;
if (moonAltitude < 0) {
  moon.style.zIndex = "0";
  moon.style.opacity = "0.55";
  moon.style.filter = "blur(0.35px)";
} else {
  moon.style.zIndex = "10";
  moon.style.opacity = "1";
  moon.style.filter = "none";
}

/* Basic offline Moon phase. */
const knownNewMoon = new Date("2024-01-11T11:57:00Z");
const moonCycleDays = 29.530588853;
const daysSinceNewMoon = (now - knownNewMoon) / (1000 * 60 * 60 * 24);
const moonPhase = ((daysSinceNewMoon / moonCycleDays) % 1 + 1) % 1;
const phaseAngle = moonPhase * 2 * Math.PI;
const illumination = (1 - Math.cos(phaseAngle)) / 2;
const waxing = moonPhase < 0.5;
const lightWidth = Math.max(0.04, illumination);
moonLight.style.transform = `scaleX(${lightWidth})`;
moonLight.style.transformOrigin = waxing ? "right center" : "left center";

clock.style.color = "#dddddd";const sun = document.getElementById("sun");

/*
  Real solar azimuth for Rhyl.
  Azimuth is measured clockwise from true north:
  north = 0°, east = 90°, south = 180°, west = 270°.
*/
const latitude = 53.32;
const longitude = -3.49;

function degreesToRadians(degrees) {
  return degrees * Math.PI / 180;
}

function radiansToDegrees(radians) {
  return radians * 180 / Math.PI;
}

function normaliseDegrees(degrees) {
  return ((degrees % 360) + 360) % 360;
}

function getSolarPosition(date, latitudeDegrees, longitudeDegrees) {
  const julianDate = date.getTime() / 86400000 + 2440587.5;
  const julianCentury = (julianDate - 2451545.0) / 36525;

  const geometricMeanLongitude = normaliseDegrees(
    280.46646 +
    julianCentury * (36000.76983 + julianCentury * 0.0003032)
  );

  const geometricMeanAnomaly =
    357.52911 +
    julianCentury * (35999.05029 - 0.0001537 * julianCentury);

  const eccentricity =
    0.016708634 -
    julianCentury * (0.000042037 + 0.0000001267 * julianCentury);

  const anomalyRadians = degreesToRadians(geometricMeanAnomaly);

  const equationOfCentre =
    Math.sin(anomalyRadians) *
      (1.914602 - julianCentury * (0.004817 + 0.000014 * julianCentury)) +
    Math.sin(2 * anomalyRadians) *
      (0.019993 - 0.000101 * julianCentury) +
    Math.sin(3 * anomalyRadians) * 0.000289;

  const trueLongitude = geometricMeanLongitude + equationOfCentre;

  const omega = 125.04 - 1934.136 * julianCentury;
  const apparentLongitude =
    trueLongitude -
    0.00569 -
    0.00478 * Math.sin(degreesToRadians(omega));

  const meanObliquity =
    23 +
    (26 +
      (21.448 -
        julianCentury *
          (46.815 +
            julianCentury * (0.00059 - julianCentury * 0.001813))) /
        60) /
      60;

  const correctedObliquity =
    meanObliquity +
    0.00256 * Math.cos(degreesToRadians(omega));

  const declination = Math.asin(
    Math.sin(degreesToRadians(correctedObliquity)) *
    Math.sin(degreesToRadians(apparentLongitude))
  );

  const y = Math.tan(degreesToRadians(correctedObliquity) / 2) ** 2;

  const equationOfTime = 4 * radiansToDegrees(
    y * Math.sin(2 * degreesToRadians(geometricMeanLongitude)) -
    2 * eccentricity * Math.sin(anomalyRadians) +
    4 * eccentricity * y *
      Math.sin(anomalyRadians) *
      Math.cos(2 * degreesToRadians(geometricMeanLongitude)) -
    0.5 * y * y *
      Math.sin(4 * degreesToRadians(geometricMeanLongitude)) -
    1.25 * eccentricity * eccentricity *
      Math.sin(2 * anomalyRadians)
  );

  const utcMinutes =
    date.getUTCHours() * 60 +
    date.getUTCMinutes() +
    date.getUTCSeconds() / 60;

  const trueSolarTime = normaliseDegrees(
    (utcMinutes + equationOfTime + 4 * longitudeDegrees) / 4
  ) * 4;

  let hourAngle = trueSolarTime / 4 - 180;
  if (hourAngle < -180) hourAngle += 360;

  const latitudeRadians = degreesToRadians(latitudeDegrees);
  const hourAngleRadians = degreesToRadians(hourAngle);

const azimuth = radiansToDegrees(
  Math.atan2(
    Math.sin(hourAngleRadians),
    Math.cos(hourAngleRadians) * Math.sin(latitudeRadians) -
    Math.tan(declination) * Math.cos(latitudeRadians)
  )
) + 180;

const altitude = radiansToDegrees(
  Math.asin(
    Math.sin(latitudeRadians) * Math.sin(declination) +
    Math.cos(latitudeRadians) *
    Math.cos(declination) *
    Math.cos(hourAngleRadians)
  )
);

return {
  azimuth: normaliseDegrees(azimuth),
  altitude: altitude
};
}

const sunPosition =
  getSolarPosition(now, latitude, longitude);

const sunAngle = sunPosition.azimuth;
const sunAltitude = sunPosition.altitude;

/*
  Use the same sky-dome logic for the Sun.

  Horizon sits near the rim.
  As the Sun rises or sinks away from the horizon,
  it moves inward across the face.
*/
const displayAltitude =
  Math.max(-90, Math.min(90, sunAltitude));

const sunHorizonRadius = 119;
const sunZenithRadius = 24;

const sunRadius =
  sunHorizonRadius -
  (Math.abs(displayAltitude) / 90) *
  (sunHorizonRadius - sunZenithRadius);

const sunX =
  Math.sin(degreesToRadians(sunAngle)) * sunRadius;

const sunY =
  -Math.cos(degreesToRadians(sunAngle)) * sunRadius;

sun.style.transform =
  `translate(calc(-50% + ${sunX}px), calc(-50% + ${sunY}px))`;

recordTrails(sunX, sunY, moonX, moonY);

if (sunAltitude < 0) {
  /*
    The face plate already darkens the hidden Sun.
    Keep the Sun itself fairly strong so it remains traceable.
  */
  sun.style.zIndex = "0";
  sun.style.opacity = "0.95";
  sun.style.filter = "brightness(1.35)";
  sun.style.boxShadow = "0 0 4px rgba(255,215,0,0.9)";
} else {
  sun.style.zIndex = "9";
  sun.style.opacity = "1";
  sun.style.filter = "none";
  sun.style.boxShadow = "none";
}  }
