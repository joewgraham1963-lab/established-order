<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ikeda Attractor</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #848484;
      text-align: center;
      font-family: Arial, sans-serif;
    }

    h1 {
      margin: 14px 0 8px;
    }

    canvas {
      display: block;
      margin: 0 auto 12px;
      width: min(94vw, 700px);
      height: auto;
      background: #050505;
    }

    #info {
      margin-bottom: 18px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<h1>Ikeda Attractor</h1>

<canvas id="canvas" width="600" height="600"></canvas>

<div id="info">Chaos accumulating...</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const width = canvas.width;
const height = canvas.height;

let x = 0.1;
let y = 0.1;

let u = 0.95;
let points = 0;

function plot() {

  for (let i = 0; i < 1200; i++) {

    const t =
      0.4 -
      6 /
      (1 + x * x + y * y);

    const nextX =
      1 +
      u *
      (
        x * Math.cos(t) -
        y * Math.sin(t)
      );

    const nextY =
      u *
      (
        x * Math.sin(t) +
        y * Math.cos(t)
      );

    x = nextX;
    y = nextY;

    const px =
      width / 2 +
      x * 115;

    const py =
      height / 2 -
      y * 115;

ctx.fillStyle = "rgba(255,255,255,0.25)";
ctx.fillRect(px, py, 1, 1); 

    points++;
  }

  document.getElementById("info").textContent =
    "Points: " + points.toLocaleString() +
    "   u = " + u.toFixed(4);

  requestAnimationFrame(plot);
}

plot();
</script>

</body>
</html>
