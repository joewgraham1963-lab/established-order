<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clifford Attractor</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #848484;
      text-align: center;
      font-family: Arial, sans-serif;
    }

    h1 {
      margin: 14px 0 8px;
    }

    canvas {
      display: block;
      margin: 0 auto 12px;
      width: min(94vw, 700px);
      height: auto;
      background: black;
    }

    #info {
      margin-bottom: 18px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<h1>Clifford Attractor</h1>

<canvas id="canvas" width="600" height="600"></canvas>

<div id="info">Chaos accumulating...</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const width = canvas.width;
const height = canvas.height;

let x = 0.01;
let y = 0.01;

// Starting parameters
let a = 10;
let b = 1.8;
const c = -1.2;
const d =  1.618033988750;

let time = 0;
let points = 0;

function plot() {

  // Slowly change two parameters so the attractor morphs.
  time += 0.002;
  a = -1.7 + Math.sin(time) * 0.15;
  b =  1.8 + Math.cos(time * 0.7) * 0.15;

  // Fade the previous image instead of erasing it completely.
  ctx.fillStyle = "rgba(0, 0, 0, 0.03)";
  ctx.fillRect(0, 0, width, height);

  for (let i = 0; i < 3000; i++) {

    const nextX =
      Math.sin(a * y) +
      c * Math.cos(a * x);

    const nextY =
      Math.sin(b * x) +
      d * Math.cos(b * y);

    x = nextX;
    y = nextY;

    const px =
      width / 2 + x * 130;

    const py =
      height / 2 - y * 130;

    const hue =
  (points * 0.01 + x * 70 + y * 50) % 360;

ctx.fillStyle =
  `hsla(${hue}, 100%, 65%, 0.35)`;

ctx.fillRect(px, py, 1, 1);

    ctx.fillStyle =
      `hsla(${hue}, 100%, 70%, 0.12)`;

    ctx.fillRect(px, py, 1, 1);

    points++;
  }

  document.getElementById("info").textContent =
    "Points: " + points.toLocaleString() +
    "   a = " + a.toFixed(3) +
    "   b = " + b.toFixed(3);

  requestAnimationFrame(plot);
}

plot();
</script>

</body>
</html>
