<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chaos Game</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #848484;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 14px 0 8px;
    }

    canvas {
      display: block;
      margin: 0 auto 12px;
      width: min(92vw, 600px);
      height: auto;
      background: #111;
    }

    #count {
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

<h1>Chaos Game</h1>

<canvas id="canvas" width="600" height="600"></canvas>

<div id="count">Points: 0</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const vertices = [
  { x: 300, y: 40 },
  { x: 40, y: 560 },
  { x: 560, y: 560 }
];

// Draw the three starting corners
ctx.fillStyle = "white";

for (const v of vertices) {
  ctx.beginPath();
  ctx.arc(v.x, v.y, 4, 0, Math.PI * 2);
  ctx.fill();
}

// Start somewhere random
let x = Math.random() * canvas.width;
let y = Math.random() * canvas.height;

let points = 0;

function draw() {

  // Draw several points per animation frame
  for (let i = 0; i < 60; i++) {

    const chosen =
      vertices[
        Math.floor(Math.random() * vertices.length)
      ];

    // Move halfway toward the chosen corner
    x = (x + chosen.x) / 2;
    y = (y + chosen.y) / 2;

    ctx.fillRect(x, y, 1, 1);

    points++;
  }

  document.getElementById("count").textContent =
    "Points: " + points.toLocaleString();

  requestAnimationFrame(draw);
}

draw();
</script>

</body>
</html>
