<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Julia Set</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #848484;
      text-align: center;
      font-family: Arial, sans-serif;
    }

    h1 {
      margin: 14px 0 8px;
    }

    canvas {
      display: block;
      margin: 0 auto 12px;
      width: min(92vw, 500px);
      height: auto;
      background: black;
    }

    #info {
      margin-bottom: 20px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<h1>Animated Julia Set</h1>

<canvas id="julia" width="400" height="400"></canvas>

<div id="info"></div>

<script>
const canvas = document.getElementById("julia");
const ctx = canvas.getContext("2d");

const width = canvas.width;
const height = canvas.height;

const image = ctx.createImageData(width, height);
const pixels = image.data;

const maxIterations = 90;

let t = 0;

function drawJulia(cReal, cImag) {

  for (let py = 0; py < height; py++) {

    for (let px = 0; px < width; px++) {

      let x =
        (px - width / 2) /
        (0.32 * width);

      let y =
        (py - height / 2) /
        (0.32 * height);

      let iteration = 0;

      while (
        x * x + y * y <= 4 &&
        iteration < maxIterations
      ) {

        const xNew =
          x * x - y * y + cReal;

        y =
          2 * x * y + cImag;

        x = xNew;

        iteration++;
      }

      const index =
        (py * width + px) * 4;

      if (iteration === maxIterations) {

        pixels[index] = 0;
        pixels[index + 1] = 0;
        pixels[index + 2] = 0;

      } else {

        const shade =
          Math.floor(
            255 * iteration / maxIterations
          );

        pixels[index] =
          (shade * 3) % 255;

        pixels[index + 1] =
          255 - shade;

        pixels[index + 2] =
          (shade * 2) % 255;
      }

      pixels[index + 3] = 255;
    }
  }

  ctx.putImageData(image, 0, 0);
}

function animate() {

  const cReal =
    -0.7 + 0.18 * Math.cos(t);

  const cImag =
    0.22 * Math.sin(t * 0.83);

  drawJulia(cReal, cImag);

  document.getElementById("info").textContent =
    "c = " +
    cReal.toFixed(4) +
    " + " +
    cImag.toFixed(4) +
    "i";

  t += 0.0012;

  requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
