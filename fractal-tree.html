<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Burning Ship</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #848484;
      text-align: center;
      font-family: Arial, sans-serif;
    }

    h1 {
      margin: 14px 0 8px;
    }

    canvas {
      display: block;
      margin: 0 auto 20px;
      width: min(94vw, 700px);
      height: auto;
      background: black;
    }
  </style>
</head>

<body>

<h1>Burning Ship</h1>

<canvas id="ship" width="500" height="500"></canvas>

<script>
const canvas = document.getElementById("ship");
const ctx = canvas.getContext("2d");

const width = canvas.width;
const height = canvas.height;

const image = ctx.createImageData(width, height);
const pixels = image.data;

const maxIterations = 120;

let t = 0;

function drawFractal() {

  const zoom = 1.1 + 0.25 * Math.sin(t * 0.7);

  const centreX = -1.75 + 0.05 * Math.cos(t * 0.3);
  const centreY = -0.04 + 0.05 * Math.sin(t * 0.4);

  for (let py = 0; py < height; py++) {

    for (let px = 0; px < width; px++) {

      const cx =
        centreX +
        (px - width / 2) /
        (width * zoom);

      const cy =
        centreY +
        (py - height / 2) /
        (height * zoom);

      let x = 0;
      let y = 0;

      let iteration = 0;

      while (
        x * x + y * y <= 4 &&
        iteration < maxIterations
      ) {

        x = Math.abs(x);
        y = Math.abs(y);

        const xNew =
          x * x - y * y + cx;

        y =
          2 * x * y + cy;

        x = xNew;

        iteration++;
      }

      const index =
        (py * width + px) * 4;

      if (iteration === maxIterations) {

        pixels[index] = 0;
        pixels[index + 1] = 0;
        pixels[index + 2] = 0;

      } else {

        const shade =
          Math.floor(
            255 * iteration / maxIterations
          );

        pixels[index] =
          (shade * 5) % 255;

        pixels[index + 1] =
          (shade * 2) % 255;

        pixels[index + 2] =
          255 - shade;
      }

      pixels[index + 3] = 255;
    }
  }

  ctx.putImageData(image, 0, 0);

  t += 0.02;

  requestAnimationFrame(drawFractal);
}

drawFractal();
</script>

</body>
</html>
