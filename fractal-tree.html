<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fractal Spiral</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #848484;
      text-align: center;
      font-family: Arial, sans-serif;
    }

    h1 {
      margin: 14px 0 8px;
    }

    canvas {
      display: block;
      margin: 0 auto 20px;
      width: min(94vw, 700px);
      height: auto;
      background: #111;
    }
  </style>
</head>

<body>

<h1>Fractal Spiral</h1>

<canvas id="spiral" width="700" height="700"></canvas>

<script>
const canvas = document.getElementById("spiral");
const ctx = canvas.getContext("2d");

const centreX = canvas.width / 2;
const centreY = canvas.height / 2;

let frame = 0;

function drawBranch(x, y, length, angle, depth) {

  if (depth <= 0 || length < 2) return;

  const endX = x + Math.cos(angle) * length;
  const endY = y + Math.sin(angle) * length;

  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(endX, endY);
  ctx.stroke();

  drawBranch(
    endX,
    endY,
    length * 0.76,
    angle + 0.48,
    depth - 1
  );

  drawBranch(
    endX,
    endY,
    length * 0.62,
    angle - 0.8,
    depth - 1
  );
}

function animate() {

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.lineWidth = 1.5;
  ctx.strokeStyle = "white";

  const rotation = frame * 0.01;

  const arms = 7;

  for (let i = 0; i < arms; i++) {

    const angle =
      rotation +
      (Math.PI * 2 / arms) * i;

    drawBranch(
      centreX,
      centreY,
      120,
      angle,
      10
    );
  }

  frame++;

  requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
