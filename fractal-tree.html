<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Julia Set II</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #848484;
      text-align: center;
      font-family: Arial, sans-serif;
    }

    h1 {
      margin: 16px 0 8px;
    }

    canvas {
      display: block;
      margin: 0 auto 20px;
      max-width: 100%;
      background: black;
    }
  </style>
</head>

<body>

<h1>Julia Set II</h1>

<canvas id="julia" width="700" height="700"></canvas>

<script>
const canvas = document.getElementById("julia");
const ctx = canvas.getContext("2d");

const width = canvas.width;
const height = canvas.height;

const image = ctx.createImageData(width, height);
const pixels = image.data;

/*
   Change these two numbers for completely
   different Julia sets.
*/
let t = 0;

function animate() {
  const cReal = -0.7 + 0.2 * Math.cos(t);
  const cImag =  0.2 * Math.sin(t);

  drawJulia(cReal, cImag);

  t += 0.01;

  requestAnimationFrame(animate);
}

animate();

const maxIterations = 180;

const zoom = 1.45;

for (let py = 0; py < height; py++) {

  for (let px = 0; px < width; px++) {

    let x =
      (px - width / 2) /
      (0.5 * zoom * width);

    let y =
      (py - height / 2) /
      (0.5 * zoom * height);

    let iteration = 0;

    while (
      x * x + y * y <= 4 &&
      iteration < maxIterations
    ) {

      const xNew =
        x * x - y * y + cReal;

      y =
        2 * x * y + cImag;

      x = xNew;

      iteration++;
    }

    const index = (py * width + px) * 4;

    if (iteration === maxIterations) {

      pixels[index] = 0;
      pixels[index + 1] = 0;
      pixels[index + 2] = 0;

    } else {

      const shade =
        Math.floor(
          255 * iteration / maxIterations
        );

      pixels[index] = shade;
      pixels[index + 1] = 255 - shade;
      pixels[index + 2] =
        (shade * 2) % 255;
    }

    pixels[index + 3] = 255;
  }
}

ctx.putImageData(image, 0, 0);
</script>

</body>
</html>
