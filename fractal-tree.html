<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fractal Tree</title>

  <style>
    body {
      margin: 0;
      background: #848484;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin-top: 20px;
    }

    canvas {
      background: #848484;
      display: block;
      margin: 20px auto;
      max-width: 100%;
    }
  </style>
</head>

<body>

  <h1>Fractal Tree</h1>

  <canvas id="tree" width="700" height="700"></canvas>
<script>
const canvas = document.getElementById("tree");
const ctx = canvas.getContext("2d");

ctx.lineWidth = 4;
ctx.lineCap = "round";

let branches = [
  {
    x: canvas.width / 2,
    y: canvas.height - 20,
    length: 160,
    angle: -Math.PI / 2
  }
];

let depth = 0;
const maxDepth = 100;

function drawGeneration() {

  if (depth >= maxDepth) return;

  const newBranches = [];

  for (const branch of branches) {

    const endX =
      branch.x + Math.cos(branch.angle) * branch.length;

    const endY =
      branch.y + Math.sin(branch.angle) * branch.length;

    ctx.beginPath();
    ctx.moveTo(branch.x, branch.y);
    ctx.lineTo(endX, endY);
    ctx.stroke();

    const newLength = branch.length * 1.1;

    newBranches.push({
      x: endX,
      y: endY,
      length: newLength,
      angle: branch.angle - 0.5
    });

    newBranches.push({
      x: endX,
      y: endY,
      length: newLength,
      angle: branch.angle + 0.5
    });
  }

  branches = newBranches;
  depth++;

  setTimeout(drawGeneration, 1000);
}

drawGeneration();
</script>
</body>
</html>
