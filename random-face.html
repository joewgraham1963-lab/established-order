<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Portrait Sketch V4</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #848484;
      text-align: center;
      font-family: Arial, sans-serif;
    }

    h1 {
      margin: 18px 0 10px;
      font-size: clamp(30px, 7vw, 54px);
    }

    canvas {
      display: block;
      margin: 0 auto 18px;
      width: min(92vw, 620px);
      height: auto;
      background: #d9d9d9;
      border: 2px solid #222;
    }

    button {
      font-size: 23px;
      padding: 15px 26px;
      border-radius: 18px;
      border: 2px solid #222;
      background: #efefef;
      margin-bottom: 28px;
    }
  </style>
</head>
<body>

<h1>Random Portrait Sketch</h1>
<canvas id="portrait" width="620" height="720"></canvas>
<button id="generate">Generate portrait</button>

<script>
const canvas = document.getElementById("portrait");
const ctx = canvas.getContext("2d");

function rand(min, max) {
  return Math.random() * (max - min) + min;
}

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function chance(p) {
  return Math.random() < p;
}

function drawPortrait() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const cx = canvas.width / 2;
  const cy = 330;

  // More variation in overall skull / face proportions
  const faceW = rand(200, 320);
  const faceH = rand(300, 405);
  const templeW = rand(0.82, 1.08);
  const jawW = rand(0.52, 0.90);
  const chinPoint = rand(0.92, 1.10);
  const cheekBulge = rand(0.22, 0.34);
  const tilt = rand(-0.06, 0.06);

  // Much broader eye spacing variation
  const eyeY = cy - rand(68, 95);
  const eyeGap = rand(40, 78);
  const eyeW = rand(36, 58);
  const eyeH = rand(10, 18);

  const browY = eyeY - rand(22, 36);
  const noseTop = eyeY + rand(18, 32);
  const noseBottom = cy + rand(20, 58);

  const mouthY = cy + rand(82, 122);
  const mouthW = rand(58, 108);
  const lipH = rand(7, 16);

  const neckW = rand(70, 118);
  const shoulderHeight = rand(618, 655);

  const skin = pick(["#e0c3a7", "#d2b49a", "#c9a985", "#b98d68", "#9f7457", "#7f5b45"]);
  const skinShadow = pick([
    "rgba(80,55,40,0.10)",
    "rgba(60,45,35,0.14)",
    "rgba(90,65,45,0.09)",
    "rgba(70,50,38,0.12)"
  ]);
  const hair = pick(["#1d1b1a", "#3a2c22", "#6a4d34", "#9d8a72", "#444444", "#8e6d51"]);
  const iris = pick(["#2f3b25", "#3b2c1e", "#4a5a63", "#5d6f4f", "#302b28", "#6a593b"]);
  const topColor = pick(["#555", "#4c5b6a", "#6a5050", "#4d4d4d", "#5c4d40", "#687063"]);

  const noseStyle = pick(["straight", "hooked", "broad", "button"]);
  const hairStyle = pick(["short", "swept", "curly", "receding", "none"]);
  const mouthStyle = pick(["neutral", "thin", "full", "smirk"]);

  // Expression and apparent age
  const expression = pick(["neutral", "friendly", "serious", "tired", "skeptical"]);
  const age = rand(20, 78);
  const ageFactor = Math.max(0, Math.min(1, (age - 20) / 58));

  const browLift = {
    neutral: 0,
    friendly: -3,
    serious: 4,
    tired: 7,
    skeptical: 0
  }[expression];

  const mouthMood = {
    neutral: 0,
    friendly: 5,
    serious: -3,
    tired: -1,
    skeptical: 2
  }[expression];

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(tilt);
  ctx.translate(-cx, -cy);

  // Neck
  ctx.fillStyle = skin;
  ctx.beginPath();
  ctx.moveTo(cx - neckW / 2, cy + faceH * 0.34);
  ctx.lineTo(cx - neckW * 0.58, shoulderHeight);
  ctx.lineTo(cx + neckW * 0.58, shoulderHeight);
  ctx.lineTo(cx + neckW / 2, cy + faceH * 0.34);
  ctx.closePath();
  ctx.fill();

  // Clothing / shoulders
  ctx.fillStyle = topColor;
  ctx.beginPath();
  ctx.moveTo(90, 720);
  ctx.quadraticCurveTo(cx - 120, shoulderHeight - 35, cx - neckW * 0.55, shoulderHeight - 8);
  ctx.lineTo(cx + neckW * 0.55, shoulderHeight - 8);
  ctx.quadraticCurveTo(cx + 120, shoulderHeight - 35, 530, 720);
  ctx.closePath();
  ctx.fill();

  // Head outline
  ctx.fillStyle = skin;
  ctx.strokeStyle = "rgba(35,35,35,0.88)";
  ctx.lineWidth = 2.3;
  ctx.beginPath();
  ctx.moveTo(cx, cy - faceH / 2);
  ctx.bezierCurveTo(
    cx - faceW * 0.48 * templeW, cy - faceH * 0.47,
    cx - faceW * 0.59, cy - faceH * 0.10,
    cx - faceW * cheekBulge, cy + faceH * 0.20
  );
  ctx.bezierCurveTo(
    cx - faceW * 0.28, cy + faceH * 0.40,
    cx - faceW * jawW * 0.18, cy + faceH * 0.49,
    cx, cy + faceH * 0.52 * chinPoint
  );
  ctx.bezierCurveTo(
    cx + faceW * jawW * 0.18, cy + faceH * 0.49,
    cx + faceW * 0.28, cy + faceH * 0.40,
    cx + faceW * cheekBulge, cy + faceH * 0.20
  );
  ctx.bezierCurveTo(
    cx + faceW * 0.59, cy - faceH * 0.10,
    cx + faceW * 0.48 * templeW, cy - faceH * 0.47,
    cx, cy - faceH / 2
  );
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Soft cheek shading
  ctx.fillStyle = skinShadow;
  ctx.beginPath();
  ctx.ellipse(cx - faceW * 0.26, cy + rand(4, 24), faceW * 0.12, faceH * 0.11, -0.18, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx + faceW * 0.26, cy + rand(4, 24), faceW * 0.12, faceH * 0.11, 0.18, 0, Math.PI * 2);
  ctx.fill();

  // Ears
  const earY = cy + rand(-12, 8);
  const earHLeft = rand(62, 96);
  const earHRight = rand(62, 96);
  ctx.strokeStyle = "rgba(35,35,35,0.68)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(cx - faceW * 0.47, earY + rand(-4, 4), rand(15, 22), earHLeft / 2, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx - faceW * 0.47, earY, 10, -1.4, 1.4);
  ctx.stroke();

  ctx.beginPath();
  ctx.ellipse(cx + faceW * 0.47, earY + rand(-4, 4), rand(15, 22), earHRight / 2, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx + faceW * 0.47, earY, 10, -1.4, 1.4);
  ctx.stroke();

  // Eyes
  function drawEye(x, y, w, h, asym) {
    ctx.strokeStyle = "rgba(25,25,25,0.95)";
    ctx.fillStyle = "#f4f1ea";
    ctx.lineWidth = 2.1;

    ctx.beginPath();
    ctx.moveTo(x - w / 2, y);
    ctx.quadraticCurveTo(x, y - h - asym, x + w / 2, y);
    ctx.quadraticCurveTo(x, y + h * 0.68, x - w / 2, y);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    const irisOffset = rand(-2.8, 2.8);
    ctx.fillStyle = iris;
    ctx.beginPath();
    ctx.arc(x + irisOffset, y + 1, h * 0.62, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#111";
    ctx.beginPath();
    ctx.arc(x + irisOffset, y + 1, h * 0.28, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.beginPath();
    ctx.arc(x + irisOffset + 3, y - 3, 2.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "rgba(40,30,25,0.75)";
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.moveTo(x - w / 2 + 3, y + h * 0.92);
    ctx.quadraticCurveTo(x, y + h * 1.25, x + w / 2 - 3, y + h * 0.88);
    ctx.stroke();
  }

  const eyeOpen = Math.max(0.72, 1 - ageFactor * 0.18 - (expression === "tired" ? 0.18 : 0));
  const leftEyeH = eyeH * eyeOpen;
  const rightEyeH = eyeH * eyeOpen * (expression === "skeptical" ? rand(0.82, 1.02) : rand(0.95, 1.05));

  drawEye(
    cx - eyeGap,
    eyeY + rand(-2, 2),
    eyeW * rand(0.92, 1.08),
    leftEyeH,
    rand(-1.5, 1.5)
  );

  drawEye(
    cx + eyeGap,
    eyeY + rand(-2, 2),
    eyeW * rand(0.92, 1.08),
    rightEyeH,
    rand(-1.5, 1.5)
  );

  // Under-eye shading grows subtly with age
  ctx.strokeStyle = `rgba(70,50,40,${0.06 + ageFactor * 0.14})`;
  ctx.lineWidth = 1.2;
  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.arc(
      cx + side * eyeGap,
      eyeY + eyeH * 1.05,
      eyeW * 0.32,
      0.15,
      Math.PI - 0.15
    );
    ctx.stroke();
  }

  // Brows, with expression
  ctx.strokeStyle = hair;
  ctx.lineWidth = rand(4, 7);
  ctx.lineCap = "round";

  const skepticalRaise = expression === "skeptical" ? rand(7, 13) : 0;

  ctx.beginPath();
  ctx.moveTo(cx - eyeGap - eyeW * 0.48, browY + browLift + rand(-2, 4));
  ctx.quadraticCurveTo(
    cx - eyeGap,
    browY + browLift - rand(2, 10) - skepticalRaise,
    cx - eyeGap + eyeW * 0.48,
    browY + browLift + rand(-1, 5)
  );
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(cx + eyeGap - eyeW * 0.48, browY + browLift + rand(-1, 5));
  ctx.quadraticCurveTo(
    cx + eyeGap,
    browY + browLift - rand(2, 10) + skepticalRaise,
    cx + eyeGap + eyeW * 0.48,
    browY + browLift + rand(-2, 4)
  );
  ctx.stroke();

  // Nose - several different styles
  ctx.strokeStyle = "rgba(55,40,30,0.62)";
  ctx.lineWidth = 2;

  if (noseStyle === "straight") {
    ctx.beginPath();
    ctx.moveTo(cx - rand(1, 5), noseTop);
    ctx.lineTo(cx - rand(5, 12), noseBottom - 8);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx - rand(16, 22), noseBottom + 1);
    ctx.quadraticCurveTo(cx, noseBottom + rand(8, 14), cx + rand(16, 22), noseBottom + 1);
    ctx.stroke();
  }

  if (noseStyle === "hooked") {
    ctx.beginPath();
    ctx.moveTo(cx - rand(1, 5), noseTop);
    ctx.bezierCurveTo(cx + rand(6, 10), cy - 10, cx + rand(14, 20), noseBottom - 15, cx + rand(6, 10), noseBottom);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx - 10, noseBottom + 1);
    ctx.quadraticCurveTo(cx + 8, noseBottom + rand(10, 16), cx + rand(18, 24), noseBottom + 2);
    ctx.stroke();
  }

  if (noseStyle === "broad") {
    ctx.beginPath();
    ctx.moveTo(cx - rand(3, 8), noseTop);
    ctx.bezierCurveTo(cx - 10, cy - 8, cx - 14, noseBottom - 10, cx - 10, noseBottom);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx + rand(2, 5), noseTop + 8);
    ctx.bezierCurveTo(cx + 8, cy - 6, cx + 12, noseBottom - 10, cx + 10, noseBottom);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx - rand(22, 28), noseBottom + 3);
    ctx.quadraticCurveTo(cx, noseBottom + rand(12, 18), cx + rand(22, 28), noseBottom + 3);
    ctx.stroke();
  }

  if (noseStyle === "button") {
    ctx.beginPath();
    ctx.moveTo(cx - rand(2, 6), noseTop);
    ctx.quadraticCurveTo(cx - rand(6, 10), cy + 5, cx - rand(3, 7), noseBottom - 6);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx - rand(12, 18), noseBottom + 5);
    ctx.quadraticCurveTo(cx, noseBottom + rand(10, 14), cx + rand(12, 18), noseBottom + 5);
    ctx.stroke();
  }

  // nostrils
  ctx.fillStyle = "rgba(65,45,30,0.38)";
  ctx.beginPath();
  ctx.ellipse(cx - rand(9, 15), noseBottom + 3, 3.5, 2.2, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx + rand(9, 15), noseBottom + 3, 3.5, 2.2, 0, 0, Math.PI * 2);
  ctx.fill();

  // Mouth / lips with more variation
  ctx.save();
  ctx.translate(cx + rand(-6, 6), mouthY);
  ctx.rotate(rand(-0.05, 0.05));
  ctx.strokeStyle = "rgba(80,30,30,0.85)";
  ctx.fillStyle = "rgba(130,65,65,0.55)";
  ctx.lineWidth = 1.7;

  let topLip = lipH;
  let bottomLip = lipH * 0.85;
  if (mouthStyle === "thin") {
    topLip *= 0.62;
    bottomLip *= 0.65;
  }
  if (mouthStyle === "full") {
    topLip *= 1.35;
    bottomLip *= 1.45;
  }

  ctx.beginPath();
  ctx.moveTo(-mouthW / 2, 0);
  ctx.quadraticCurveTo(-mouthW * 0.18, -topLip, 0, -topLip * 0.45);
  ctx.quadraticCurveTo(mouthW * 0.18, -topLip, mouthW / 2, 0);
  ctx.quadraticCurveTo(mouthW * 0.18, bottomLip, 0, bottomLip * 0.78);
  ctx.quadraticCurveTo(-mouthW * 0.18, bottomLip, -mouthW / 2, 0);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.beginPath();
  let curveOffset = mouthStyle === "smirk" ? rand(-4, 5) : rand(-2, 2);
  curveOffset += mouthMood;

  const rightCorner =
    curveOffset +
    (mouthStyle === "smirk" ? -3 : 0) +
    (expression === "skeptical" ? rand(-5, 5) : 0);

  ctx.moveTo(-mouthW / 2 + 4, 0);
  ctx.quadraticCurveTo(0, curveOffset, mouthW / 2 - 4, rightCorner);
  ctx.stroke();
  ctx.restore();

  // Chin line
  ctx.strokeStyle = "rgba(60,45,35,0.22)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(cx, mouthY + 38, rand(16, 30), 0.2, Math.PI - 0.2);
  ctx.stroke();

  // Age detail: subtle rather than theatrical
  ctx.strokeStyle = "rgba(75,55,45,0.22)";
  ctx.lineWidth = 1;

  if (age > 42) {
    const foreheadLines = Math.floor(rand(1, 1 + ageFactor * 4));
    for (let i = 0; i < foreheadLines; i++) {
      const fy = cy - faceH * 0.30 + i * 9;
      ctx.beginPath();
      ctx.moveTo(cx - faceW * 0.16, fy);
      ctx.quadraticCurveTo(cx, fy + rand(-3, 3), cx + faceW * 0.16, fy);
      ctx.stroke();
    }
  }

  if (age > 35) {
    const crow = 2 + Math.floor(ageFactor * 2);
    for (const side of [-1, 1]) {
      for (let i = 0; i < crow; i++) {
        const ex = cx + side * (eyeGap + eyeW * 0.48);
        const ey = eyeY + i * 5 - 3;
        ctx.beginPath();
        ctx.moveTo(ex, ey);
        ctx.lineTo(ex + side * rand(10, 18), ey + rand(-4, 5));
        ctx.stroke();
      }
    }
  }

  if (age > 48) {
    // light nasolabial lines
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(cx + side * rand(18, 25), noseBottom + 12);
      ctx.quadraticCurveTo(
        cx + side * rand(30, 42),
        mouthY - 20,
        cx + side * rand(34, 48),
        mouthY + 8
      );
      ctx.stroke();
    }
  }

  // Hair and hairline
  // Hair now follows the scalp instead of floating above it.
  ctx.fillStyle = hair;
  ctx.strokeStyle = hair;

  const scalpTop = cy - faceH / 2;
  const leftTemple = cx - faceW * 0.38;
  const rightTemple = cx + faceW * 0.38;
  const hairlineY = scalpTop + rand(42, 72);
  const crownY = scalpTop - rand(10, 38);

  if (hairStyle === "short") {
    ctx.beginPath();
    ctx.moveTo(leftTemple, hairlineY + 8);
    ctx.bezierCurveTo(
      cx - faceW * 0.30, crownY,
      cx + faceW * 0.30, crownY,
      rightTemple, hairlineY + 8
    );
    ctx.bezierCurveTo(
      cx + faceW * 0.20, hairlineY - 4,
      cx + faceW * 0.08, hairlineY + 8,
      cx, hairlineY + 2
    );
    ctx.bezierCurveTo(
      cx - faceW * 0.08, hairlineY + 8,
      cx - faceW * 0.20, hairlineY - 4,
      leftTemple, hairlineY + 8
    );
    ctx.closePath();
    ctx.fill();

    // short side growth
    ctx.fillRect(leftTemple - 4, hairlineY + 2, 9, rand(28, 55));
    ctx.fillRect(rightTemple - 5, hairlineY + 2, 9, rand(28, 55));
  }

  if (hairStyle === "swept") {
    const sweepRight = chance(0.5);

    ctx.beginPath();
    ctx.moveTo(leftTemple, hairlineY + 10);
    ctx.bezierCurveTo(
      cx - faceW * 0.32, crownY - 8,
      cx + faceW * 0.20, crownY - 18,
      rightTemple, hairlineY + 2
    );

    if (sweepRight) {
      ctx.bezierCurveTo(
        cx + faceW * 0.12, hairlineY - 8,
        cx - faceW * 0.05, hairlineY + 12,
        leftTemple, hairlineY + 10
      );
    } else {
      ctx.bezierCurveTo(
        cx + faceW * 0.05, hairlineY + 12,
        cx - faceW * 0.12, hairlineY - 8,
        leftTemple, hairlineY + 10
      );
    }

    ctx.closePath();
    ctx.fill();
  }

  if (hairStyle === "curly") {
    // dark base mass first, then curls on the hairline
    ctx.beginPath();
    ctx.moveTo(leftTemple, hairlineY + 12);
    ctx.bezierCurveTo(
      cx - faceW * 0.30, crownY - 10,
      cx + faceW * 0.30, crownY - 10,
      rightTemple, hairlineY + 12
    );
    ctx.lineTo(cx + faceW * 0.28, hairlineY + 22);
    ctx.quadraticCurveTo(cx, hairlineY + 4, cx - faceW * 0.28, hairlineY + 22);
    ctx.closePath();
    ctx.fill();

    const curls = Math.floor(rand(10, 17));
    for (let i = 0; i < curls; i++) {
      const px = leftTemple + (rightTemple - leftTemple) * i / Math.max(1, curls - 1);
      const py = hairlineY + rand(-10, 12);
      ctx.beginPath();
      ctx.arc(px, py, rand(11, 18), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  if (hairStyle === "receding") {
    const recession = rand(34, 58);

    // side sections attached to temples
    ctx.lineWidth = rand(7, 11);

    ctx.beginPath();
    ctx.moveTo(leftTemple, hairlineY + 42);
    ctx.quadraticCurveTo(
      cx - faceW * 0.34,
      hairlineY - recession,
      cx - faceW * 0.12,
      hairlineY - 8
    );
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(rightTemple, hairlineY + 42);
    ctx.quadraticCurveTo(
      cx + faceW * 0.34,
      hairlineY - recession,
      cx + faceW * 0.12,
      hairlineY - 8
    );
    ctx.stroke();

    // optional little surviving tuft
    if (chance(0.45)) {
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(cx - 18, hairlineY - 14);
      ctx.quadraticCurveTo(cx, hairlineY - 30, cx + 18, hairlineY - 14);
      ctx.stroke();
    }
  }

  // A true bald option still leaves a faint scalp edge occasionally.
  if (hairStyle === "none" && chance(0.25)) {
    ctx.strokeStyle = "rgba(40,35,30,0.18)";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(cx, scalpTop + 44, faceW * 0.24, Math.PI * 1.08, Math.PI * 1.92);
    ctx.stroke();
  }

  // Optional facial hair
  if (chance(0.24)) {
    ctx.strokeStyle = hair;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(cx - mouthW * 0.42, mouthY - 18);
    ctx.quadraticCurveTo(cx - 18, mouthY - 31, cx, mouthY - 18);
    ctx.quadraticCurveTo(cx + 18, mouthY - 31, cx + mouthW * 0.42, mouthY - 18);
    ctx.stroke();
  }

  if (chance(0.18)) {
    ctx.strokeStyle = "rgba(30,30,30,0.75)";
    ctx.lineWidth = 2.3;
    const gw = 60;
    const gh = 36;
    ctx.strokeRect(cx - eyeGap - gw / 2, eyeY - gh / 2, gw, gh);
    ctx.strokeRect(cx + eyeGap - gw / 2, eyeY - gh / 2, gw, gh);
    ctx.beginPath();
    ctx.moveTo(cx - eyeGap + gw / 2, eyeY);
    ctx.lineTo(cx + eyeGap - gw / 2, eyeY);
    ctx.stroke();
  }

  ctx.restore();

  // subtle paper grain
  ctx.fillStyle = "rgba(0,0,0,0.03)";
  for (let i = 0; i < 1600; i++) {
    ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 1, 1);
  }
}

document.getElementById("generate").addEventListener("click", drawPortrait);
drawPortrait();
</script>

</body>
</html>
