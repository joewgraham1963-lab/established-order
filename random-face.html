<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Portrait Sketch V5</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #848484;
      text-align: center;
      font-family: Arial, sans-serif;
    }

    h1 {
      margin: 18px 0 10px;
      font-size: clamp(30px, 7vw, 54px);
    }

    canvas {
      display: block;
      margin: 0 auto 18px;
      width: min(92vw, 620px);
      height: auto;
      background: #d9d9d9;
      border: 2px solid #222;
    }

    button {
      font-size: 23px;
      padding: 15px 26px;
      border-radius: 18px;
      border: 2px solid #222;
      background: #efefef;
      margin-bottom: 10px;
    }

    #info {
      margin-bottom: 24px;
      font-size: 18px;
    }
  </style>
</head>
<body>

<h1>Random Portrait Sketch</h1>
<canvas id="portrait" width="620" height="720"></canvas>
<button id="generate">Generate portrait</button>
<div id="info"></div>

<script>
const canvas = document.getElementById("portrait");
const ctx = canvas.getContext("2d");
const info = document.getElementById("info");

function rand(min, max) {
  return Math.random() * (max - min) + min;
}

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function chance(p) {
  return Math.random() < p;
}

function clamp(v, min, max) {
  return Math.max(min, Math.min(max, v));
}

function drawPortrait() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const cx = canvas.width / 2;
  const cy = 332;

  const age = pick(["young", "middle", "older"]);
  const expression = pick(["neutral", "smile", "smirk", "stern", "tired"]);

  const ageNum = age === "young" ? 0 : age === "middle" ? 1 : 2;

  const faceW = rand(205, 320);
  const faceH = rand(300, 410);
  const templeW = rand(0.82, 1.08);
  const jawW = rand(0.50, 0.92) - ageNum * 0.03;
  const chinPoint = rand(0.92, 1.12);
  const cheekBulge = rand(0.22, 0.34) + (age === "older" ? 0.02 : 0);
  const tilt = rand(-0.06, 0.06);

  const foreheadH = age === "older" ? rand(74, 108) : rand(58, 92);
  const eyeY = cy - rand(68, 95);
  const eyeGap = rand(40, 78);
  const eyeW = rand(36, 58);
  const eyeHBase = rand(10, 18);

  let eyeOpenFactor = 1;
  if (expression === "tired") eyeOpenFactor = rand(0.55, 0.78);
  if (expression === "stern") eyeOpenFactor = rand(0.70, 0.90);
  if (expression === "smile") eyeOpenFactor = rand(0.80, 0.98);

  const eyeH = eyeHBase * eyeOpenFactor;
  const browY = eyeY - rand(22, 36);
  const noseTop = eyeY + rand(18, 32);
  const noseBottom = cy + rand(20, 58);

  const mouthY = cy + rand(82, 122);
  const mouthW = rand(58, 108);
  const lipHBase = rand(7, 16) - (age === "older" ? rand(1, 3) : 0);

  const neckW = rand(70, 118);
  const shoulderHeight = rand(618, 655);

  const skin = pick(["#e0c3a7", "#d2b49a", "#c9a985", "#b98d68", "#9f7457", "#7f5b45"]);
  const skinShadow = pick([
    "rgba(80,55,40,0.10)",
    "rgba(60,45,35,0.14)",
    "rgba(90,65,45,0.09)",
    "rgba(70,50,38,0.12)"
  ]);
  const hair = pick(["#1d1b1a", "#3a2c22", "#6a4d34", "#9d8a72", "#444444", "#8e6d51"]);
  const iris = pick(["#2f3b25", "#3b2c1e", "#4a5a63", "#5d6f4f", "#302b28", "#6a593b"]);
  const topColor = pick(["#555", "#4c5b6a", "#6a5050", "#4d4d4d", "#5c4d40", "#687063"]);

  const lightSide = chance(0.5) ? -1 : 1;
  const eyeAsym = rand(-3.5, 3.5);
  const mouthAsym = rand(-5, 5);
  const noseAsym = rand(-4, 4);

  const noseStyle = pick(["straight", "hooked", "broad", "button"]);
  let hairStyle = pick(["short", "swept", "curly", "receding", "none"]);
  if (age === "older" && chance(0.45)) hairStyle = pick(["receding", "none", "short"]);

  const mouthStyle = pick(["neutral", "thin", "full", "smirk"]);
  const wrinkleAlpha = age === "young" ? 0.08 : age === "middle" ? 0.16 : 0.28;
  const lineAlpha = age === "young" ? 0.16 : age === "middle" ? 0.26 : 0.38;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(tilt);
  ctx.translate(-cx, -cy);

  // Neck
  ctx.fillStyle = skin;
  ctx.beginPath();
  ctx.moveTo(cx - neckW / 2, cy + faceH * 0.34);
  ctx.lineTo(cx - neckW * 0.58, shoulderHeight);
  ctx.lineTo(cx + neckW * 0.58, shoulderHeight);
  ctx.lineTo(cx + neckW / 2, cy + faceH * 0.34);
  ctx.closePath();
  ctx.fill();

  // Clothing / shoulders
  ctx.fillStyle = topColor;
  ctx.beginPath();
  ctx.moveTo(90, 720);
  ctx.quadraticCurveTo(cx - 120, shoulderHeight - 35, cx - neckW * 0.55, shoulderHeight - 8);
  ctx.lineTo(cx + neckW * 0.55, shoulderHeight - 8);
  ctx.quadraticCurveTo(cx + 120, shoulderHeight - 35, 530, 720);
  ctx.closePath();
  ctx.fill();

  // Head outline
  ctx.fillStyle = skin;
  ctx.strokeStyle = "rgba(35,35,35,0.88)";
  ctx.lineWidth = 2.3;
  ctx.beginPath();
  ctx.moveTo(cx, cy - faceH / 2);
  ctx.bezierCurveTo(
    cx - faceW * 0.48 * templeW, cy - faceH * 0.47,
    cx - faceW * 0.59, cy - faceH * 0.10,
    cx - faceW * cheekBulge, cy + faceH * 0.20
  );
  ctx.bezierCurveTo(
    cx - faceW * 0.28, cy + faceH * 0.40,
    cx - faceW * jawW * 0.18, cy + faceH * 0.49,
    cx, cy + faceH * 0.52 * chinPoint
  );
  ctx.bezierCurveTo(
    cx + faceW * jawW * 0.18, cy + faceH * 0.49,
    cx + faceW * 0.28, cy + faceH * 0.40,
    cx + faceW * cheekBulge, cy + faceH * 0.20
  );
  ctx.bezierCurveTo(
    cx + faceW * 0.59, cy - faceH * 0.10,
    cx + faceW * 0.48 * templeW, cy - faceH * 0.47,
    cx, cy - faceH / 2
  );
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Softer, less "painted-on" facial shading
  const cheekGradLeft = ctx.createRadialGradient(
    cx - faceW * 0.24, cy + 20, 6,
    cx - faceW * 0.24, cy + 20, faceW * 0.18
  );
  cheekGradLeft.addColorStop(0, skinShadow);
  cheekGradLeft.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = cheekGradLeft;
  ctx.beginPath();
  ctx.ellipse(cx - faceW * 0.24, cy + 18, faceW * 0.18, faceH * 0.16, -0.14, 0, Math.PI * 2);
  ctx.fill();

  const cheekGradRight = ctx.createRadialGradient(
    cx + faceW * 0.24, cy + 18, 6,
    cx + faceW * 0.24, cy + 18, faceW * 0.18
  );
  cheekGradRight.addColorStop(0, skinShadow);
  cheekGradRight.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = cheekGradRight;
  ctx.beginPath();
  ctx.ellipse(cx + faceW * 0.24, cy + 18, faceW * 0.18, faceH * 0.16, 0.14, 0, Math.PI * 2);
  ctx.fill();

  // Very gentle one-sided face lighting
  const sideShade = ctx.createLinearGradient(
    cx - faceW / 2, cy,
    cx + faceW / 2, cy
  );
  if (lightSide < 0) {
    sideShade.addColorStop(0, "rgba(0,0,0,0.10)");
    sideShade.addColorStop(0.5, "rgba(0,0,0,0)");
    sideShade.addColorStop(1, "rgba(255,255,255,0.025)");
  } else {
    sideShade.addColorStop(0, "rgba(255,255,255,0.025)");
    sideShade.addColorStop(0.5, "rgba(0,0,0,0)");
    sideShade.addColorStop(1, "rgba(0,0,0,0.10)");
  }
  ctx.fillStyle = sideShade;
  ctx.beginPath();
  ctx.ellipse(cx, cy, faceW * 0.47, faceH * 0.48, 0, 0, Math.PI * 2);
  ctx.fill();

  // Ears
  const earY = cy + rand(-12, 8);
  const earHLeft = rand(62, 96);
  const earHRight = rand(62, 96);
  ctx.strokeStyle = "rgba(35,35,35,0.50)";
  ctx.lineWidth = 1.7;
  ctx.beginPath();
  ctx.ellipse(cx - faceW * 0.47, earY + rand(-4, 4), rand(15, 22), earHLeft / 2, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx - faceW * 0.47, earY, 10, -1.4, 1.4);
  ctx.stroke();

  ctx.beginPath();
  ctx.ellipse(cx + faceW * 0.47, earY + rand(-4, 4), rand(15, 22), earHRight / 2, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx + faceW * 0.47, earY, 10, -1.4, 1.4);
  ctx.stroke();

  function drawEye(x, y, w, h, asym, side) {
    ctx.strokeStyle = "rgba(25,25,25,0.95)";
    ctx.fillStyle = "#f4f1ea";
    ctx.lineWidth = 2.1;

    const lowerBags = expression === "tired" || age !== "young";
    const eyeSlope = expression === "stern" ? (side === "left" ? -1.4 : 1.4) : rand(-0.8, 0.8);

    ctx.beginPath();
    ctx.moveTo(x - w / 2, y);
    ctx.quadraticCurveTo(x, y - h - asym + eyeSlope * 0.3, x + w / 2, y);
    ctx.quadraticCurveTo(x, y + h * 0.68, x - w / 2, y);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Upper lid crease
    ctx.strokeStyle = "rgba(45,32,25,0.34)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x - w * 0.38, y - h * 0.72);
    ctx.quadraticCurveTo(x, y - h * 1.15, x + w * 0.38, y - h * 0.70);
    ctx.stroke();

    const irisOffset = rand(-2.8, 2.8);
    ctx.fillStyle = iris;
    ctx.beginPath();
    ctx.arc(x + irisOffset, y + 1, h * 0.62, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#111";
    ctx.beginPath();
    ctx.arc(x + irisOffset, y + 1, h * 0.28, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.beginPath();
    ctx.arc(x + irisOffset + 3, y - 3, 2.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = `rgba(40,30,25,${lowerBags ? 0.32 : 0.12})`;
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.moveTo(x - w / 2 + 3, y + h * 0.92);
    ctx.quadraticCurveTo(x, y + h * 1.25 + (expression === "tired" ? 3 : 0), x + w / 2 - 3, y + h * 0.88);
    ctx.stroke();
  }

  drawEye(cx - eyeGap, eyeY + eyeAsym + rand(-1.5, 1.5), eyeW * rand(0.88, 1.10), eyeH * rand(0.92, 1.06), rand(-1.8, 1.8), "left");
  drawEye(cx + eyeGap, eyeY - eyeAsym + rand(-1.5, 1.5), eyeW * rand(0.88, 1.10), eyeH * rand(0.92, 1.06), rand(-1.8, 1.8), "right");

  // Brows with expression
  const browRaise = expression === "tired" ? 3 : expression === "smile" ? 1 : expression === "stern" ? -2 : 0;
  ctx.strokeStyle = hair;
  ctx.lineWidth = rand(4, 7);
  ctx.lineCap = "round";

  ctx.beginPath();
  ctx.moveTo(cx - eyeGap - eyeW * 0.48, browY + rand(-2, 4) + browRaise);
  ctx.quadraticCurveTo(
    cx - eyeGap,
    browY - rand(2, 10) + (expression === "stern" ? -4 : 0),
    cx - eyeGap + eyeW * 0.48,
    browY + rand(-1, 5) + (expression === "smirk" ? -2 : 0)
  );
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(cx + eyeGap - eyeW * 0.48, browY + rand(-1, 5) + (expression === "smirk" ? -4 : 0));
  ctx.quadraticCurveTo(
    cx + eyeGap,
    browY - rand(2, 10) + (expression === "stern" ? -4 : 0),
    cx + eyeGap + eyeW * 0.48,
    browY + rand(-2, 4) + browRaise
  );
  ctx.stroke();

  // Nose
  ctx.strokeStyle = "rgba(55,40,30,0.62)";
  ctx.lineWidth = 2;

  if (noseStyle === "straight") {
    ctx.beginPath();
    ctx.moveTo(cx + noseAsym - rand(1, 5), noseTop);
    ctx.lineTo(cx - rand(5, 12), noseBottom - 8);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx - rand(16, 22), noseBottom + 1);
    ctx.quadraticCurveTo(cx, noseBottom + rand(8, 14), cx + rand(16, 22), noseBottom + 1);
    ctx.stroke();
  }

  if (noseStyle === "hooked") {
    ctx.beginPath();
    ctx.moveTo(cx - rand(1, 5), noseTop);
    ctx.bezierCurveTo(cx + rand(6, 10), cy - 10, cx + rand(14, 20), noseBottom - 15, cx + rand(6, 10), noseBottom);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx - 10, noseBottom + 1);
    ctx.quadraticCurveTo(cx + 8, noseBottom + rand(10, 16), cx + rand(18, 24), noseBottom + 2);
    ctx.stroke();
  }

  if (noseStyle === "broad") {
    ctx.beginPath();
    ctx.moveTo(cx - rand(3, 8), noseTop);
    ctx.bezierCurveTo(cx - 10, cy - 8, cx - 14, noseBottom - 10, cx - 10, noseBottom);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx + rand(2, 5), noseTop + 8);
    ctx.bezierCurveTo(cx + 8, cy - 6, cx + 12, noseBottom - 10, cx + 10, noseBottom);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx - rand(22, 28), noseBottom + 3);
    ctx.quadraticCurveTo(cx, noseBottom + rand(12, 18), cx + rand(22, 28), noseBottom + 3);
    ctx.stroke();
  }

  if (noseStyle === "button") {
    ctx.beginPath();
    ctx.moveTo(cx - rand(2, 6), noseTop);
    ctx.quadraticCurveTo(cx - rand(6, 10), cy + 5, cx - rand(3, 7), noseBottom - 6);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx - rand(12, 18), noseBottom + 5);
    ctx.quadraticCurveTo(cx, noseBottom + rand(10, 14), cx + rand(12, 18), noseBottom + 5);
    ctx.stroke();
  }

  ctx.fillStyle = "rgba(65,45,30,0.38)";
  ctx.beginPath();
  ctx.ellipse(cx - rand(9, 15) + noseAsym * 0.25, noseBottom + 3, rand(2.6, 4.2), rand(1.8, 2.7), 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx + rand(9, 15) + noseAsym * 0.25, noseBottom + 3, rand(2.6, 4.2), rand(1.8, 2.7), 0, 0, Math.PI * 2);
  ctx.fill();

  // Mouth / expression
  ctx.save();
  const mouthOffsetX = (expression === "smirk" ? rand(2, 7) : rand(-4, 4)) + mouthAsym;
  ctx.translate(cx + mouthOffsetX, mouthY);
  ctx.rotate(rand(-0.05, 0.05));

  ctx.strokeStyle = "rgba(80,30,30,0.85)";
  ctx.fillStyle = "rgba(130,65,65,0.55)";
  ctx.lineWidth = 1.7;

  let topLip = lipHBase;
  let bottomLip = lipHBase * 0.85;
  if (mouthStyle === "thin") {
    topLip *= 0.62;
    bottomLip *= 0.65;
  }
  if (mouthStyle === "full") {
    topLip *= 1.35;
    bottomLip *= 1.45;
  }

  let smileCurve = 0;
  if (expression === "smile") smileCurve = rand(6, 14);
  if (expression === "smirk") smileCurve = rand(3, 10);
  if (expression === "stern") smileCurve = rand(-6, -2);
  if (expression === "tired") smileCurve = rand(-4, 1);

  ctx.beginPath();
  ctx.moveTo(-mouthW / 2, 0);
  ctx.quadraticCurveTo(-mouthW * 0.18, -topLip - smileCurve * 0.15, 0, -topLip * 0.45);
  ctx.quadraticCurveTo(mouthW * 0.18, -topLip + (expression === "smirk" ? -2 : 0), mouthW / 2, 0);
  ctx.quadraticCurveTo(mouthW * 0.18, bottomLip + smileCurve, 0, bottomLip * 0.78 + smileCurve);
  ctx.quadraticCurveTo(-mouthW * 0.18, bottomLip + smileCurve * 0.55, -mouthW / 2, 0);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.beginPath();
  const curveOffset = smileCurve * 0.38 + (expression === "smirk" ? -2 : 0);
  ctx.moveTo(-mouthW / 2 + 4, 0);
  ctx.quadraticCurveTo(0, curveOffset, mouthW / 2 - 4, curveOffset + (expression === "smirk" ? -3 : 0));
  ctx.stroke();
  ctx.restore();

  // Chin line
  ctx.strokeStyle = `rgba(60,45,35,${lineAlpha * 0.7})`;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(cx, mouthY + 38, rand(16, 30), 0.2, Math.PI - 0.2);
  ctx.stroke();

  // Expression / age lines
  ctx.strokeStyle = `rgba(55,40,30,${wrinkleAlpha})`;
  ctx.lineWidth = 1.4;

  if (age !== "young" || expression === "stern") {
    // forehead lines
    const lines = age === "older" ? 3 : 2;
    for (let i = 0; i < lines; i++) {
      const fy = cy - faceH / 2 + foreheadH * (0.28 + i * 0.13);
      ctx.beginPath();
      ctx.moveTo(cx - faceW * 0.18, fy);
      ctx.quadraticCurveTo(cx, fy - rand(2, 5), cx + faceW * 0.18, fy);
      ctx.stroke();
    }
  }

  if (expression === "tired" || age !== "young") {
    // under-eye bags
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(cx + side * (eyeGap - eyeW * 0.18), eyeY + eyeH * 1.5);
      ctx.quadraticCurveTo(cx + side * eyeGap, eyeY + eyeH * (2.1 + (expression === "tired" ? 0.4 : 0)), cx + side * (eyeGap + eyeW * 0.18), eyeY + eyeH * 1.45);
      ctx.stroke();
    }
  }

  if (age !== "young" || expression === "smile" || expression === "smirk") {
    // nasolabial lines
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(cx + side * (mouthW * 0.28), noseBottom + 10);
      ctx.quadraticCurveTo(cx + side * (mouthW * 0.42), mouthY - 4, cx + side * (mouthW * 0.30), mouthY + 22);
      ctx.stroke();
    }
  }

  // Subtle lower-face shadow to give the mouth and jaw more depth
  const jawShade = ctx.createLinearGradient(cx, mouthY, cx, cy + faceH * 0.48);
  jawShade.addColorStop(0, "rgba(0,0,0,0)");
  jawShade.addColorStop(1, "rgba(0,0,0,0.055)");
  ctx.fillStyle = jawShade;
  ctx.beginPath();
  ctx.ellipse(cx, cy + faceH * 0.27, faceW * 0.30, faceH * 0.18, 0, 0, Math.PI * 2);
  ctx.fill();

  // Hair and hairline
  ctx.fillStyle = hair;
  ctx.strokeStyle = hair;
  const scalpTop = cy - faceH / 2;
  const leftTemple = cx - faceW * 0.38;
  const rightTemple = cx + faceW * 0.38;
  const hairlineY = scalpTop + rand(42, 72) + (age === "older" ? 8 : 0);
  const crownY = scalpTop - rand(10, 38);

  if (hairStyle === "short") {
    ctx.beginPath();
    ctx.moveTo(leftTemple, hairlineY + 8);
    ctx.bezierCurveTo(
      cx - faceW * 0.30, crownY,
      cx + faceW * 0.30, crownY,
      rightTemple, hairlineY + 8
    );
    ctx.bezierCurveTo(
      cx + faceW * 0.20, hairlineY - 4,
      cx + faceW * 0.08, hairlineY + 8,
      cx, hairlineY + 2
    );
    ctx.bezierCurveTo(
      cx - faceW * 0.08, hairlineY + 8,
      cx - faceW * 0.20, hairlineY - 4,
      leftTemple, hairlineY + 8
    );
    ctx.closePath();
    ctx.fill();

    ctx.fillRect(leftTemple - 4, hairlineY + 2, 9, rand(28, 55));
    ctx.fillRect(rightTemple - 5, hairlineY + 2, 9, rand(28, 55));
  }

  if (hairStyle === "swept") {
    const sweepRight = chance(0.5);
    ctx.beginPath();
    ctx.moveTo(leftTemple, hairlineY + 10);
    ctx.bezierCurveTo(
      cx - faceW * 0.32, crownY - 8,
      cx + faceW * 0.20, crownY - 18,
      rightTemple, hairlineY + 2
    );
    if (sweepRight) {
      ctx.bezierCurveTo(cx + faceW * 0.12, hairlineY - 8, cx - faceW * 0.05, hairlineY + 12, leftTemple, hairlineY + 10);
    } else {
      ctx.bezierCurveTo(cx + faceW * 0.05, hairlineY + 12, cx - faceW * 0.12, hairlineY - 8, leftTemple, hairlineY + 10);
    }
    ctx.closePath();
    ctx.fill();
  }

  if (hairStyle === "curly") {
    ctx.beginPath();
    ctx.moveTo(leftTemple, hairlineY + 12);
    ctx.bezierCurveTo(
      cx - faceW * 0.30, crownY - 10,
      cx + faceW * 0.30, crownY - 10,
      rightTemple, hairlineY + 12
    );
    ctx.lineTo(cx + faceW * 0.28, hairlineY + 22);
    ctx.quadraticCurveTo(cx, hairlineY + 4, cx - faceW * 0.28, hairlineY + 22);
    ctx.closePath();
    ctx.fill();

    const curls = Math.floor(rand(10, 17));
    for (let i = 0; i < curls; i++) {
      const px = leftTemple + (rightTemple - leftTemple) * i / Math.max(1, curls - 1);
      const py = hairlineY + rand(-10, 12);
      ctx.beginPath();
      ctx.arc(px, py, rand(11, 18), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  if (hairStyle === "receding") {
    const recession = rand(34, 58);
    ctx.lineWidth = rand(7, 11);

    ctx.beginPath();
    ctx.moveTo(leftTemple, hairlineY + 42);
    ctx.quadraticCurveTo(
      cx - faceW * 0.34,
      hairlineY - recession,
      cx - faceW * 0.12,
      hairlineY - 8
    );
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(rightTemple, hairlineY + 42);
    ctx.quadraticCurveTo(
      cx + faceW * 0.34,
      hairlineY - recession,
      cx + faceW * 0.12,
      hairlineY - 8
    );
    ctx.stroke();

    if (chance(0.45)) {
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(cx - 18, hairlineY - 14);
      ctx.quadraticCurveTo(cx, hairlineY - 30, cx + 18, hairlineY - 14);
      ctx.stroke();
    }
  }

  if (hairStyle === "none" && chance(0.25)) {
    ctx.strokeStyle = "rgba(40,35,30,0.18)";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(cx, scalpTop + 44, faceW * 0.24, Math.PI * 1.08, Math.PI * 1.92);
    ctx.stroke();
  }

  // Optional sideburns, attached to the temples
  if (hairStyle !== "none" && chance(0.42)) {
    ctx.strokeStyle = hair;
    ctx.lineWidth = rand(4, 8);
    const sb = rand(18, 42);
    ctx.beginPath();
    ctx.moveTo(leftTemple + 5, hairlineY + 20);
    ctx.lineTo(leftTemple + 7, hairlineY + 20 + sb);
    ctx.stroke();

    if (chance(0.9)) {
      ctx.beginPath();
      ctx.moveTo(rightTemple - 5, hairlineY + 20);
      ctx.lineTo(rightTemple - 7, hairlineY + 20 + sb * rand(0.85, 1.15));
      ctx.stroke();
    }
  }

  // Optional facial hair / glasses
  if (chance(age === "older" ? 0.32 : 0.22)) {
    ctx.strokeStyle = hair;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(cx - mouthW * 0.42, mouthY - 18);
    ctx.quadraticCurveTo(cx - 18, mouthY - 31, cx, mouthY - 18);
    ctx.quadraticCurveTo(cx + 18, mouthY - 31, cx + mouthW * 0.42, mouthY - 18);
    ctx.stroke();
  }

  if (chance(0.18)) {
    ctx.strokeStyle = "rgba(30,30,30,0.75)";
    ctx.lineWidth = 2.3;
    const gw = 60;
    const gh = 36;
    ctx.strokeRect(cx - eyeGap - gw / 2, eyeY - gh / 2, gw, gh);
    ctx.strokeRect(cx + eyeGap - gw / 2, eyeY - gh / 2, gw, gh);
    ctx.beginPath();
    ctx.moveTo(cx - eyeGap + gw / 2, eyeY);
    ctx.lineTo(cx + eyeGap - gw / 2, eyeY);
    ctx.stroke();
  }

  ctx.restore();

  // subtle paper grain
  ctx.fillStyle = "rgba(0,0,0,0.03)";
  for (let i = 0; i < 1600; i++) {
    ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 1, 1);
  }

  info.textContent = "Age: " + age + " | Expression: " + expression;
}

document.getElementById("generate").addEventListener("click", drawPortrait);
drawPortrait();
</script>
