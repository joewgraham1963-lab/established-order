<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Portrait Sketch</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #848484;
      text-align: center;
      font-family: Arial, sans-serif;
    }

    h1 {
      margin: 18px 0 10px;
      font-size: clamp(30px, 7vw, 54px);
    }

    canvas {
      display: block;
      margin: 0 auto 18px;
      width: min(92vw, 620px);
      height: auto;
      background: #d6d6d6;
      border: 2px solid #222;
    }

    button {
      font-size: 23px;
      padding: 15px 26px;
      border-radius: 18px;
      border: 2px solid #222;
      background: #efefef;
      margin-bottom: 28px;
    }
  </style>
</head>

<body>

<h1>Random Portrait Sketch</h1>
<canvas id="portrait" width="620" height="720"></canvas>
<button id="generate">Generate portrait</button>

<script>
const canvas = document.getElementById("portrait");
const ctx = canvas.getContext("2d");

function rand(min, max) {
  return Math.random() * (max - min) + min;
}

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function chance(p) {
  return Math.random() < p;
}

function drawPortrait() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const cx = canvas.width / 2;
  const cy = 335;

  const faceW = rand(205, 305);
  const faceH = rand(300, 405);
  const jawW = rand(0.52, 0.88);
  const templeW = rand(0.84, 1.08);
  const cheekFullness = rand(0.88, 1.14);
  const tilt = rand(-0.055, 0.055);

  const eyeY = cy - rand(62, 98);
  const eyeGap = rand(44, 70);
  const eyeW = rand(38, 58);
  const eyeH = rand(10, 20);

  const browY = eyeY - rand(23, 37);
  const noseTop = eyeY + rand(16, 30);
  const noseBottom = cy + rand(24, 60);
  const noseWidth = rand(28, 52);
  const noseLean = rand(-10, 10);

  const mouthY = cy + rand(82, 120);
  const mouthW = rand(58, 108);
  const lipH = rand(6, 16);

  const skin = pick(["#d2b49a", "#c9a985", "#b98d68", "#9f7457", "#7f5b45"]);
  const skinShadow = pick(["rgba(80,55,40,0.12)", "rgba(60,45,35,0.15)", "rgba(90,65,45,0.10)"]);
  const hair = pick(["#1d1b1a", "#3a2c22", "#6a4d34", "#9d8a72", "#444444"]);
  const iris = pick(["#2f3b25", "#3b2c1e", "#4a5a63", "#5d6f4f", "#302b28"]);

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(tilt);
  ctx.translate(-cx, -cy);

  // Neck
  const neckW = rand(82, 110);
  ctx.fillStyle = skin;
  ctx.beginPath();
  ctx.moveTo(cx - neckW / 2, cy + faceH * 0.36);
  ctx.lineTo(cx - neckW * 0.62, 650);
  ctx.lineTo(cx + neckW * 0.62, 650);
  ctx.lineTo(cx + neckW / 2, cy + faceH * 0.36);
  ctx.closePath();
  ctx.fill();

  // Shoulders
  ctx.fillStyle = "#555";
  ctx.beginPath();
  ctx.moveTo(95, 720);
  ctx.quadraticCurveTo(cx - 115, 610, cx - neckW * 0.5, 615);
  ctx.lineTo(cx + neckW * 0.5, 615);
  ctx.quadraticCurveTo(cx + 115, 610, 525, 720);
  ctx.closePath();
  ctx.fill();

  // Head shape
  ctx.fillStyle = skin;
  ctx.strokeStyle = "rgba(35,35,35,0.9)";
  ctx.lineWidth = 2.2;
  ctx.beginPath();
  ctx.moveTo(cx, cy - faceH / 2);
  ctx.bezierCurveTo(
    cx - faceW * 0.48 * templeW, cy - faceH * 0.47,
    cx - faceW * 0.56, cy - faceH * 0.12,
    cx - faceW * 0.43 * cheekFullness, cy + faceH * 0.18
  );
  ctx.bezierCurveTo(
    cx - faceW * 0.33 * cheekFullness, cy + faceH * 0.39,
    cx - faceW * jawW * 0.22, cy + faceH * 0.49,
    cx, cy + faceH * 0.51
  );
  ctx.bezierCurveTo(
    cx + faceW * jawW * 0.22, cy + faceH * 0.49,
    cx + faceW * 0.33, cy + faceH * 0.39,
    cx + faceW * 0.43, cy + faceH * 0.18
  );
  ctx.bezierCurveTo(
    cx + faceW * 0.56, cy - faceH * 0.12,
    cx + faceW * 0.48 * templeW, cy - faceH * 0.47,
    cx, cy - faceH / 2
  );
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Soft cheek shadows
  ctx.fillStyle = skinShadow;
  ctx.beginPath();
  ctx.ellipse(cx - faceW * 0.28, cy + 15, faceW * 0.13, faceH * 0.13, -0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx + faceW * 0.28, cy + 15, faceW * 0.13, faceH * 0.13, 0.2, 0, Math.PI * 2);
  ctx.fill();

  // Ears
  const earY = cy - 5;
  const earH = rand(70, 92);
  ctx.strokeStyle = "rgba(35,35,35,0.72)";
  ctx.lineWidth = 2;
  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.ellipse(cx + side * faceW * 0.47, earY + rand(-4,4), rand(17,22), earH / 2, 0, 0, Math.PI * 2);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(cx + side * faceW * 0.47, earY, 10, -1.4, 1.4);
    ctx.stroke();
  }

  // Eyes
  function eye(x, y, asym = 0) {
    ctx.strokeStyle = "rgba(25,25,25,0.95)";
    ctx.fillStyle = "#f4f1ea";
    ctx.lineWidth = 2.2;

    ctx.beginPath();
    ctx.moveTo(x - eyeW / 2, y);
    ctx.quadraticCurveTo(x, y - eyeH - asym, x + eyeW / 2, y);
    ctx.quadraticCurveTo(x, y + eyeH * 0.72, x - eyeW / 2, y);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = iris;
    ctx.beginPath();
    ctx.arc(x + rand(-2.5, 2.5), y + 1, eyeH * 0.62, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#111";
    ctx.beginPath();
    ctx.arc(x + rand(-2, 2), y + 1, eyeH * 0.28, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.beginPath();
    ctx.arc(x + 3, y - 3, 2.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "rgba(40,30,25,0.75)";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(x - eyeW / 2 + 3, y + eyeH * 0.9);
    ctx.quadraticCurveTo(x, y + eyeH * 1.35, x + eyeW / 2 - 3, y + eyeH * 0.85);
    ctx.stroke();
  }

  eye(
    cx - eyeGap + rand(-5, 3),
    eyeY + rand(-4, 3),
    rand(-2.0, 1.2)
  );
  eye(
    cx + eyeGap + rand(-3, 5),
    eyeY + rand(-3, 4),
    rand(-1.2, 2.0)
  );

  if (chance(0.45)) {
    ctx.strokeStyle = "rgba(70,55,45,0.18)";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(cx - eyeGap, eyeY + eyeH * 1.35, eyeW * 0.32, 0.15, Math.PI - 0.15);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx + eyeGap, eyeY + eyeH * 1.35, eyeW * 0.32, 0.15, Math.PI - 0.15);
    ctx.stroke();
  }

  if (chance(0.35)) {
    ctx.strokeStyle = "rgba(80,55,45,0.16)";
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.moveTo(cx - noseWidth * 0.55, noseBottom + 10);
    ctx.quadraticCurveTo(cx - 42, mouthY - 12, cx - mouthW * 0.40, mouthY + 6);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx + noseWidth * 0.55, noseBottom + 10);
    ctx.quadraticCurveTo(cx + 42, mouthY - 12, cx + mouthW * 0.40, mouthY + 6);
    ctx.stroke();
  }

  // Brows
  ctx.strokeStyle = hair;
  ctx.lineWidth = rand(5, 8);
  ctx.lineCap = "round";

  ctx.beginPath();
  ctx.moveTo(cx - eyeGap - eyeW * 0.48, browY + rand(-2, 4));
  ctx.quadraticCurveTo(cx - eyeGap, browY - rand(3, 10), cx - eyeGap + eyeW * 0.48, browY + rand(-1, 5));
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(cx + eyeGap - eyeW * 0.48, browY + rand(-1, 5));
  ctx.quadraticCurveTo(cx + eyeGap, browY - rand(3, 10), cx + eyeGap + eyeW * 0.48, browY + rand(-2, 4));
  ctx.stroke();

  // Nose
  ctx.strokeStyle = "rgba(55,40,30,0.62)";
  ctx.lineWidth = 2;

  const bridgeX = cx + noseLean;

  ctx.beginPath();
  ctx.moveTo(bridgeX - rand(2, 7), noseTop);
  ctx.bezierCurveTo(
    bridgeX - rand(4, 12), cy - 12,
    bridgeX - rand(6, 16), noseBottom - 18,
    bridgeX - rand(2, 7), noseBottom
  );
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(bridgeX - noseWidth / 2, noseBottom + 2);
  ctx.quadraticCurveTo(
    bridgeX,
    noseBottom + rand(8, 17),
    bridgeX + noseWidth / 2,
    noseBottom + 2
  );
  ctx.stroke();

  ctx.fillStyle = "rgba(65,45,30,0.38)";
  ctx.beginPath();
  ctx.ellipse(bridgeX - noseWidth * 0.28, noseBottom + 3, rand(2.5, 4.2), rand(1.7, 2.8), 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.ellipse(bridgeX + noseWidth * 0.28, noseBottom + 3, rand(2.5, 4.2), rand(1.7, 2.8), 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx + rand(10, 16), noseBottom + 3, 3.5, 2.2, 0, 0, Math.PI * 2);
  ctx.fill();

  // Mouth
  const mouthTilt = rand(-0.06, 0.06);
  ctx.save();
  ctx.translate(cx + rand(-5, 5), mouthY);
  ctx.rotate(mouthTilt);

  ctx.strokeStyle = "rgba(80,30,30,0.85)";
  ctx.fillStyle = "rgba(130,65,65,0.55)";
  ctx.lineWidth = 1.8;

  ctx.beginPath();
  ctx.moveTo(-mouthW / 2, 0);
  ctx.quadraticCurveTo(-mouthW * 0.18, -lipH, 0, -lipH * 0.45);
  ctx.quadraticCurveTo(mouthW * 0.18, -lipH, mouthW / 2, 0);
  ctx.quadraticCurveTo(mouthW * 0.18, lipH * 0.9, 0, lipH * 0.75);
  ctx.quadraticCurveTo(-mouthW * 0.18, lipH * 0.9, -mouthW / 2, 0);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.strokeStyle = "rgba(70,25,25,0.8)";
  ctx.beginPath();
  ctx.moveTo(-mouthW / 2 + 4, 0);
  ctx.quadraticCurveTo(0, rand(-2, 2), mouthW / 2 - 4, 0);
  ctx.stroke();
  ctx.restore();

  // Chin shadow
  ctx.strokeStyle = "rgba(60,45,35,0.22)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(cx, mouthY + 38, rand(18, 28), 0.2, Math.PI - 0.2);
  ctx.stroke();

  // Hair mass
  const hairStyle = pick(["short", "swept", "curly", "receding", "none"]);
  ctx.fillStyle = hair;
  ctx.strokeStyle = hair;

  if (hairStyle === "short") {
    ctx.beginPath();
    ctx.moveTo(cx - faceW * 0.39, cy - faceH * 0.37);
    ctx.quadraticCurveTo(cx, cy - faceH * 0.62, cx + faceW * 0.39, cy - faceH * 0.37);
    ctx.quadraticCurveTo(cx + faceW * 0.18, cy - faceH * 0.48, cx, cy - faceH * 0.45);
    ctx.quadraticCurveTo(cx - faceW * 0.18, cy - faceH * 0.48, cx - faceW * 0.39, cy - faceH * 0.37);
    ctx.fill();
  }

  if (hairStyle === "swept") {
    ctx.beginPath();
    ctx.moveTo(cx - faceW * 0.42, cy - faceH * 0.36);
    ctx.bezierCurveTo(cx - 50, cy - faceH * 0.64, cx + 95, cy - faceH * 0.57, cx + faceW * 0.38, cy - faceH * 0.34);
    ctx.bezierCurveTo(cx + 35, cy - faceH * 0.44, cx - 40, cy - faceH * 0.41, cx - faceW * 0.42, cy - faceH * 0.36);
    ctx.fill();
  }

  if (hairStyle === "curly") {
    const curls = Math.floor(rand(11, 18));
    for (let i = 0; i < curls; i++) {
      const px = cx - faceW * 0.36 + (faceW * 0.72) * i / (curls - 1);
      ctx.beginPath();
      ctx.arc(px, cy - faceH * 0.43 + rand(-10, 10), rand(12, 20), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  if (hairStyle === "receding") {
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.arc(cx - 58, cy - faceH * 0.43, 46, Math.PI * 1.05, Math.PI * 1.7);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx + 58, cy - faceH * 0.43, 46, Math.PI * 1.3, Math.PI * 1.95);
    ctx.stroke();
  }

  // Optional facial hair
  if (chance(0.22)) {
    ctx.strokeStyle = hair;
    ctx.lineWidth = 3.2;
    ctx.beginPath();
    ctx.moveTo(cx - mouthW * 0.42, mouthY - 18);
    ctx.quadraticCurveTo(cx - 18, mouthY - 30, cx, mouthY - 18);
    ctx.quadraticCurveTo(cx + 18, mouthY - 30, cx + mouthW * 0.42, mouthY - 18);
    ctx.stroke();
  }

  if (chance(0.16)) {
    // Light glasses
    ctx.strokeStyle = "rgba(30,30,30,0.75)";
    ctx.lineWidth = 2.3;
    const gw = 62;
    const gh = 38;
    ctx.strokeRect(cx - eyeGap - gw / 2, eyeY - gh / 2, gw, gh);
    ctx.strokeRect(cx + eyeGap - gw / 2, eyeY - gh / 2, gw, gh);
    ctx.beginPath();
    ctx.moveTo(cx - eyeGap + gw / 2, eyeY);
    ctx.lineTo(cx + eyeGap - gw / 2, eyeY);
    ctx.stroke();
  }

  ctx.restore();

  // Paper-like grain
  ctx.fillStyle = "rgba(0,0,0,0.035)";
  for (let i = 0; i < 1800; i++) {
    ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 1, 1);
  }
}

document.getElementById("generate").addEventListener("click", drawPortrait);
drawPortrait();
</script>

</body>
</html>
