<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Face Generator</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #848484;
      text-align: center;
      font-family: Arial, sans-serif;
    }
    h1 {
      margin: 18px 0 10px;
      font-size: clamp(32px, 8vw, 58px);
    }
    canvas {
      display: block;
      margin: 0 auto 18px;
      width: min(92vw, 600px);
      height: auto;
      background: #bdbdbd;
      border: 2px solid black;
    }
    button {
      font-size: 24px;
      padding: 16px 28px;
      border-radius: 18px;
      border: 2px solid black;
      margin-bottom: 30px;
      background: #eee;
    }
  </style>
</head>
<body>

<h1>Random Face Generator</h1>
<canvas id="face" width="600" height="600"></canvas>
<button id="generate">Generate face</button>

<script>
const canvas = document.getElementById("face");
const ctx = canvas.getContext("2d");

function random(min, max) {
  return Math.random() * (max - min) + min;
}

function randomInt(min, max) {
  return Math.floor(random(min, max + 1));
}

function chance(p) {
  return Math.random() < p;
}

function drawEye(x, y, size, style) {
  ctx.save();
  ctx.translate(x, y);

  if (style === 0) {
    ctx.beginPath();
    ctx.arc(0, 0, size, 0, Math.PI * 2);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(random(-4, 4), random(-4, 4), Math.max(3, size * 0.28), 0, Math.PI * 2);
    ctx.fill();
  } else if (style === 1) {
    ctx.beginPath();
    ctx.moveTo(-size * 1.3, 0);
    ctx.quadraticCurveTo(0, -size, size * 1.3, 0);
    ctx.quadraticCurveTo(0, size, -size * 1.3, 0);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(random(-3, 3), random(-2, 2), Math.max(3, size * 0.25), 0, Math.PI * 2);
    ctx.fill();
  } else if (style === 2) {
    ctx.beginPath();
    ctx.moveTo(-size, 0);
    ctx.quadraticCurveTo(0, size * 0.55, size, 0);
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.arc(0, 0, Math.max(3, size * 0.35), 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

function drawMouth(cx, mouthY, mouthWidth, style) {
  const x = cx + random(-18, 18);

  if (style === 0) {
    ctx.beginPath();
    ctx.moveTo(x - mouthWidth / 2, mouthY);
    ctx.quadraticCurveTo(x, mouthY + random(25, 55), x + mouthWidth / 2, mouthY);
    ctx.stroke();
  } else if (style === 1) {
    ctx.beginPath();
    ctx.moveTo(x - mouthWidth / 2, mouthY + 20);
    ctx.quadraticCurveTo(x, mouthY - random(25, 55), x + mouthWidth / 2, mouthY + 20);
    ctx.stroke();
  } else if (style === 2) {
    ctx.beginPath();
    ctx.moveTo(x - mouthWidth / 2, mouthY);
    ctx.lineTo(x + mouthWidth / 2, mouthY + random(-8, 8));
    ctx.stroke();
  } else if (style === 3) {
    ctx.beginPath();
    ctx.ellipse(x, mouthY, mouthWidth / 2, random(20, 45), random(-0.15, 0.15), 0, Math.PI * 2);
    ctx.stroke();

    if (chance(0.55)) {
      const teeth = randomInt(3, 7);
      for (let i = 1; i < teeth; i++) {
        const tx = x - mouthWidth / 2 + (mouthWidth / teeth) * i;
        ctx.beginPath();
        ctx.moveTo(tx, mouthY - 18);
        ctx.lineTo(tx, mouthY + 5);
        ctx.stroke();
      }
    }
  } else {
    ctx.beginPath();
    ctx.moveTo(x - mouthWidth / 2, mouthY);
    for (let i = 1; i <= 5; i++) {
      const px = x - mouthWidth / 2 + mouthWidth * i / 5;
      const py = mouthY + (i % 2 === 0 ? -12 : 12);
      ctx.lineTo(px, py);
    }
    ctx.stroke();
  }
}

function drawHair(cx, topY, faceWidth, style) {
  if (style === 0) return;

  if (style === 1) {
    const count = randomInt(8, 18);
    for (let i = 0; i < count; i++) {
      const x = cx - faceWidth * 0.38 + (faceWidth * 0.76) * i / Math.max(1, count - 1);
      ctx.beginPath();
      ctx.moveTo(x, topY + random(5, 25));
      ctx.lineTo(x + random(-18, 18), topY - random(25, 80));
      ctx.stroke();
    }
  } else if (style === 2) {
    ctx.beginPath();
    ctx.moveTo(cx - faceWidth * 0.38, topY + 30);
    for (let i = 0; i <= 8; i++) {
      const x = cx - faceWidth * 0.38 + faceWidth * 0.095 * i;
      const y = topY + random(5, 55);
      ctx.lineTo(x, y);
    }
    ctx.stroke();
  } else if (style === 3) {
    const count = randomInt(3, 7);
    for (let i = 0; i < count; i++) {
      const x = cx + random(-faceWidth * 0.3, faceWidth * 0.3);
      ctx.beginPath();
      ctx.moveTo(x, topY + random(5, 20));
      ctx.lineTo(x + random(-30, 30), topY - random(35, 95));
      ctx.stroke();
    }
  } else {
    const count = randomInt(5, 10);
    for (let i = 0; i < count; i++) {
      const x = cx - faceWidth * 0.34 + (faceWidth * 0.68) * i / Math.max(1, count - 1);
      ctx.beginPath();
      ctx.arc(x, topY + random(10, 35), random(12, 25), 0, Math.PI * 2);
      ctx.stroke();
    }
  }
}

function drawExtras(cx, cy, eyeY, eyeSpacing) {
  if (chance(0.24)) {
    const gw = random(45, 70);
    const gh = random(30, 50);
    ctx.strokeRect(cx - eyeSpacing - gw / 2, eyeY - gh / 2, gw, gh);
    ctx.strokeRect(cx + eyeSpacing - gw / 2, eyeY - gh / 2, gw, gh);

    ctx.beginPath();
    ctx.moveTo(cx - eyeSpacing + gw / 2, eyeY);
    ctx.lineTo(cx + eyeSpacing - gw / 2, eyeY);
    ctx.stroke();
  }

  if (chance(0.22)) {
    const my = cy + random(45, 80);
    ctx.beginPath();
    ctx.moveTo(cx, my);
    ctx.quadraticCurveTo(cx - 35, my - 18, cx - random(55, 85), my + random(0, 12));
    ctx.moveTo(cx, my);
    ctx.quadraticCurveTo(cx + 35, my - 18, cx + random(55, 85), my + random(0, 12));
    ctx.stroke();
  }

  if (chance(0.30)) {
    const n = randomInt(6, 18);
    for (let i = 0; i < n; i++) {
      ctx.beginPath();
      ctx.arc(cx + random(-90, 90), cy + random(-10, 70), random(1, 3), 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawFace() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const cx = 300;
  const cy = 300;

  const faceWidth = random(210, 355);
  const faceHeight = random(270, 425);
  const faceTilt = random(-0.12, 0.12);

  const leftEarSize = random(28, 65);
  const rightEarSize = random(28, 65);
  const leftEarY = cy + random(-18, 18);
  const rightEarY = cy + random(-18, 18);

  const eyeY = cy - random(45, 90);
  const eyeSpacing = random(52, 95);
  const leftEyeSize = random(10, 28);
  const rightEyeSize = random(10, 28);

  const eyeStyleLeft = randomInt(0, 3);
  const eyeStyleRight = chance(0.7) ? eyeStyleLeft : randomInt(0, 3);

  const mouthWidth = random(65, 175);
  const mouthY = cy + random(85, 135);
  const mouthStyle = randomInt(0, 4);

  const topY = cy - faceHeight / 2;
  const hairStyle = randomInt(0, 4);

  ctx.lineWidth = random(3.5, 6);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = "black";
  ctx.fillStyle = "black";

  ctx.beginPath();
  ctx.ellipse(cx, cy, faceWidth / 2, faceHeight / 2, faceTilt, 0, Math.PI * 2);
  ctx.stroke();

  ctx.beginPath();
  ctx.ellipse(cx - faceWidth / 2, leftEarY, leftEarSize / 2, leftEarSize, random(-0.15, 0.15), 0, Math.PI * 2);
  ctx.stroke();

  ctx.beginPath();
  ctx.ellipse(cx + faceWidth / 2, rightEarY, rightEarSize / 2, rightEarSize, random(-0.15, 0.15), 0, Math.PI * 2);
  ctx.stroke();

  drawEye(cx - eyeSpacing + random(-8, 8), eyeY + random(-10, 10), leftEyeSize, eyeStyleLeft);
  drawEye(cx + eyeSpacing + random(-8, 8), eyeY + random(-10, 10), rightEyeSize, eyeStyleRight);

  if (chance(0.88)) {
    ctx.beginPath();
    ctx.moveTo(cx - eyeSpacing - 30, eyeY - random(28, 55));
    ctx.lineTo(cx - eyeSpacing + 30, eyeY - random(20, 60));
    ctx.stroke();
  }

  if (chance(0.88)) {
    ctx.beginPath();
    ctx.moveTo(cx + eyeSpacing - 30, eyeY - random(20, 60));
    ctx.lineTo(cx + eyeSpacing + 30, eyeY - random(28, 55));
    ctx.stroke();
  }

  const noseTopY = eyeY + random(20, 35);
  const noseBottomY = noseTopY + random(35, 95);
  const noseLean = random(-32, 32);

  ctx.beginPath();
  ctx.moveTo(cx + random(-8, 8), noseTopY);
  ctx.lineTo(cx + noseLean, noseBottomY);
  ctx.lineTo(cx + noseLean + random(-15, 28), noseBottomY + random(4, 15));
  ctx.stroke();

  drawMouth(cx, mouthY, mouthWidth, mouthStyle);
  drawHair(cx, topY, faceWidth, hairStyle);
  drawExtras(cx, cy, eyeY, eyeSpacing);
}

document.getElementById("generate").addEventListener("click", drawFace);
drawFace();
</script>

</body>
</html>
