<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Established Order Racing Mk2</title><style>:root{--grey:#848484;--ink:#111}*{box-sizing:border-box}body{margin:0;background:var(--grey);font-family:Arial,sans-serif;color:var(--ink);text-align:center}.wrap{width:min(96vw,760px);margin:auto;padding:14px 10px 34px}h1{margin:4px 0 2px;font-size:clamp(30px,7vw,48px)}.sub{font-size:13px;opacity:.78;margin-bottom:12px}.panel{background:#ffffff47;border:2px solid #222;border-radius:18px;padding:12px}.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.hud div{background:#ffffff36;border-radius:12px;padding:8px;font-weight:bold}canvas{display:block;width:100%;height:auto;aspect-ratio:3/5;background:#111;border:2px solid #222;border-radius:14px;touch-action:none}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}.controls button,.buttons button{font:inherit;border:2px solid #222;border-radius:12px;background:#eee;padding:13px 10px;font-size:20px}.controls button{min-height:58px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}#msg{min-height:46px;margin:10px 4px 0;font-size:15px}.small{font-size:12px;opacity:.7;margin-top:8px}</style></head><body><div class="wrap"><h1>Established Order Racing</h1><div class="sub">Mk2. Less wardrobe. More car.</div><div class="panel"><div class="hud"><div id="speed">0 mph</div><div id="distance">0.00 mi</div><div id="score">0</div></div><canvas id="game" width="420" height="700"></canvas><div class="controls"><button id="left">◀</button><button id="gas">▲ GAS</button><button id="right">▶</button></div><div class="controls"><button style="visibility:hidden">.</button><button id="brake">▼ BRAKE</button><button style="visibility:hidden">.</button></div><div class="buttons"><button id="start">START / NEW RUN</button><button id="sound">SOUND: ON</button></div><div id="msg">Stay on the road, dodge traffic, and see how far you get.</div><div class="small">Phone: hold the buttons. Keyboard: arrows or W/A/S/D. Road gets faster and less charitable.</div></div></div><script>
const c=document.getElementById('game'),ctx=c.getContext('2d'),W=c.width,H=c.height,$=id=>document.getElementById(id);let running=false,gameOver=false,soundOn=true,audio=null,speed=0,distance=0,score=0,roadOffset=0,roadCurve=0,targetCurve=0,curveTimer=0,traffic=[],roadside=[],keys={left:false,right:false,gas:false,brake:false},last=performance.now(),spawnTimer=0;let player={x:W/2,y:H-120,w:34,h:60,vx:0};
function actx(){if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}function tone(f,d,type='square',vol=.04,slide=null){if(!soundOn)return;const a=actx(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}function crashSound(){tone(140,.22,'sawtooth',.06,55);setTimeout(()=>tone(90,.28,'square',.04,45),80)}function passSound(){tone(420,.05,'square',.025,620)}
function reset(){running=true;gameOver=false;speed=35;distance=0;score=0;roadOffset=0;roadCurve=0;targetCurve=0;curveTimer=1200;player.x=W/2;player.vx=0;traffic=[];roadside=[];spawnTimer=500;last=performance.now();$('msg').textContent='GO. Try not to introduce the car to the scenery.'}
function roadCenterAt(y){const p=(H-y)/H;return W/2+roadOffset+roadCurve*(p*p)*140}function roadHalfWidth(y){return 112-((H-y)/H)*18}function spawnTraffic(){const lanes=[-.58,0,.58],lane=lanes[Math.floor(Math.random()*lanes.length)],y=-80;traffic.push({x:roadCenterAt(y)+lane*roadHalfWidth(y),y,w:32,h:56,speedFactor:.55+Math.random()*.35,lane,passed:false})}function spawnRoadside(){roadside.push({side:Math.random()<.5?-1:1,y:-20,size:5+Math.random()*8})}
function update(dt){if(!running)return;const sec=dt/1000;if(keys.gas)speed+=34*sec;else speed-=7*sec;if(keys.brake)speed-=52*sec;speed=Math.max(0,Math.min(135,speed));const steer=(keys.left?-1:0)+(keys.right?1:0);player.vx+=steer*(120+speed*1.4)*sec;player.vx*=Math.pow(.86,dt/16.7);player.x+=player.vx*sec;curveTimer-=dt;if(curveTimer<=0){targetCurve=(Math.random()*2-1)*(0.35+Math.random()*.65);curveTimer=1600+Math.random()*2300}roadCurve+=(targetCurve-roadCurve)*.015*(dt/16.7);roadOffset-=roadCurve*(speed/85)*.45*(dt/16.7);roadOffset*=.995;const scroll=speed*2.25*sec;distance+=speed*sec/3600;score=Math.floor(distance*1000);spawnTimer-=dt;if(spawnTimer<=0&&speed>18){spawnTraffic();spawnTimer=Math.max(380,1200-speed*4.5)+Math.random()*500}if(Math.random()<.08*(dt/16.7))spawnRoadside();traffic.forEach(car=>{car.y+=scroll*(1.15-car.speedFactor);car.x=roadCenterAt(car.y)+car.lane*roadHalfWidth(car.y);if(!car.passed&&car.y>player.y+40){car.passed=true;score+=100;passSound()}});traffic=traffic.filter(car=>car.y<H+100);roadside.forEach(o=>o.y+=scroll*1.1);roadside=roadside.filter(o=>o.y<H+30);const pc=roadCenterAt(player.y),ph=roadHalfWidth(player.y);if(player.x-player.w/2<pc-ph||player.x+player.w/2>pc+ph){speed-=34*sec;player.vx*=.8;if(speed<8)endRun('You have become one with the verge.')}for(const car of traffic){if(Math.abs(player.x-car.x)<(player.w+car.w)/2-5&&Math.abs(player.y-car.y)<(player.h+car.h)/2-7){endRun('CRASH. The other driver will be hearing from our imaginary insurers.');crashSound();break}}if(keys.gas&&speed<42)speed=42;$('speed').textContent=Math.round(speed)+' mph';$('distance').textContent=distance.toFixed(2)+' mi';$('score').textContent=score}
function endRun(msg){if(gameOver)return;running=false;gameOver=true;speed=0;$('speed').textContent='0 mph';$('msg').textContent=msg+' Distance: '+distance.toFixed(2)+' miles. Score: '+score+'.'}
function drawRoad(){ctx.fillStyle='#1d1d1d';ctx.fillRect(0,0,W,H);for(let y=0;y<H;y+=14){const center=roadCenterAt(y),half=roadHalfWidth(y);ctx.fillStyle=((Math.floor((y+distance*220)%28)/14)|0)%2?'#777':'#8d8d8d';ctx.fillRect(0,y,Math.max(0,center-half),14);ctx.fillRect(center+half,y,W-(center+half),14)}ctx.beginPath();for(let y=0;y<=H;y+=10){const center=roadCenterAt(y),half=roadHalfWidth(y);if(y===0)ctx.moveTo(center-half,y);else ctx.lineTo(center-half,y)}for(let y=H;y>=0;y-=10){const center=roadCenterAt(y),half=roadHalfWidth(y);ctx.lineTo(center+half,y)}ctx.closePath();ctx.fillStyle='#2f2f2f';ctx.fill();ctx.strokeStyle='#ddd';ctx.lineWidth=3;for(const s of[-1,1]){ctx.beginPath();for(let y=0;y<=H;y+=10){const xx=roadCenterAt(y)+s*roadHalfWidth(y);if(y===0)ctx.moveTo(xx,y);else ctx.lineTo(xx,y)}ctx.stroke()}ctx.strokeStyle='#bbb';ctx.lineWidth=3;ctx.setLineDash([24,22]);ctx.lineDashOffset=(distance*1800)%46;for(const frac of[-1/3,1/3]){ctx.beginPath();for(let y=0;y<=H;y+=10){const xx=roadCenterAt(y)+frac*roadHalfWidth(y);if(y===0)ctx.moveTo(xx,y);else ctx.lineTo(xx,y)}ctx.stroke()}ctx.setLineDash([])}
function drawCar(car,playerCar=false){ctx.save();ctx.translate(car.x,car.y);ctx.fillStyle=playerCar?'#eee':'#9a9a9a';ctx.fillRect(-car.w/2,-car.h/2,car.w,car.h);ctx.fillStyle='#111';ctx.fillRect(-car.w*.32,-car.h*.18,car.w*.64,car.h*.22);ctx.fillStyle=playerCar?'#555':'#eee';ctx.fillRect(-car.w*.32,car.h*.19,car.w*.64,5);ctx.restore()}
function draw(){drawRoad();roadside.forEach(o=>{const center=roadCenterAt(o.y),half=roadHalfWidth(o.y),xx=center+o.side*(half+28+o.size*2);ctx.fillStyle='#555';ctx.beginPath();ctx.arc(xx,o.y,o.size,0,Math.PI*2);ctx.fill()});traffic.forEach(car=>drawCar(car,false));drawCar(player,true);if(!running){ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 28px Arial';ctx.fillText(gameOver?'RUN OVER':'ESTABLISHED ORDER RACING',W/2,H/2-15);ctx.font='16px Arial';ctx.fillText('Press START / NEW RUN',W/2,H/2+20);ctx.textAlign='left'}}function loop(t){const dt=Math.min(40,t-last||16.7);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function hold(id,key){const b=$(id),on=e=>{e.preventDefault();keys[key]=true},off=e=>{e.preventDefault();keys[key]=false};['pointerdown','touchstart'].forEach(ev=>b.addEventListener(ev,on,{passive:false}));['pointerup','pointercancel','pointerleave','touchend'].forEach(ev=>b.addEventListener(ev,off,{passive:false}))}hold('left','left');hold('right','right');hold('gas','gas');hold('brake','brake');addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowleft','a'].includes(k))keys.left=true;if(['arrowright','d'].includes(k))keys.right=true;if(['arrowup','w'].includes(k))keys.gas=true;if(['arrowdown','s'].includes(k))keys.brake=true;if(k.startsWith('arrow'))e.preventDefault()});addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(['arrowleft','a'].includes(k))keys.left=false;if(['arrowright','d'].includes(k))keys.right=false;if(['arrowup','w'].includes(k))keys.gas=false;if(['arrowdown','s'].includes(k))keys.brake=false});$('start').onclick=()=>{if(soundOn)actx();reset()};$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent='SOUND: '+(soundOn?'ON':'OFF');if(soundOn){actx();tone(300,.05,'square',.03,560)}};draw();
</script></body></html>
