<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hopalong Attractor</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #848484;
      text-align: center;
      font-family: Arial, sans-serif;
    }
    h1 { margin: 14px 0 8px; }
    canvas {
      display: block;
      margin: 0 auto 12px;
      width: min(94vw, 700px);
      height: auto;
      background: black;
      box-shadow: 0 0 28px rgba(255,255,255,0.08);
      touch-action: manipulation;
    }
    #info { margin-bottom: 8px; font-size: 14px; }
    #hint { margin: 0 12px 14px; font-size: 13px; opacity: 0.78; }
    button {
      font-size: 18px;
      padding: 10px 18px;
      border: 2px solid #111;
      border-radius: 14px;
      margin: 0 5px 18px;
      background: #eee;
    }
  </style>
</head>
<body>

<h1>Hopalong Attractor</h1>
<canvas id="canvas" width="600" height="600"></canvas>

<div id="info">Chaos accumulating...</div>
<div id="hint">Tap the canvas or press “Mutate” to jump to a new Hopalong pattern.</div>

<button id="mutate">Mutate</button>
<button id="clear">Clear trails</button>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const width = canvas.width;
const height = canvas.height;

let x = 0.1;
let y = 0.1;

let baseA = 0.4;
let baseB = 1.0;
let baseC = 0.0;

let a = baseA;
let b = baseB;
let c = baseC;

let points = 0;
let time = 0;
let palette = Math.random() * 360;
let rotation = 0;
let pulse = 0;

function random(min, max) {
  return Math.random() * (max - min) + min;
}

function mutate() {
  baseA = random(-2.5, 2.5);
  baseB = random(-3.0, 3.0);
  baseC = random(-2.5, 2.5);

  x = random(-0.25, 0.25);
  y = random(-0.25, 0.25);
  palette = Math.random() * 360;

  ctx.fillStyle = "rgba(0,0,0,0.88)";
  ctx.fillRect(0, 0, width, height);
}

function clearTrails() {
  ctx.fillStyle = "black";
  ctx.fillRect(0, 0, width, height);
}

function plot() {
  time += 0.06;

  a = baseA + Math.sin(time * 0.81) * 0.05;
  b = baseB + Math.cos(time * 0.63) * 0.05;
  c = baseC + Math.sin(time * 0.47) * 0.05;

  palette = (palette + 0.06) % 360;
  rotation += 0.00065;
  pulse += 0.012;

  const zoom = 38 + Math.sin(pulse) * 3.5;
  const cosR = Math.cos(rotation);
  const sinR = Math.sin(rotation);

  ctx.fillStyle = "rgba(0,0,0,0.002)";
  ctx.fillRect(0, 0, width, height);

  for (let i = 0; i < 5000; i++) {
    const oldX = x;

    const nextX =
      y -
      Math.sign(x || 1) *
      Math.sqrt(Math.abs(b * x - c));

    const nextY = a - oldX;

    x = nextX;
    y = nextY;

    const rx = x * cosR - y * sinR;
    const ry = x * sinR + y * cosR;

    const px = width / 2 + rx * zoom;
    const py = height / 2 - ry * zoom;

    if (px < 0 || px >= width || py < 0 || py >= height) continue;

    const hue =
      (palette + x * 20 + y * 14 + Math.sin(points * 0.00025) * 80) % 360;

    ctx.fillStyle = `hsla(${hue}, 100%, 58%, 0.05)`;
    ctx.fillRect(px - 1, py - 1, 3, 3);

    ctx.fillStyle = `hsla(${hue + 24}, 100%, 74%, 0.28)`;
    ctx.fillRect(px, py, 1, 1);

    points++;
  }

  document.getElementById("info").textContent =
    "Points: " + points.toLocaleString() +
    "   a=" + a.toFixed(3) +
    "   b=" + b.toFixed(3) +
    "   c=" + c.toFixed(3);

  requestAnimationFrame(plot);
}

canvas.addEventListener("click", mutate);
canvas.addEventListener("touchend", function(e) {
  e.preventDefault();
  mutate();
}, { passive: false });

document.getElementById("mutate").addEventListener("click", mutate);
document.getElementById("clear").addEventListener("click", clearTrails);

clearTrails();
plot();
</script>

</body>
</html>
