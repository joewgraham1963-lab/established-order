<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dickinson's Clock</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Futura, "Century Gothic", Arial, sans-serif;
      font-size: 48px;
      background: radial-gradient(
  circle at center,
  #666666 0%,
  #5c5c5c 30%,
  #444444 70%
);
      transition: background-color 20s ease;
      color: #111;
    }
#face {
    width: 250px;
    height: 250px;
    border: 4px solid black;
    border-radius: 50%;
    margin: 0 auto 40px auto;
    position: relative;
    background-color: #848482;
    box-shadow: 0 3px 8px rgba(0,0,0,0.25);
}
#facePlate {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background-color: rgba(132, 132, 130, 0.72);
    z-index: 1;
    transition: background-color 20s ease;
}
#pivot {
    width: 12px;
    height: 12px;
    background: black;
    border: 2px solid #C0C0C0;
box-sizing: border-box;
    border-radius: 50%;

    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
} #secondHand {
    width: 2px;
    height: 105px;
    background: red;

    position: absolute;
    left: 50%;
    top: 50%;

    transform-origin: bottom center;
    transform: translateX(-50%) rotate(0deg);

    margin-top: -105px;
} #minuteHand {
    width: 5px;
    height: 90px;
    background: black;

    position: absolute;
    left: 50%;
    top: 50%;

    transform-origin: bottom center;
    transform: translateX(-50%) rotate(0deg);

    margin-top: -90px;
}#hourHand {
    width: 7px;
    height: 65px;
    background: black;

    position: absolute;
    left: 50%;
    top: 50%;

    transform-origin: bottom center;
    transform: translateX(-50%) rotate(0deg);

    margin-top: -65px;
}.marker {
    position: absolute;
    width: 4px;
    height: 18px;
    background: black;

    left: 50%;
    top: 8px;

    transform-origin: 50% 117px;
    z-index: 2;
}.m12 { transform: translateX(-50%) rotate(0deg); }
.m1  { transform: translateX(-50%) rotate(30deg); }
.m2  { transform: translateX(-50%) rotate(60deg); }
.m3  { transform: translateX(-50%) rotate(90deg); }
.m4  { transform: translateX(-50%) rotate(120deg); }
.m5  { transform: translateX(-50%) rotate(150deg); }
.m6  { transform: translateX(-50%) rotate(180deg); }
.m7  { transform: translateX(-50%) rotate(210deg); }
.m8  { transform: translateX(-50%) rotate(240deg); }
.m9  { transform: translateX(-50%) rotate(270deg); }
.m10 { transform: translateX(-50%) rotate(300deg); }
.m11 { transform: translateX(-50%) rotate(330deg); }#hourHand,
#minuteHand,
#secondHand {
    z-index: 3;
}

#pivot {
    z-index: 8;
}#logo {
    position: absolute;
    top: 38px;
    width: 100%;
    text-align: center;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 16px;
    font-weight: bold;
    color: black;
    z-index: 2;
}

#tagline {
    position: absolute;
    top: 58px;
    width: 100%;
    text-align: center;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1px;
    color: #333333;
    z-index: 2;
}

#dayDate {
  position: absolute;
  top: 66%;
  left: 50%;
  transform: translateX(-50%);
  width: auto;
  white-space: nowrap;
  text-align: center;
  font-size: 12px;
  font-weight: 600;
  color: #222;
  background: #ffffff;
  border: 1px solid #222;
  border-radius: 2px;
  padding: 2px 5px;
  letter-spacing: 0.5px;
  z-index: 6;
}
#clockContainer {
    display: flex;
    flex-direction: column;
    align-items: center;
}

#moon {
    width: 32px;
    height: 32px;
    background: #111;
    border: 1px solid black;
    border-radius: 50%;
    position: absolute;
    top: 50%;
    left: 50%;
    z-index: 10;
    overflow: hidden;
}

#moonLight {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: white;
    transform-origin: center;
}

#sun {
    width: 32px;
    height: 32px;
    background: gold;
    border: 1px solid black;
    border-radius: 50%;

    position: absolute;
    top: 50%;
    left: 50%;

    z-index: 9;
}#northLabel {
    font-size: 16px;
    font-weight: bold;
    color: #111;
    margin-bottom: 12px;
    letter-spacing: 1px;
}
#clock {
  font-size: 24px;
  margin-top: 10px;
  opacity: 0.65;
  } 


.trail-dot {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  transform: translate(-50%, -50%);
  z-index: 8;
}
.trail-dot.sun-trail {
  width: 4px;
  height: 4px;
  background: gold;
}

#moonTrailSvg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 8;
  overflow: visible;
}
#moonTrailPath {
  fill: none;
  stroke: white;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: 0.95;
}

.planet-marker {
  position: absolute; left: 50%; top: 50%; border-radius: 50%;
  transform: translate(-50%, -50%); pointer-events: none; z-index: 11; box-sizing: border-box;
}
#mercury { width: 7px; height: 7px; background: #b9b9b9; border: 1px solid #222; }
#venus { width: 9px; height: 9px; background: #f4efe2; border: 1px solid #7c725c; }
#mars { width: 8px; height: 8px; background: #b84f35; border: 1px solid #4e1f16; }


.planet-label {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  font: 700 9px Futura, "Century Gothic", Arial, sans-serif;
  pointer-events: none;
  z-index: 12;
  text-shadow: 0 0 2px #848482, 0 0 2px #848482;
}
#mercuryLabel { color: #222; }
#venusLabel   { color: #f4efe2; }
#marsLabel    { color: #8f2f20; }
#jupiterLabel { color: #8a642f; }
#saturnLabel  { color: #7a6b3f; }

#planetTrailSvg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 7;
  overflow: visible;
}
.planet-trail {
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: 0.9;
}
#mercuryTrail { stroke: #777; }
#venusTrail   { stroke: #f4efe2; }
#marsTrail    { stroke: #b84f35; }
#jupiterTrail { stroke: #b98545; }
#saturnTrail  { stroke: #c8ad63; }



#projectionControls {
  margin-top: 8px;
  display: flex;
  justify-content: center;
}
#projectionControls button {
  font: 600 12px Futura, "Century Gothic", Arial, sans-serif;
  padding: 6px 10px;
  border: 1px solid #222;
  border-radius: 12px;
  background: #848482;
  color: #111;
  cursor: pointer;
}
#projectionControls button.active {
  background: #222;
  color: #f2f2f2;
}

#starMapGrid {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 220px;
  height: 150px;
  transform: translate(-50%, -50%);
  border: 1px solid rgba(0,0,0,0.45);
  border-radius: 6px;
  pointer-events: none;
  z-index: 2;
  display: none;
  box-sizing: border-box;
}
#starMapGrid::before,
#starMapGrid::after {
  content: "";
  position: absolute;
  background: rgba(0,0,0,0.22);
}
#starMapGrid::before {
  left: 50%;
  top: 0;
  bottom: 0;
  width: 1px;
}
#starMapGrid::after {
  left: 0;
  right: 0;
  top: 50%;
  height: 1px;
}
#starMapCaption {
  position: absolute;
  left: 50%;
  top: calc(50% + 82px);
  transform: translateX(-50%);
  font: 700 9px Futura, "Century Gothic", Arial, sans-serif;
  color: rgba(0,0,0,0.72);
  z-index: 3;
  display: none;
  pointer-events: none;
}
body.star-map #starMapGrid,
body.star-map #starMapCaption {
  display: block;
}
body.star-map #hourHand,
body.star-map #minuteHand,
body.star-map #secondHand,
body.star-map #pivot,
body.star-map #sun,
body.star-map #moon,
body.star-map #moonLight,
body.star-map #moonTrailSvg {
  opacity: 0.10 !important;
}
body.star-map .marker,
body.star-map #dayDate,
body.star-map #dateBox {
  opacity: 0.18 !important;
}

#scaleControls {
  margin-top: 8px;
  display: flex;
  justify-content: center;
}
#scaleControls button {
  font: 600 12px Futura, "Century Gothic", Arial, sans-serif;
  padding: 6px 10px;
  border: 1px solid #222;
  border-radius: 12px;
  background: #848482;
  color: #111;
  cursor: pointer;
}
#scaleControls button.active {
  background: #222;
  color: #f2f2f2;
}
body.true-scale #sun,
body.true-scale #moon,
body.true-scale #mercury,
body.true-scale #venus,
body.true-scale #mars,
body.true-scale #jupiter,
body.true-scale #saturn {
  width: 1px !important;
  height: 1px !important;
  min-width: 1px !important;
  min-height: 1px !important;
  border: 0 !important;
  box-shadow: none !important;
}
body.true-scale #moonLight {
  display: none !important;
}
body.true-scale .planet-label {
  opacity: 0 !important;
}

#timeControls {
  margin-top: 12px;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: center;
}
#timeControls button {
  font: 600 12px Futura, "Century Gothic", Arial, sans-serif;
  padding: 6px 9px;
  border: 1px solid #222;
  border-radius: 12px;
  background: #848482;
  color: #111;
  cursor: pointer;
}
#timeControls button.active {
  background: #222;
  color: #f2f2f2;
}
#simLabel {
  margin-top: 6px;
  font-size: 11px;
  letter-spacing: 0.6px;
  color: #dddddd;
  opacity: 0.8;
  min-height: 14px;
}

  
@media (max-width: 600px) {
  #clockContainer {
    transform: scale(1.15);
    transform-origin: top center;
    margin-top: 20px;
    margin-bottom: 80px;
  }
}
</style>
</head>

<body>


<div id="clockContainer">

    <div id="northLabel">N</div>

    
   <div id="face">
    <div id="facePlate"></div> 
    <div class="marker m12"></div>
    <div class="marker m1"></div>
    <div class="marker m2"></div>
    <div class="marker m3"></div>
    <div class="marker m4"></div>
    <div class="marker m5"></div>
    <div class="marker m6"></div>
    <div class="marker m7"></div>
    <div class="marker m8"></div>
    <div class="marker m9"></div>
    <div class="marker m10"></div>
    <div class="marker m11"></div>
    <div id="logo">DICKINSON'S</div>
<div id="tagline">Rhyl Deal</div>
<div id="dayDate"></div>

    <svg id="moonTrailSvg" viewBox="0 0 250 250" aria-hidden="true">
      <polyline id="moonTrailPath" points=""></polyline>
    </svg>
    <div id="starMapGrid"></div>
    <div id="starMapCaption">RA → · DEC ↑</div>
    <svg id="planetTrailSvg" viewBox="0 0 250 250" aria-hidden="true">
      <path id="mercuryTrail" class="planet-trail" d=""></path>
      <path id="venusTrail" class="planet-trail" d=""></path>
      <path id="marsTrail" class="planet-trail" d=""></path>
      <path id="jupiterTrail" class="planet-trail" d=""></path>
      <path id="saturnTrail" class="planet-trail" d=""></path>
    </svg>
    <div id="mercury" class="planet-marker" title="Mercury"></div>
    <div id="venus" class="planet-marker" title="Venus"></div>
    <div id="mars" class="planet-marker" title="Mars"></div>
    <div id="jupiter" class="planet-marker" title="Jupiter"></div>
    <div id="saturn" class="planet-marker" title="Saturn"></div>
    <div id="mercuryLabel" class="planet-label">Me</div>
    <div id="venusLabel" class="planet-label">V</div>
    <div id="marsLabel" class="planet-label">Ma</div>
    <div id="jupiterLabel" class="planet-label">J</div>
    <div id="saturnLabel" class="planet-label">Sa</div>

    <div id="hourHand"></div>
    <div id="minuteHand"></div>
    <div id="secondHand"></div>
   <div id="moon"><div id="moonLight"></div></div>
<div id="sun"></div>
    <div id="pivot"></div>

</div>
    <div id="clock"></div>

    <div id="projectionControls" aria-label="Projection mode">
      <button type="button" id="projectionToggle">STAR MAP</button>
    </div>
    <div id="scaleControls" aria-label="Celestial body scale">
      <button type="button" id="scaleToggle" title="Show celestial bodies at roughly true apparent angular scale">TRUE SCALE</button>
    </div>
    <div id="timeControls" aria-label="Time speed">
      <button type="button" data-speed="live" class="active">LIVE</button>
      <button type="button" data-speed="1440">1440×</button>
      <button type="button" data-speed="8640">8640×</button>
      <button type="button" data-speed="43200">43200×</button>
      <button type="button" data-speed="525949">1 YEAR/MIN</button>
    </div>
    <div id="simLabel"></div>

<script>



    let starMapMode = false;

    function setProjectionMode(useStarMap) {
      starMapMode = useStarMap;
      document.body.classList.toggle("star-map", starMapMode);

      const button = document.getElementById("projectionToggle");
      if (button) {
        button.classList.toggle("active", starMapMode);
        button.textContent = starMapMode ? "RHYL SKY" : "STAR MAP";
        button.setAttribute("aria-pressed", String(starMapMode));
      }

      clearPlanetTrails();
    }

    const projectionToggle = document.getElementById("projectionToggle");
    if (projectionToggle) {
      projectionToggle.addEventListener("click", () => setProjectionMode(!starMapMode));
      projectionToggle.setAttribute("aria-pressed", "false");
    }

    let trueScaleMode = false;

    function setTrueScale(enabled) {
      trueScaleMode = enabled;
      document.body.classList.toggle("true-scale", trueScaleMode);

      const button = document.getElementById("scaleToggle");
      if (button) {
        button.classList.toggle("active", trueScaleMode);
        button.textContent = trueScaleMode ? "DISPLAY SCALE" : "TRUE SCALE";
        button.setAttribute("aria-pressed", String(trueScaleMode));
      }
    }

    const scaleToggle = document.getElementById("scaleToggle");
    if (scaleToggle) {
      scaleToggle.addEventListener("click", () => setTrueScale(!trueScaleMode));
      scaleToggle.setAttribute("aria-pressed", "false");
    }

    let timeSpeed = 1;
    let isLiveTime = true;
    let simulatedBaseTime = Date.now();
    let realBaseTime = Date.now();

    function getDickieTime() {
      if (isLiveTime) return new Date();
      const elapsedRealMs = Date.now() - realBaseTime;
      return new Date(simulatedBaseTime + elapsedRealMs * timeSpeed);
    }

    function setTimeSpeed(value) {
      const currentDickieTime = getDickieTime().getTime();

      if (value === "live") {
        isLiveTime = true;
        timeSpeed = 1;
      } else {
        isLiveTime = false;
        simulatedBaseTime = currentDickieTime;
        realBaseTime = Date.now();
        timeSpeed = Number(value);
      }

      document.querySelectorAll("#timeControls button").forEach(button => {
        button.classList.toggle("active", button.dataset.speed === String(value));
      });

      clearTrails();
      clearPlanetTrails();

      const simLabel = document.getElementById("simLabel");
      simLabel.textContent = isLiveTime
        ? ""
        : `${timeSpeed}× TIME · ${getDickieTime().toLocaleDateString("en-GB")}`;
    }

    document.querySelectorAll("#timeControls button").forEach(button => {
      button.addEventListener("click", () => setTimeSpeed(button.dataset.speed));
    });


    const trailState = {
      sun: [],
      moonPoints: [],
      lastStamp: 0
    };

    function clearTrails() {
      document.querySelectorAll(".trail-dot").forEach(dot => dot.remove());
      trailState.sun = [];
      trailState.moonPoints = [];
      trailState.lastStamp = 0;
      const moonPath = document.getElementById("moonTrailPath");
      if (moonPath) moonPath.setAttribute("points", "");
    }

    function addSunTrailDot(x, y) {
      const face = document.getElementById("face");
      const dot = document.createElement("div");
      dot.className = "trail-dot sun-trail";
      dot.style.left = `calc(50% + ${x}px)`;
      dot.style.top = `calc(50% + ${y}px)`;
      face.appendChild(dot);

      const list = trailState.sun;
      list.push(dot);

      const maxDots = 3800;
      while (list.length > maxDots) {
        list.shift().remove();
      }

      list.forEach((item, index) => {
        const age = (index + 1) / list.length;
        item.style.opacity = String(0.16 + age * 0.62);
      });
    }

    function addMoonTrailPoint(x, y) {
      const path = document.getElementById("moonTrailPath");
      if (!path) return;

      const point = `${125 + x},${125 + y}`;
      trailState.moonPoints.push(point);

      const maxMoonPoints = 3800;
      while (trailState.moonPoints.length > maxMoonPoints) {
        trailState.moonPoints.shift();
      }

      path.setAttribute("points", trailState.moonPoints.join(" "));
    }

    function recordTrails(sunX, sunY, moonX, moonY) {
      if (isLiveTime) return;

      const nowReal = performance.now();
      const trailInterval = timeSpeed >= 525949 ? 30 : 90;
      if (nowReal - trailState.lastStamp < trailInterval) return;
      trailState.lastStamp = nowReal;

      addSunTrailDot(sunX, sunY);
      addMoonTrailPoint(moonX, moonY);
    }


    function sind(x){return Math.sin(x*Math.PI/180);} function cosd(x){return Math.cos(x*Math.PI/180);} function atan2d(y,x){return Math.atan2(y,x)*180/Math.PI;} function asind(x){return Math.asin(x)*180/Math.PI;}
    function solveKepler(Mdeg,e){let M=((Mdeg%360)+360)%360;let E=M+(180/Math.PI)*e*sind(M)*(1+e*cosd(M));for(let i=0;i<8;i++){const Er=E*Math.PI/180,Mr=M*Math.PI/180;E-=((Er-e*Math.sin(Er)-Mr)/(1-e*Math.cos(Er)))*180/Math.PI;}return E;}
    function orbitalElements(body,d){const data={
      mercury:{N:48.3313+3.24587E-5*d,i:7.0047+5.00E-8*d,w:29.1241+1.01444E-5*d,a:0.387098,e:0.205635+5.59E-10*d,M:168.6562+4.0923344368*d},
      venus:{N:76.6799+2.46590E-5*d,i:3.3946+2.75E-8*d,w:54.8910+1.38374E-5*d,a:0.723330,e:0.006773-1.302E-9*d,M:48.0052+1.6021302244*d},
      jupiter:{N:100.4542+2.76854E-5*d,i:1.3030-1.557E-7*d,w:273.8777+1.64505E-5*d,a:5.20256,e:0.048498+4.469E-9*d,M:19.8950+0.0830853001*d},saturn:{N:113.6634+2.38980E-5*d,i:2.4886-1.081E-7*d,w:339.3939+2.97661E-5*d,a:9.55475,e:0.055546-9.499E-9*d,M:316.9670+0.0334442282*d},earth:{N:0,i:0,w:282.9404+4.70935E-5*d,a:1,e:0.016709-1.151E-9*d,M:356.0470+0.9856002585*d},
      mars:{N:49.5574+2.11081E-5*d,i:1.8497-1.78E-8*d,w:286.5016+2.92961E-5*d,a:1.523688,e:0.093405+2.516E-9*d,M:18.6021+0.5240207766*d}};return data[body];}
    function heliocentricXYZ(body,d){const el=orbitalElements(body,d),E=solveKepler(el.M,el.e),xv=el.a*(cosd(E)-el.e),yv=el.a*(Math.sqrt(1-el.e*el.e)*sind(E)),v=atan2d(yv,xv),r=Math.sqrt(xv*xv+yv*yv),vw=v+el.w;return{x:r*(cosd(el.N)*cosd(vw)-sind(el.N)*sind(vw)*cosd(el.i)),y:r*(sind(el.N)*cosd(vw)+cosd(el.N)*sind(vw)*cosd(el.i)),z:r*(sind(vw)*sind(el.i))};}
    function getPlanetPosition(date,body,lat,lon){const d=date.getTime()/86400000-10956.5,p=heliocentricXYZ(body,d),sunGeo=heliocentricXYZ('earth',d),xg=p.x+sunGeo.x,yg=p.y+sunGeo.y,zg=p.z+sunGeo.z,obl=23.4393-3.563E-7*d,xe=xg,ye=yg*cosd(obl)-zg*sind(obl),ze=yg*sind(obl)+zg*cosd(obl),ra=((atan2d(ye,xe)%360)+360)%360,dec=atan2d(ze,Math.sqrt(xe*xe+ye*ye)),jd=date.getTime()/86400000+2440587.5,T=(jd-2451545)/36525;let gmst=280.46061837+360.98564736629*(jd-2451545)+0.000387933*T*T-(T*T*T)/38710000;gmst=((gmst%360)+360)%360;const lst=(gmst+lon+360)%360;let H=lst-ra;H=((H+540)%360)-180;const alt=asind(sind(lat)*sind(dec)+cosd(lat)*cosd(dec)*cosd(H));const az=((atan2d(sind(H),cosd(H)*sind(lat)-Math.tan(dec*Math.PI/180)*cosd(lat))+180)%360+360)%360;return{azimuth:az,altitude:alt,ra:ra,dec:dec};}

    const planetTrailState = {
      mercury: [],
      venus: [],
      mars: [],
      jupiter: [],
      saturn: []
    };

    function clearPlanetTrails() {
      for (const body of ["mercury", "venus", "mars", "jupiter", "saturn"]) {
        planetTrailState[body] = [];
        const path = document.getElementById(body + "Trail");
        if (path) path.setAttribute("d", "");
      }
    }

    function addPlanetTrailPoint(body, x, y, visible) {
      if (isLiveTime) return;

      const list = planetTrailState[body];

      if (starMapMode && list.length) {
        const prev = list[list.length - 1];
        if (prev.visible && Math.abs(x - prev.x) > 100) {
          list.push({ x, y, visible: false });
        }
      }

      // Long enough to show patterns, but deliberately lighter than the Sun/Moon history.
      const maxPlanetPoints = 2200;
      while (list.length > maxPlanetPoints) list.shift();

      let penDown = false;

        if (!p.visible) {
          penDown = false;
          continue;
        }

        const px = 125 + p.x;
        const py = 125 + p.y;

        if (!penDown) {
          d += `M ${px.toFixed(2)} ${py.toFixed(2)} `;
          penDown = true;
        } else {
          d += `L ${px.toFixed(2)} ${py.toFixed(2)} `;
        }
      }

      const path = document.getElementById(body + "Trail");
      if (path) path.setAttribute("d", d);

    function positionPlanetMarker(id, body, date) {
      const el = document.getElementById(id);
      if (!el) return null;

      const pos = getPlanetPosition(date, body, 53.32, -3.49);
      let x, y;

      if (starMapMode) {
        /*
          Simple equatorial star map:
          RA 0..360° spans left-to-right across 220 px.
          Declination +45..-45° spans top-to-bottom across 150 px.
          This removes Earth's daily rotation and exposes retrograde motion.
        */
        const raWrapped = ((pos.ra % 360) + 360) % 360;
        const decClamped = Math.max(-45, Math.min(45, pos.dec));

        x = -110 + (raWrapped / 360) * 220;
        y = -75 + ((45 - decClamped) / 90) * 150;
      } else {
        const a = Math.max(-90, Math.min(90, pos.altitude));
        const horizonRadius = 114;
        const zenithRadius = 22;
        const radius = horizonRadius -
          (Math.abs(a) / 90) * (horizonRadius - zenithRadius);

        x = Math.sin(pos.azimuth * Math.PI / 180) * radius;
        y = -Math.cos(pos.azimuth * Math.PI / 180) * radius;
      }

      el.style.transform =
        `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;

      const label = document.getElementById(id + "Label");
      if (label) {
        label.style.transform =
          `translate(calc(-50% + ${x + 11}px), calc(-50% + ${y - 8}px))`;
      }

      if (starMapMode) {
        el.style.opacity = "1";
        el.style.zIndex = "11";
        if (label) label.style.opacity = "0.95";
      } else if (pos.altitude < 0) {
        el.style.opacity = "0.22";
        el.style.zIndex = "1";
        if (label) label.style.opacity = "0.18";
      } else {
        el.style.opacity = "1";
        el.style.zIndex = "11";
        if (label) label.style.opacity = "0.95";
      }

      return {
        x,
        y,
        altitude: pos.altitude,
        visible: starMapMode ? true : pos.altitude >= 0
      };
    }

/* Offline Moon position for Rhyl. */
function getMoonPosition(date, latitudeDegrees, longitudeDegrees) {
  const radians = Math.PI / 180;
  const J1970 = 2440588;
  const J2000 = 2451545;
  const julianDate = date.getTime() / 86400000 - 0.5 + J1970;
  const daysSinceJ2000 = julianDate - J2000;
  const obliquity = 23.4397 * radians;
  const meanLongitude = (218.316 + 13.176396 * daysSinceJ2000) * radians;
  const meanAnomaly = (134.963 + 13.064993 * daysSinceJ2000) * radians;
  const meanDistance = (93.272 + 13.229350 * daysSinceJ2000) * radians;
  const eclipticLongitude = meanLongitude + 6.289 * radians * Math.sin(meanAnomaly);
  const eclipticLatitude = 5.128 * radians * Math.sin(meanDistance);
  const rightAscension = Math.atan2(
    Math.sin(eclipticLongitude) * Math.cos(obliquity) -
      Math.tan(eclipticLatitude) * Math.sin(obliquity),
    Math.cos(eclipticLongitude)
  );
  const declination = Math.asin(
    Math.sin(eclipticLatitude) * Math.cos(obliquity) +
      Math.cos(eclipticLatitude) * Math.sin(obliquity) * Math.sin(eclipticLongitude)
  );
  const observerLatitude = latitudeDegrees * radians;
  const westLongitude = -longitudeDegrees * radians;
  const siderealTime = (280.16 + 360.9856235 * daysSinceJ2000) * radians - westLongitude;
  const hourAngle = siderealTime - rightAscension;
  const altitude = Math.asin(
    Math.sin(observerLatitude) * Math.sin(declination) +
      Math.cos(observerLatitude) * Math.cos(declination) * Math.cos(hourAngle)
  );
  const southBasedAzimuth = Math.atan2(
    Math.sin(hourAngle),
    Math.cos(hourAngle) * Math.sin(observerLatitude) -
      Math.tan(declination) * Math.cos(observerLatitude)
  );
  const azimuthDegrees = ((southBasedAzimuth / radians + 180) % 360 + 360) % 360;
  return { azimuth: azimuthDegrees, altitude: altitude / radians };
}

/*
  Real solar azimuth for Rhyl.
  Azimuth is measured clockwise from true north:
  north = 0°, east = 90°, south = 180°, west = 270°.
*/
const latitude = 53.32;
const longitude = -3.49;

function degreesToRadians(degrees) {
  return degrees * Math.PI / 180;
}

function radiansToDegrees(radians) {
  return radians * 180 / Math.PI;
}

function normaliseDegrees(degrees) {
  return ((degrees % 360) + 360) % 360;
}

function getSolarPosition(date, latitudeDegrees, longitudeDegrees) {
  const julianDate = date.getTime() / 86400000 + 2440587.5;
  const julianCentury = (julianDate - 2451545.0) / 36525;

  const geometricMeanLongitude = normaliseDegrees(
    280.46646 +
    julianCentury * (36000.76983 + julianCentury * 0.0003032)
  );

  const geometricMeanAnomaly =
    357.52911 +
    julianCentury * (35999.05029 - 0.0001537 * julianCentury);

  const eccentricity =
    0.016708634 -
    julianCentury * (0.000042037 + 0.0000001267 * julianCentury);

  const anomalyRadians = degreesToRadians(geometricMeanAnomaly);

  const equationOfCentre =
    Math.sin(anomalyRadians) *
      (1.914602 - julianCentury * (0.004817 + 0.000014 * julianCentury)) +
    Math.sin(2 * anomalyRadians) *
      (0.019993 - 0.000101 * julianCentury) +
    Math.sin(3 * anomalyRadians) * 0.000289;

  const trueLongitude = geometricMeanLongitude + equationOfCentre;

  const omega = 125.04 - 1934.136 * julianCentury;
  const apparentLongitude =
    trueLongitude -
    0.00569 -
    0.00478 * Math.sin(degreesToRadians(omega));

  const meanObliquity =
    23 +
    (26 +
      (21.448 -
        julianCentury *
          (46.815 +
            julianCentury * (0.00059 - julianCentury * 0.001813))) /
        60) /
      60;

  const correctedObliquity =
    meanObliquity +
    0.00256 * Math.cos(degreesToRadians(omega));

  const declination = Math.asin(
    Math.sin(degreesToRadians(correctedObliquity)) *
    Math.sin(degreesToRadians(apparentLongitude))
  );

  const y = Math.tan(degreesToRadians(correctedObliquity) / 2) ** 2;

  const equationOfTime = 4 * radiansToDegrees(
    y * Math.sin(2 * degreesToRadians(geometricMeanLongitude)) -
    2 * eccentricity * Math.sin(anomalyRadians) +
    4 * eccentricity * y *
      Math.sin(anomalyRadians) *
      Math.cos(2 * degreesToRadians(geometricMeanLongitude)) -
    0.5 * y * y *
      Math.sin(4 * degreesToRadians(geometricMeanLongitude)) -
    1.25 * eccentricity * eccentricity *
      Math.sin(2 * anomalyRadians)
  );

  const utcMinutes =
    date.getUTCHours() * 60 +
    date.getUTCMinutes() +
    date.getUTCSeconds() / 60;

  const trueSolarTime = normaliseDegrees(
    (utcMinutes + equationOfTime + 4 * longitudeDegrees) / 4
  ) * 4;

  let hourAngle = trueSolarTime / 4 - 180;
  if (hourAngle < -180) hourAngle += 360;

  const latitudeRadians = degreesToRadians(latitudeDegrees);
  const hourAngleRadians = degreesToRadians(hourAngle);

const azimuth = radiansToDegrees(
  Math.atan2(
    Math.sin(hourAngleRadians),
    Math.cos(hourAngleRadians) * Math.sin(latitudeRadians) -
    Math.tan(declination) * Math.cos(latitudeRadians)
  )
) + 180;

const altitude = radiansToDegrees(
  Math.asin(
    Math.sin(latitudeRadians) * Math.sin(declination) +
    Math.cos(latitudeRadians) *
    Math.cos(declination) *
    Math.cos(hourAngleRadians)
  )
);

return {
  azimuth: normaliseDegrees(azimuth),
  altitude: altitude
};
}
