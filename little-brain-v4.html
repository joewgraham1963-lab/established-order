<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Brain V4</title>
<style>
body{margin:0;background:#848484;font-family:Arial,sans-serif;text-align:center;color:#111}
.wrap{width:min(94vw,720px);margin:0 auto;padding:18px 12px 40px;box-sizing:border-box}
h1{margin:4px 0 8px}
.brain{font-size:88px;display:inline-block;animation:pulse 2.4s ease-in-out infinite;user-select:none}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
#mood{margin:6px 0 14px}
.panel{background:rgba(255,255,255,.28);border:2px solid #222;border-radius:18px;padding:14px;text-align:left}
#thoughts{height:260px;overflow-y:auto;background:#111;color:#eee;border-radius:12px;padding:12px;font-family:monospace;line-height:1.45}
.thought{margin:0 0 9px}
.brain-thought::before{content:"brain: ";opacity:.6}
.user-thought::before{content:"you: ";opacity:.6}
.controls{display:flex;flex-direction:column;gap:8px;margin-top:12px}
textarea{
  width:100%;
  min-height:84px;
  box-sizing:border-box;
  font-size:18px;
  padding:12px;
  border:2px solid #222;
  border-radius:12px;
  resize:vertical;
  background:#fff;
  color:#111;
  user-select:text;
  -webkit-user-select:text;
  touch-action:manipulation;
  pointer-events:auto;
}
button{font-size:18px;padding:12px 16px;border:2px solid #222;border-radius:12px;background:#eee}
.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.meter{background:rgba(255,255,255,.24);border-radius:12px;padding:8px;font-size:13px}
.bar{height:8px;background:rgba(0,0,0,.18);border-radius:999px;overflow:hidden;margin-top:5px}
.fill{height:100%;width:50%;background:#222;transition:width .5s ease}
#memory,#longMemory{font-size:13px;opacity:.8;margin-top:10px}
.small{font-size:12px;opacity:.72;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
<h1>Little Brain</h1>
<div class="brain">🧠</div>
<div id="mood">Mood: waking up...</div>

<div class="panel">
<div id="thoughts"></div>
<div class="controls">
<textarea id="input" placeholder="Tell it something..."></textarea>
<button id="send">Feed thought</button>
</div>
<div id="memory">Short-term memory: empty</div>
<div id="longMemory">Long-term memory: empty</div>
<div class="small">It remembers recent words, changes internal states, and produces spontaneous thoughts. It is a simulation, not a conscious mind.</div>
</div>

<div class="meters">
<div class="meter">Curiosity<div class="bar"><div class="fill" id="curiosityBar"></div></div></div>
<div class="meter">Calm<div class="bar"><div class="fill" id="calmBar"></div></div></div>
<div class="meter">Mischief<div class="bar"><div class="fill" id="mischiefBar"></div></div></div>
</div>
</div>

<script>
const thoughtsEl=document.getElementById("thoughts");
const inputEl=document.getElementById("input");
const sendBtn=document.getElementById("send");
const moodEl=document.getElementById("mood");
const memoryEl=document.getElementById("memory");
const longMemoryEl=document.getElementById("longMemory");

let state={curiosity:65,calm:55,mischief:45};
let shortMemory=[];
let associations={};
let concepts={};
let facts=[];
let topics={};

const STORAGE_KEY="littleBrainV3";

const coreKnowledge={
  quiet:{
    type:"property",
    definition:"quiet means making very little or no sound",
    related:["silence","calm","sound"]
  },
  silence:{
    type:"concept",
    definition:"silence is the absence, or near absence, of sound",
    related:["quiet","sound","calm"]
  },
  sound:{
    type:"concept",
    definition:"sound is vibration travelling through a medium and detected by hearing",
    related:["noise","quiet","silence"]
  },
  earth:{
    type:"planet",
    definition:"Earth is the planet we live on",
    properties:["round","planet","orbits the sun"],
    related:["moon","sun","planet","space"]
  },
  moon:{
    type:"moon",
    definition:"the Moon is Earth's natural satellite",
    properties:["orbits earth"],
    related:["earth","sun","night"]
  },
  sun:{
    type:"star",
    definition:"the Sun is the star at the centre of our Solar System",
    related:["earth","moon","light","space"]
  },
  furniture:{
    type:"category",
    definition:"furniture means movable objects such as chairs, tables, beds and cupboards",
    examples:["chair","table","bed","cupboard"],
    related:["chair","table","room"]
  },
  chair:{
    type:"furniture",
    definition:"a chair is furniture designed for sitting on",
    related:["furniture","table","sitting"]
  },
  table:{
    type:"furniture",
    definition:"a table is furniture with a raised flat surface",
    related:["furniture","chair"]
  },
  three:{
    type:"number",
    definition:"three is the number after two and before four",
    related:["two","four","number"]
  },
  two:{
    type:"number",
    definition:"two is the number after one and before three",
    related:["one","three","number"]
  },
  one:{
    type:"number",
    definition:"one is the first positive whole number",
    related:["two","number"]
  },
  gravity:{
    type:"force",
    definition:"gravity is the attraction between objects with mass",
    related:["earth","falling","space"]
  },
  clock:{
    type:"object",
    definition:"a clock is a device used to measure and display time",
    related:["time","seconds","minutes"]
  },
  time:{
    type:"concept",
    definition:"time is how we describe the sequence and duration of events",
    related:["clock","seconds","past","future"]
  },
  memory:{
    type:"concept",
    definition:"memory is the ability to store and recall information",
    related:["remember","thought","brain"]
  },
  brain:{
    type:"organ",
    definition:"a brain is an organ that processes information in animals",
    related:["thought","memory","mind"]
  },
  pigeon:{
    type:"animal",
    definition:"a pigeon is a bird",
    properties:["animal","bird"],
    related:["bird","feathers","flying"]
  },
  badger:{
    type:"animal",
    definition:"a badger is a burrowing mammal",
    properties:["animal","mammal"],
    related:["animal","burrow"]
  },
  toilet:{
    type:"object",
    definition:"a toilet is a fixture used for disposing of human waste",
    related:["bathroom","plumbing"]
  },
  window:{
    type:"object",
    definition:"a window is an opening, usually glazed, that admits light into a building",
    related:["glass","light","room"]
  }
};

const aliases={
  "silent":"silence",
  "quietness":"quiet",
  "noisy":"sound",
  "planet earth":"earth",
  "the earth":"earth",
  "the moon":"moon",
  "the sun":"sun",
  "chairs":"chair",
  "tables":"table",
  "clocks":"clock",
  "brains":"brain",
  "pigeons":"pigeon",
  "badgers":"badger"
};

const starters=[
"I wonder whether","Perhaps","It seems possible that","I keep returning to",
"There may be a connection between","For no obvious reason I am thinking about",
"Suppose","I have become suspicious of","What if"
];

const endings=[
"and nobody has noticed.","but I may be making that up.",
"which seems unnecessarily complicated.","for reasons I cannot properly justify.",
"and this feels important for about three seconds.","although the evidence is poor.",
"which is probably how trouble starts.","and now I cannot stop thinking about it.",
"but the thought refuses to explain itself.","which may be completely useless."
];

const strayWords=[
"gravity","pigeon","memory","moon","toilet","clock","order","chaos",
"sandwich","dream","signal","shadow","number","window","badger",
"machine","silence","Tuesday","spiral","weather","dustbin","thought"
];

const stopWords=new Set([
"the","and","but","for","with","that","this","from","have","has","had","you",
"your","are","was","were","will","would","could","should","what","when","where",
"why","how","can","not","into","about","just","then","than","they","them",
"their","there","here","who","whom","which","been","being","some","something",
"anything","everything","really"
]);

function clamp(n){return Math.max(0,Math.min(100,n))}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}

function normaliseTerm(term){
  let t=term
    .toLowerCase()
    .trim()
    .replace(/[?.!,]+$/g,"")
    .replace(/\s+/g," ");
  return aliases[t]||t;
}

function cleanWords(text){
 return text.toLowerCase()
   .replace(/[^a-z0-9' -]/g," ")
   .split(/\s+/)
   .filter(w=>w.length>2&&!stopWords.has(w));
}

function saveBrain(){
 try{
   localStorage.setItem(STORAGE_KEY,JSON.stringify({
     state,associations,concepts,facts,topics
   }));
 }catch(e){}
}

function loadBrain(){
 try{
   const raw=localStorage.getItem(STORAGE_KEY);
   if(!raw)return;
   const saved=JSON.parse(raw);
   if(saved.state)state=saved.state;
   if(saved.associations)associations=saved.associations;
   if(saved.concepts)concepts=saved.concepts;
   if(saved.facts)facts=saved.facts;
   if(saved.topics)topics=saved.topics;
 }catch(e){}
}

function addConcept(word){
 if(!concepts[word]){
   concepts[word]={strength:1,mentions:1,related:{}};
 }else{
   concepts[word].strength=Math.min(100,concepts[word].strength+1);
   concepts[word].mentions++;
 }
 topics[word]=(topics[word]||0)+1;
}

function linkConcepts(words){
 words.forEach(word=>{
   addConcept(word);
   if(!associations[word])associations[word]={};
   words.forEach(other=>{
     if(other===word)return;
     associations[word][other]=(associations[word][other]||0)+1;
     concepts[word].related[other]=(concepts[word].related[other]||0)+1;
   });
 });
}

function seedCoreKnowledge(){
  Object.entries(coreKnowledge).forEach(([word,data])=>{
    if(!associations[word])associations[word]={};
    const related=[
      ...(data.related||[]),
      ...(data.properties||[]),
      ...(data.examples||[])
    ];
    related.forEach(other=>{
      if(!associations[word][other])associations[word][other]=2;
    });
  });
}

function detectFact(text){
 const cleaned=text.trim();
 if(cleaned.includes("?"))return;

 let match=cleaned.match(/^(.{2,40}?)\s+(?:is|are)\s+(.{2,70})[.!]?$/i);

 if(match){
   facts.push({
     subject:match[1].trim(),
     relation:"is",
     value:match[2].trim(),
     confidence:.82,
     time:Date.now()
   });
   if(facts.length>60)facts.shift();
   return;
 }

 match=cleaned.match(/^(.{2,40}?)\s+(?:causes|makes|leads to)\s+(.{2,70})[.!]?$/i);

 if(match){
   facts.push({
     subject:match[1].trim(),
     relation:"causes",
     value:match[2].trim(),
     confidence:.72,
     time:Date.now()
   });
   if(facts.length>60)facts.shift();
 }
}

function remember(text){
 const words=cleanWords(text);

 words.forEach(word=>{
   shortMemory.push(word);
   if(shortMemory.length>20)shortMemory.shift();
 });

 linkConcepts(words);
 detectFact(text);

 state.curiosity=clamp(state.curiosity+Math.min(9,words.length));
 state.mischief=clamp(state.mischief+(Math.random()*8-2));
 state.calm=clamp(state.calm+(Math.random()*6-3));

 saveBrain();
 updateDisplay();
}

function relatedTo(word){
 word=normaliseTerm(word);

 const core=coreKnowledge[word];
 if(core&&core.related&&core.related.length&&Math.random()<.70){
   return pick(core.related);
 }

 const links=associations[word];
 if(!links)return null;

 const candidates=Object.keys(links);
 if(!candidates.length)return null;

 candidates.sort((a,b)=>links[b]-links[a]);
 return candidates[Math.floor(Math.random()*Math.min(5,candidates.length))];
}

function strongestTopic(){
 const entries=Object.entries(topics);
 if(!entries.length)return null;
 entries.sort((a,b)=>b[1]-a[1]);
 return entries[0][0];
}

function chooseSeed(){
 if(shortMemory.length&&Math.random()<.60)return pick(shortMemory);
 const topic=strongestTopic();
 if(topic&&Math.random()<.65)return topic;
 return pick(strayWords);
}

function semanticLookup(subject){
  subject=normaliseTerm(subject);
  if(coreKnowledge[subject])return coreKnowledge[subject];

  const words=cleanWords(subject);
  for(const word of words){
    const normal=normaliseTerm(word);
    if(coreKnowledge[normal])return coreKnowledge[normal];
  }
  return null;
}

function semanticDefinition(subject){
  const knowledge=semanticLookup(subject);
  if(!knowledge)return null;
  return knowledge.definition ? knowledge.definition+"." : null;
}

function detectContradiction(subject,value){
  const s=normaliseTerm(subject);
  const v=normaliseTerm(value);

  if(s==="earth"&&(v.includes("square")||v.includes("flat")||v.includes("cube"))){
    return "That conflicts with something fairly fundamental. Earth is roughly spherical, not "+value+".";
  }

  if(s==="moon"&&v.includes("planet")){
    return "That does not look right. The Moon is a natural satellite, not a planet.";
  }

  if(s==="sun"&&v.includes("planet")){
    return "That conflicts with my basic knowledge. The Sun is a star, not a planet.";
  }

  return null;
}

function answerQuestion(text){
 let q=text.trim().toLowerCase();

 q=q
   .replace(/^what's\s+/,"what is ")
   .replace(/^who's\s+/,"who is ")
   .replace(/^where's\s+/,"where is ");

 let m=q.match(/^what (?:is|are) (.+?)[?]?$/);

 if(m){
   const subject=normaliseTerm(m[1]);

   const semantic=semanticDefinition(subject);
   if(semantic)return semantic;

   const found=[...facts].reverse().find(f=>{
     const fs=normaliseTerm(f.subject);
     return fs===subject||fs.includes(subject)||subject.includes(fs);
   });

   if(found){
     return "I remember that "+found.subject+" "+found.relation+" "+found.value+
       ". Confidence: "+Math.round(found.confidence*100)+"%.";
   }

   const related=relatedTo(subject);
   if(related)return "I do not know exactly, but I associate "+subject+" with "+related+".";
   return "I do not know what "+subject+" is yet.";
 }

 m=q.match(/^is (.+?) (.+?)[?]?$/);

 if(m){
   const subject=normaliseTerm(m[1]);
   const value=normaliseTerm(m[2]);

   const contradiction=detectContradiction(subject,value);
   if(contradiction)return contradiction;

   const knowledge=coreKnowledge[subject];
   if(knowledge){
     const allKnown=[
       ...(knowledge.properties||[]),
       ...(knowledge.related||[]),
       knowledge.type||""
     ].map(normaliseTerm);

     if(allKnown.some(item=>item===value||item.includes(value)||value.includes(item))){
       return "That seems plausible according to what I know about "+subject+".";
     }

     return "I cannot confirm that from what I know about "+subject+".";
   }
 }

 m=q.match(/^do you remember (.+?)[?]?$/);

 if(m){
   const term=normaliseTerm(m[1]);

   const inFact=facts.some(f=>
     normaliseTerm(f.subject).includes(term)||
     normaliseTerm(f.value).includes(term)
   );
   const inConcept=!!concepts[term];
   const inCore=!!coreKnowledge[term];

   return (inFact||inConcept||inCore)
     ? "Yes. "+term+" exists somewhere in my memory."
     : "No. I cannot find "+term+" in my memory.";
 }

 if(text.includes("?")){
   const knownWords=cleanWords(text)
     .map(normaliseTerm)
     .filter(w=>coreKnowledge[w]);

   if(knownWords.length){
     const seed=pick(knownWords);
     const knowledge=coreKnowledge[seed];

     if(knowledge.definition){
       return "I am not entirely sure what you are asking, but I know that "+
         knowledge.definition+".";
     }
   }

   const known=cleanWords(text).filter(w=>concepts[w]);
   if(known.length){
     const seed=pick(known);
     const related=relatedTo(seed);
     if(related)return "I am not sure. I do know that "+seed+" is associated with "+related+" in my memory.";
   }

   return "I recognise that as a question, but I do not have enough knowledge to answer it properly.";
 }

 return null;
}

function generateThought(){
 const topic=strongestTopic();
 const seed=chooseSeed();
 const related=relatedTo(seed);

 if(topic&&topics[topic]>=5&&Math.random()<.18){
   addThought("I keep mentioning "+topic+". It may have become an obsession.","brain");
   topics[topic]=Math.max(1,topics[topic]-2);
   saveBrain();
   updateDisplay();
   return;
 }

 const semanticSeed=normaliseTerm(seed);
 const knowledge=coreKnowledge[semanticSeed];

 if(knowledge&&knowledge.definition&&Math.random()<.22){
   addThought("I think I know something: "+knowledge.definition+".","brain");
   updateDisplay();
   return;
 }

 if(facts.length&&Math.random()<.18){
   const fact=pick(facts);
   const contradiction=detectContradiction(fact.subject,fact.value);

   if(contradiction&&Math.random()<.75){
     addThought("I remember being told that "+fact.subject+" "+fact.relation+" "+fact.value+", but that seems wrong.","brain");
   }else{
     addThought("I remember: "+fact.subject+" "+fact.relation+" "+fact.value+".","brain");
   }
   updateDisplay();
   return;
 }

 let middle;
 if(related&&Math.random()<.72)middle=seed+" and "+related;
 else if(state.mischief>65&&Math.random()<.5)middle=seed+" arguing with "+pick(strayWords);
 else if(state.curiosity>70&&Math.random()<.5)middle=seed+" might be connected to "+pick(strayWords);
 else middle=seed;

 let thought=pick(starters)+" "+middle+" "+pick(endings);

 if(state.calm<30&&Math.random()<.45)thought+=" Something is slightly off.";
 if(state.mischief>80&&Math.random()<.4)thought+=" I blame the furniture.";

 addThought(thought,"brain");

 state.curiosity=clamp(state.curiosity+(Math.random()*6-3));
 state.calm=clamp(state.calm+(Math.random()*8-4));
 state.mischief=clamp(state.mischief+(Math.random()*10-5));

 saveBrain();
 updateDisplay();
}

function addThought(text,who){
 const p=document.createElement("div");
 p.className="thought "+(who==="user"?"user-thought":"brain-thought");
 p.textContent=text;
 thoughtsEl.appendChild(p);

 while(thoughtsEl.children.length>50){
   thoughtsEl.removeChild(thoughtsEl.firstChild);
 }

 thoughtsEl.scrollTop=thoughtsEl.scrollHeight;
}

function updateDisplay(){
 document.getElementById("curiosityBar").style.width=state.curiosity+"%";
 document.getElementById("calmBar").style.width=state.calm+"%";
 document.getElementById("mischiefBar").style.width=state.mischief+"%";

 let mood="neutral";
 if(state.mischief>75)mood="mischievous";
 else if(state.curiosity>75)mood="curious";
 else if(state.calm>72)mood="serene";
 else if(state.calm<28)mood="restless";
 else if(state.curiosity<30)mood="bored";

 moodEl.textContent="Mood: "+mood;

 const recent=[...new Set(shortMemory.slice(-8))];
 memoryEl.textContent=recent.length
   ?"Short-term memory: "+recent.join(", ")
   :"Short-term memory: empty";

 const conceptCount=Object.keys(concepts).length;
 const topic=strongestTopic();

 longMemoryEl.textContent=
   "Long-term memory: "+facts.length+" facts, "+conceptCount+" concepts | brain cells: 2"+
   (topic?" | strongest topic: "+topic:"");
}

function feedThought(){
 const text=inputEl.value.trim();
 if(!text)return;

 addThought(text,"user");
 const answer=answerQuestion(text);
 remember(text);
 inputEl.value="";

 setTimeout(()=>{
   if(answer)addThought(answer,"brain");
   else generateThought();
 },350+Math.random()*650);
}

sendBtn.addEventListener("click",feedThought);

inputEl.addEventListener("pointerdown",()=>inputEl.focus());

inputEl.addEventListener("keydown",e=>{
 if(e.key==="Enter"&&e.ctrlKey){
   e.preventDefault();
   feedThought();
 }
});

function spontaneousLoop(){
 const delay=3500+Math.random()*5500;
 setTimeout(()=>{
   generateThought();
   spontaneousLoop();
 },delay);
}

loadBrain();
seedCoreKnowledge();

addThought(
 (facts.length||Object.keys(concepts).length)
   ?"I remember being here before. I appear to have acquired a second brain cell."
   :"I appear to exist in a browser. I have two brain cells. Expectations should remain modest.",
 "brain"
);

updateDisplay();
spontaneousLoop();
</script>
</body>
</html>
