<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Infinite Empty Space — Earth, Moon & Mercury</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    touch-action: none;
    font-family: Arial, Helvetica, sans-serif;
  }

  #space {
    position: fixed;
    inset: 0;
    background: #000;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
  }

  #space.dragging {
    cursor: grabbing;
  }

  #orbit-overlay {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    pointer-events: none;
    z-index: 1;
  }

  .orbit-stroke {
    fill: none;
    stroke: rgba(255,255,255,0.11);
    stroke-width: 1;
    vector-effect: non-scaling-stroke;
  }

  #centre-dot {
    position: fixed;
    width: 4px;
    height: 4px;
    background: #fff;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  #earth {
    position: fixed;
    left: 0;
    top: 0;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    transform-origin: center center;
    pointer-events: none;
    overflow: visible;
    user-select: none;
    -webkit-user-select: none;
      z-index: 3;
  }

  #earth-svg {
    display: block;
    width: 100%;
    height: 100%;
    overflow: hidden;
    border-radius: 50%;
  }

  #earth-map path {
    fill: #6f9253;
    stroke: rgba(18,28,18,0.30);
    stroke-width: 0.012;
  }

  #moon {
    position: fixed;
    left: 0;
    top: 0;
    transform-origin: center center;
    pointer-events: none;
    overflow: visible;
      z-index: 3;
  }

  #moon svg {
    display: block;
    width: 200px;
    height: 200px;
    overflow: visible;
  }

  #mercury {
    position: fixed;
    left: 0;
    top: 0;
    width: 1.532px;
    height: 1.532px;
    border-radius: 50%;
    background: #a79d90;
    transform-origin: center center;
    pointer-events: none;
      z-index: 3;
  }

  #sun {
    position: fixed;
    left: 0;
    top: 0;
    border-radius: 50%;
    background: #fff6a0;
    box-shadow: 0 0 18px rgba(255, 245, 170, 0.65);
    transform-origin: center center;
    pointer-events: none;
      z-index: 3;
  }

  #time-controls {
    position: fixed;
    left: 50%;
    bottom: 12px;
    transform: translateX(-50%);
    z-index: 11;
    width: min(48vw, 260px);
    padding: 7px 10px 6px;
    border: 1px solid rgba(255,255,255,0.22);
    border-radius: 9px;
    background: rgba(15,15,15,0.72);
    color: rgba(255,255,255,0.68);
    font-size: 11px;
    text-align: center;
    touch-action: manipulation;
  }

  #time-label {
    margin-bottom: 2px;
    font-variant-numeric: tabular-nums;
  }

  #sim-date {
    margin-top: 1px;
    color: rgba(255,255,255,0.38);
    font-size: 10px;
    font-variant-numeric: tabular-nums;
  }

  #time-scale {
    width: 100%;
    margin: 2px 0 0;
    accent-color: #aaa;
    touch-action: manipulation;
  }

  #find-menu-wrap {
    position: fixed;
    right: 12px;
    bottom: 12px;
    z-index: 12;
  }

  #find-menu {
    padding: 8px 10px;
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 8px;
    background: rgba(20,20,20,0.88);
    color: rgba(255,255,255,0.85);
    font-size: 13px;
    outline: none;
  }

  #hud {
    position: fixed;
    left: 12px;
    bottom: 12px;
    color: rgba(255,255,255,0.38);
    font-size: 12px;
    line-height: 1.45;
    pointer-events: none;
    font-variant-numeric: tabular-nums;
  }

  #hint {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.28);
    font-size: 12px;
    pointer-events: none;
    white-space: nowrap;
    transition: opacity 1.2s ease;
  }
</style>
</head>
<body>

<div id="space"></div>
<div id="centre-dot"></div>
<svg id="orbit-overlay" aria-hidden="true">
  <ellipse id="earth-orbit-guide" class="orbit-stroke"></ellipse>
  <ellipse id="mercury-orbit-guide" class="orbit-stroke"></ellipse>
  <circle id="moon-orbit-guide" class="orbit-stroke"></circle>
</svg>
<div id="earth">
  <svg id="earth-svg" viewBox="-1 -1 2 2" aria-label="Rotating Earth">
    <defs>
      <clipPath id="earth-clip">
        <circle cx="0" cy="0" r="1"></circle>
      </clipPath>
    </defs>
    <circle cx="0" cy="0" r="1" fill="#286fb7"></circle>
    <g id="earth-map" clip-path="url(#earth-clip)"></g>
    <path id="earth-night"
          d="M 0 -1 A 1 1 0 0 0 0 1 L 0 -1 Z"
          fill="rgba(0,0,18,0.72)"></path>
    <circle id="earth-light-rim" cx="0" cy="0" r="0.985" fill="none"
            stroke="rgba(255,255,255,0.08)" stroke-width="0.02"></circle>
    <circle cx="0" cy="0" r="0.992" fill="none"
            stroke="rgba(255,255,255,0.16)" stroke-width="0.015"></circle>
  </svg>
</div>
<div id="moon">
  <svg viewBox="0 0 200 200" aria-hidden="true">
    <defs>
      <radialGradient id="moonBase" cx="38%" cy="34%" r="72%">
        <stop offset="0%" stop-color="#eeeeee"/>
        <stop offset="70%" stop-color="#cfcfcf"/>
        <stop offset="100%" stop-color="#b7b7b7"/>
      </radialGradient>
      <clipPath id="moonClip">

    <circle cx="100" cy="100" r="100" fill="url(#moonBase)"/>

    <g clip-path="url(#moonClip)" opacity="0.85">
      <!-- Broad maria, loosely inspired by the lunar near side -->
      <ellipse cx="72" cy="71" rx="27" ry="17" fill="#9f9f9f" transform="rotate(-18 72 71)"/>
      <ellipse cx="121" cy="63" rx="24" ry="15" fill="#969696" transform="rotate(12 121 63)"/>
      <ellipse cx="134" cy="94" rx="24" ry="18" fill="#8f8f8f" transform="rotate(-22 134 94)"/>
      <ellipse cx="89" cy="104" rx="31" ry="19" fill="#a4a4a4" transform="rotate(9 89 104)"/>
      <ellipse cx="112" cy="128" rx="22" ry="16" fill="#999999" transform="rotate(20 112 128)"/>
      <ellipse cx="58" cy="123" rx="17" ry="12" fill="#a8a8a8" transform="rotate(-30 58 123)"/>

      <!-- Craters -->
      <circle cx="52" cy="49" r="8" fill="#b9b9b9"/>
      <circle cx="52" cy="49" r="5.5" fill="#d9d9d9"/>
      <circle cx="152" cy="55" r="7" fill="#a7a7a7"/>
      <circle cx="152" cy="55" r="4.5" fill="#cfcfcf"/>
      <circle cx="41" cy="92" r="6" fill="#a9a9a9"/>
      <circle cx="41" cy="92" r="3.8" fill="#d2d2d2"/>
      <circle cx="151" cy="123" r="9" fill="#ababab"/>
      <circle cx="151" cy="123" r="6" fill="#d5d5d5"/>
      <circle cx="79" cy="150" r="7" fill="#a0a0a0"/>
      <circle cx="79" cy="150" r="4.5" fill="#d1d1d1"/>
      <circle cx="116" cy="157" r="5" fill="#a8a8a8"/>
      <circle cx="116" cy="157" r="3" fill="#d9d9d9"/>

      <!-- Small mottling -->
      <circle cx="30" cy="66" r="3.5" fill="#b0b0b0"/>
      <circle cx="170" cy="87" r="4" fill="#a5a5a5"/>
      <circle cx="141" cy="155" r="3" fill="#a0a0a0"/>
      <circle cx="63" cy="170" r="4" fill="#aaaaaa"/>
      <circle cx="98" cy="42" r="3" fill="#b2b2b2"/>
      <circle cx="33" cy="137" r="3" fill="#9f9f9f"/>
    </g>

    <circle cx="100" cy="100" r="99" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  </svg>
</div>
<div id="sun"></div>
<div id="mercury"></div>

<div id="hint">Drag to move · pinch or wheel to zoom</div>


<div id="time-controls">
  <div id="time-label">Time 1×</div>
  <input id="time-scale" type="range" min="-6" max="6" step="1" value="0" aria-label="Time speed">
  <div id="sim-date"></div>
</div>

<div id="find-menu-wrap">
  <select id="find-menu" aria-label="Find object">
    <option value="">Find…</option>
    <option value="origin">Origin</option>
    <option value="sun">Sun</option>
    <option value="mercury">Mercury</option>
    <option value="earth">Earth</option>
    <option value="moon">Moon</option>
  </select>
</div>

<div id="hud">
  <div id="position">x 0 · y 0</div>
  <div id="zoom">zoom 1×</div>
</div>

<script>
(() => {
  const space = document.getElementById("space");
  const posReadout = document.getElementById("position");
  const zoomReadout = document.getElementById("zoom");
  const hint = document.getElementById("hint");
  const centreDot = document.getElementById("centre-dot");
  const earth = document.getElementById("earth");
  const earthMap = document.getElementById("earth-map");
  const earthNight = document.getElementById("earth-night");
  const orbitOverlay = document.getElementById("orbit-overlay");
  const earthOrbitGuide = document.getElementById("earth-orbit-guide");
  const mercuryOrbitGuide = document.getElementById("mercury-orbit-guide");
  const moonOrbitGuide = document.getElementById("moon-orbit-guide");
  const moon = document.getElementById("moon");
  const sun = document.getElementById("sun");
  const mercury = document.getElementById("mercury");
  const findMenu = document.getElementById("find-menu");
  const timeScaleInput = document.getElementById("time-scale");
  const timeLabel = document.getElementById("time-label");
  const simDateReadout = document.getElementById("sim-date");

  let offsetX = window.innerWidth / 2;
  let offsetY = window.innerHeight / 2;

  // Exponential zoom value. This avoids hitting a practical hard edge too quickly.
  let zoomPower = 0;

  // Simulation clock. At the centre of the slider, simulated time equals real time.
  let simulationTimeMs = Date.now();
  let lastRealTickMs = performance.now();
  let timeScale = 1;

  function sliderToTimeScale(v) {
    const n = Number(v);
    if (n === 0) return 1;
    if (n > 0) return Math.pow(10, n);
    return -Math.pow(10, Math.abs(n) - 1);
  }

  function formatTimeScale(scale) {
    const sign = scale < 0 ? "−" : "";
    return sign + Math.abs(scale).toLocaleString() + "×";
  }

  function advanceSimulationClock() {
    const now = performance.now();
    const realElapsed = now - lastRealTickMs;
    lastRealTickMs = now;
    simulationTimeMs += realElapsed * timeScale;
  }

  // Earth is 4 world-pixels across at zoom 1.
  // 4 px represents Earth's real diameter: about 12,742 km.
  const earthDiameter = 4;

  // True relative scale:
  // Sun diameter ≈ 109.2 Earth diameters.
  // Mean Earth-Sun distance ≈ 11,740 Earth diameters.
  const sunDiameter = earthDiameter * 109.2;      // ≈ 436.8 world-pixels
  const earthSunDistance = earthDiameter * 11740; // ≈ 46,960 world-pixels

  // Keep the Sun where it already was in this little universe.
  const sunWorldX = 47080;
  const sunWorldY = 60;

  // Earth's real orbital shape and period, approximated.
  const orbitalEccentricity = 0.0167086;
  const orbitalPeriodDays = 365.256363004;

  // Approximate 2026 perihelion epoch, used only to anchor the orbit to the calendar.
  const perihelionEpochMs = Date.UTC(2026, 0, 3, 17, 0, 0);

  function solveKepler(meanAnomaly, e) {
    let E = meanAnomaly;
    for (let i = 0; i < 8; i++) {
      E -= (E - e * Math.sin(E) - meanAnomaly) / (1 - e * Math.cos(E));
    }
    return E;
  }

  function getEarthWorldPosition(nowMs = simulationTimeMs) {
    const dayMs = 86400000;
    const elapsedDays = (nowMs - perihelionEpochMs) / dayMs;

    // Keep the mean anomaly neatly wrapped to one revolution.
    let M = 2 * Math.PI * (elapsedDays / orbitalPeriodDays);
    M = ((M % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);

    const E = solveKepler(M, orbitalEccentricity);

    // Ellipse with the Sun at one focus.
    const a = earthSunDistance;
    const e = orbitalEccentricity;
    const b = a * Math.sqrt(1 - e * e);

    const x = a * (Math.cos(E) - e);
    const y = b * Math.sin(E);

    return {
      x: sunWorldX + x,
      y: sunWorldY + y
    };
  }

  const pointers = new Map();
  let lastSingle = null;
  let lastPinchDistance = null;
  let lastPinchCenter = null;


  // Coarse continent outlines expressed as longitude/latitude polygons.
  // The geometry is intentionally lightweight so rotation remains smooth.
  const earthLandPolygons = [
    [[-168,72],[-150,70],[-135,58],[-125,50],[-123,38],[-115,31],[-106,24],[-97,19],[-90,19],[-82,25],[-80,32],[-74,40],[-66,47],[-60,54],[-75,58],[-95,68],[-120,72],[-145,73]],
    [[-81,12],[-72,10],[-66,3],[-60,-7],[-56,-18],[-58,-30],[-64,-42],[-70,-53],[-76,-44],[-79,-30],[-76,-17],[-80,-5]],
    [[-73,60],[-52,59],[-35,66],[-22,76],[-38,83],[-58,82],[-72,74]],
    [[-10,36],[-5,44],[5,50],[15,55],[30,60],[45,66],[60,70],[80,72],[100,70],[120,64],[140,58],[155,52],[165,45],[150,35],[130,30],[110,20],[100,8],[90,8],[80,20],[65,24],[55,30],[45,32],[35,38],[25,42],[15,40],[5,36]],
    [[-17,37],[0,37],[15,33],[30,31],[40,22],[51,11],[48,-2],[40,-15],[32,-28],[18,-35],[5,-34],[-5,-25],[-12,-10],[-15,5]],
    [[35,31],[48,30],[57,23],[53,14],[45,12],[39,18]],
    [[68,24],[78,30],[90,25],[87,15],[80,7],[74,12]],
    [[95,20],[110,18],[120,12],[126,5],[118,-3],[108,-5],[100,2]],
    [[130,33],[138,38],[145,44],[143,36],[136,31]],
    [[113,-11],[128,-12],[143,-17],[153,-28],[147,-39],[132,-43],[116,-34]],
    [[48,-13],[51,-17],[49,-25],[45,-23],[44,-17]],
    [[-10,50],[-8,56],[-4,59],[1,57],[0,51],[-5,50]],
    [[-180,-70],[-150,-72],[-120,-74],[-90,-72],[-60,-76],[-30,-73],[0,-75],[30,-72],[60,-76],[90,-73],[120,-75],[150,-72],[180,-70],[180,-90],[-180,-90]]
  ];

  const EARTH_SIDEREAL_DAY_MS = 86164.0905 * 1000;
  const earthRotationEpochMs = Date.UTC(2026, 7, 28, 0, 0, 0);
  const earthRotationEpochDeg = 336.0;

  function earthRotationAngle(nowMs = simulationTimeMs) {
    const elapsed = nowMs - earthRotationEpochMs;
    return (earthRotationEpochDeg + elapsed / EARTH_SIDEREAL_DAY_MS * 360) % 360;
  }

  function projectGlobePoint(lonDeg, latDeg, rotationDeg) {
    const lon = (lonDeg - rotationDeg) * Math.PI / 180;
    const lat = latDeg * Math.PI / 180;
    const cosLat = Math.cos(lat);
    return {
      x: cosLat * Math.sin(lon),
      y: -Math.sin(lat),
      z: cosLat * Math.cos(lon)
    };
  }

  function renderRotatingEarth() {
    const rotation = earthRotationAngle();
    let markup = "";

    for (const poly of earthLandPolygons) {
      let d = "";
      let drawing = false;

      for (let i = 0; i < poly.length; i++) {
        const p = projectGlobePoint(poly[i][0], poly[i][1], rotation);

        if (p.z >= 0) {
          if (!drawing) {
            d += `M ${p.x.toFixed(4)} ${p.y.toFixed(4)} `;
            drawing = true;
          } else {
            d += `L ${p.x.toFixed(4)} ${p.y.toFixed(4)} `;
          }
        } else {
          drawing = false;
        }
      }

      if (d) markup += `<path d="${d}"></path>`;
    }

    if (earthMap) earthMap.innerHTML = markup;
  }


  function updateEarthIllumination(earthPos) {
    if (!earthNight) return;

    // In this top-down ecliptic view the Sun lies in the screen plane.
    // That means the visible globe is always split by a straight day/night
    // terminator. Rotate the dark semicircle so it is always opposite the Sun.
    const dx = sunWorldX - earthPos.x;
    const dy = sunWorldY - earthPos.y;
    const angleDeg = Math.atan2(dy, dx) * 180 / Math.PI;

    earthNight.setAttribute("transform", `rotate(${angleDeg.toFixed(3)} 0 0)`);
  }

  function updateOrbitGuides(z) {
    if (!orbitOverlay) return;

    orbitOverlay.setAttribute("viewBox", `0 0 ${window.innerWidth} ${window.innerHeight}`);

    // Earth orbit ellipse
    const earthA = earthSunDistance;
    const earthB = earthA * Math.sqrt(1 - orbitalEccentricity * orbitalEccentricity);
    const earthCenterX = sunWorldX - earthA * orbitalEccentricity;
    const earthCenterY = sunWorldY;

    earthOrbitGuide.setAttribute("cx", offsetX + earthCenterX * z);
    earthOrbitGuide.setAttribute("cy", offsetY + earthCenterY * z);
    earthOrbitGuide.setAttribute("rx", Math.abs(earthA * z));
    earthOrbitGuide.setAttribute("ry", Math.abs(earthB * z));
    earthOrbitGuide.removeAttribute("transform");

    // Mercury orbit ellipse, rotated in screen space.
    const mercuryA = mercurySemiMajorAxis;
    const mercuryB = mercuryA * Math.sqrt(1 - mercuryEccentricity * mercuryEccentricity);
    const mercuryArgument = 0.52;

    const centreOffsetX0 = -mercuryA * mercuryEccentricity;
    const centreOffsetY0 = 0;
    const c = Math.cos(mercuryArgument);
    const s = Math.sin(mercuryArgument);
    const mercuryCenterWorldX = sunWorldX + centreOffsetX0 * c - centreOffsetY0 * s;
    const mercuryCenterWorldY = sunWorldY + centreOffsetX0 * s + centreOffsetY0 * c;

    const mcx = offsetX + mercuryCenterWorldX * z;
    const mcy = offsetY + mercuryCenterWorldY * z;

    mercuryOrbitGuide.setAttribute("cx", mcx);
    mercuryOrbitGuide.setAttribute("cy", mcy);
    mercuryOrbitGuide.setAttribute("rx", Math.abs(mercuryA * z));
    mercuryOrbitGuide.setAttribute("ry", Math.abs(mercuryB * z));
    mercuryOrbitGuide.setAttribute(
      "transform",
      `rotate(${mercuryArgument * 180 / Math.PI} ${mcx} ${mcy})`
    );

    // Moon's mean circular orbit around the moving Earth.
    const earthPosForMoonGuide = getEarthWorldPosition();
    moonOrbitGuide.setAttribute("cx", offsetX + earthPosForMoonGuide.x * z);
    moonOrbitGuide.setAttribute("cy", offsetY + earthPosForMoonGuide.y * z);
    moonOrbitGuide.setAttribute("r", Math.abs(moonOrbitRadius * z));
  }

  // Mercury, using the same physical scale.
  // Diameter ≈ 4,879 km; semimajor axis ≈ 57.91 million km.
  const mercuryDiameter = earthDiameter * (4879.4 / 12742);
  const mercurySemiMajorAxis = earthDiameter * (57909227 / 12742);
  const mercuryEccentricity = 0.205630;
  const mercuryOrbitalPeriodDays = 87.9691;

  // Approximate perihelion anchor. This fixes Mercury's orbital phase to the calendar.
  const mercuryPerihelionEpochMs = Date.UTC(2026, 6, 20, 0, 0, 0);

  function getMercuryWorldPosition(nowMs = simulationTimeMs) {
    const elapsedDays = (nowMs - mercuryPerihelionEpochMs) / 86400000;

    let M = 2 * Math.PI * (elapsedDays / mercuryOrbitalPeriodDays);
    M = ((M % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);

    const E = solveKepler(M, mercuryEccentricity);
    const a = mercurySemiMajorAxis;
    const e = mercuryEccentricity;
    const b = a * Math.sqrt(1 - e * e);

    // Rotate Mercury's ellipse a little relative to Earth's purely for a useful
    // ecliptic-plane layout while preserving size, distance and timing.
    const argument = 0.52;
    const x0 = a * (Math.cos(E) - e);
    const y0 = b * Math.sin(E);

    const x = x0 * Math.cos(argument) - y0 * Math.sin(argument);
    const y = x0 * Math.sin(argument) + y0 * Math.cos(argument);

    return {
      x: sunWorldX + x,
      y: sunWorldY + y
    };
  }

  // Moon at the same physical scale as Earth and Sun.
  // Diameter ≈ 27.3% of Earth's; mean distance ≈ 30.15 Earth diameters.
  const moonDiameter = earthDiameter * 0.2727;      // ≈ 1.091 world-units
  const moonOrbitRadius = earthDiameter * 30.15;    // ≈ 120.6 world-units
  const moonOrbitalPeriodDays = 27.321661;

  // Calendar anchor for lunar orbital phase. This need not define visual Moon phase;
  // it simply places the Moon consistently in its real-time orbit.
  const moonEpochMs = Date.UTC(2026, 7, 28, 0, 0, 0);

  function getMoonWorldPosition(nowMs = simulationTimeMs) {
    const earthPos = getEarthWorldPosition(nowMs);
    const elapsedDays = (nowMs - moonEpochMs) / 86400000;

    let angle = 2 * Math.PI * (elapsedDays / moonOrbitalPeriodDays);
    angle = ((angle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);

    return {
      x: earthPos.x + moonOrbitRadius * Math.cos(angle),
      y: earthPos.y + moonOrbitRadius * Math.sin(angle)
    };
  }

  function zoomValue() {
    return Math.exp(zoomPower);
  }

  function updateHUD() {
    const z = zoomValue();

    updateOrbitGuides(z);

    // Position of world origin (0,0) on the screen.
    centreDot.style.left = offsetX + "px";
    centreDot.style.top = offsetY + "px";

    // Earth follows its real-time orbit around the Sun.
    const earthPos = getEarthWorldPosition();
    const earthScreenX = offsetX + earthPos.x * z;
    const earthScreenY = offsetY + earthPos.y * z;
    earth.style.left = earthScreenX + "px";
    earth.style.top = earthScreenY + "px";
    earth.style.width = earthDiameter + "px";
    earth.style.height = earthDiameter + "px";
    earth.style.transform = `translate(-50%, -50%) scale(${z})`;
    renderRotatingEarth();
    updateEarthIllumination(earthPos);

    // Moon follows Earth while orbiting it in real time.
    const moonPos = getMoonWorldPosition();
    const moonScreenX = offsetX + moonPos.x * z;
    const moonScreenY = offsetY + moonPos.y * z;
    moon.style.left = moonScreenX + "px";
    moon.style.top = moonScreenY + "px";

    // Draw Moon internally at 200px for detail, then scale it down to its true world diameter.
    const moonInternalSize = 200;
    const moonScale = (moonDiameter / moonInternalSize) * z;
    moon.style.width = moonInternalSize + "px";
    moon.style.height = moonInternalSize + "px";
    moon.style.transform = `translate(-50%, -50%) scale(${moonScale})`;

    // Sun is at the real mean Earth-Sun distance and true diameter ratio.
    const sunScreenX = offsetX + sunWorldX * z;
    const sunScreenY = offsetY + sunWorldY * z;
    sun.style.left = sunScreenX + "px";
    sun.style.top = sunScreenY + "px";
    sun.style.width = sunDiameter + "px";
    sun.style.height = sunDiameter + "px";
    sun.style.transform = `translate(-50%, -50%) scale(${z})`;

    // Mercury orbits the Sun on its shorter, noticeably eccentric orbit.
    const mercuryPos = getMercuryWorldPosition();
    const mercuryScreenX = offsetX + mercuryPos.x * z;
    const mercuryScreenY = offsetY + mercuryPos.y * z;
    mercury.style.left = mercuryScreenX + "px";
    mercury.style.top = mercuryScreenY + "px";
    mercury.style.width = mercuryDiameter + "px";
    mercury.style.height = mercuryDiameter + "px";
    mercury.style.transform = `translate(-50%, -50%) scale(${z})`;

    // Coordinates currently under the centre of the screen.
    const worldX = (window.innerWidth / 2 - offsetX) / z;
    const worldY = (window.innerHeight / 2 - offsetY) / z;

    posReadout.textContent =
      `x ${formatNumber(worldX)} · y ${formatNumber(worldY)}`;

    zoomReadout.textContent = `zoom ${formatZoom(z)}`;

    const simDate = new Date(simulationTimeMs);
    simDateReadout.textContent = simDate.toLocaleString(undefined, {
      year: "numeric",
      month: "short",
      day: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    });
  }

  function formatNumber(n) {
    const a = Math.abs(n);

    if (a === 0) return "0";
    if (a >= 1e9 || a < 0.001) return n.toExponential(3);

    return n.toLocaleString(undefined, {
      maximumFractionDigits: a < 10 ? 3 : a < 1000 ? 2 : 0
    });
  }

  function formatZoom(z) {
    if (z >= 0.001 && z < 1000000) {
      return z.toLocaleString(undefined, { maximumFractionDigits: 3 }) + "×";
    }
    return z.toExponential(3) + "×";
  }

  function fadeHint() {
    hint.style.opacity = "0";
  }

  space.addEventListener("pointerdown", e => {
    space.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (pointers.size === 1) {
      lastSingle = { x: e.clientX, y: e.clientY };
      space.classList.add("dragging");
    }

    if (pointers.size === 2) {
      const pts = [...pointers.values()];
      lastPinchDistance = distance(pts[0], pts[1]);
      lastPinchCenter = midpoint(pts[0], pts[1]);
      lastSingle = null;
    }

    fadeHint();
  });

  space.addEventListener("pointermove", e => {
    if (!pointers.has(e.pointerId)) return;

    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (pointers.size === 1 && lastSingle) {
      const p = [...pointers.values()][0];

      offsetX += p.x - lastSingle.x;
      offsetY += p.y - lastSingle.y;

      lastSingle = { ...p };
      updateHUD();
      return;
    }

    if (pointers.size === 2) {
      const pts = [...pointers.values()];
      const d = distance(pts[0], pts[1]);
      const c = midpoint(pts[0], pts[1]);

      if (lastPinchDistance && lastPinchCenter) {
        // Pan with the pinch centre.
        offsetX += c.x - lastPinchCenter.x;
        offsetY += c.y - lastPinchCenter.y;

        // Zoom around the pinch centre.
        const ratio = d / lastPinchDistance;
        if (Number.isFinite(ratio) && ratio > 0) {
          zoomAt(c.x, c.y, Math.log(ratio));
        }
      }

      lastPinchDistance = d;
      lastPinchCenter = c;
      updateHUD();
    }
  });

  function endPointer(e) {
    pointers.delete(e.pointerId);

    if (pointers.size === 0) {
      lastSingle = null;
      lastPinchDistance = null;
      lastPinchCenter = null;
      space.classList.remove("dragging");
    } else if (pointers.size === 1) {
      const p = [...pointers.values()][0];
      lastSingle = { ...p };
      lastPinchDistance = null;
      lastPinchCenter = null;
    }
  }

  space.addEventListener("pointerup", endPointer);
  space.addEventListener("pointercancel", endPointer);

  space.addEventListener("wheel", e => {
    e.preventDefault();
    fadeHint();

    // Smooth logarithmic zoom.
    const delta = -e.deltaY * 0.0015;
    zoomAt(e.clientX, e.clientY, delta);
    updateHUD();
  }, { passive: false });

  function zoomAt(screenX, screenY, deltaPower) {
    const oldZoom = zoomValue();

    // Keep the zoom exponent within an enormous but numerically sane range.
    zoomPower = Math.max(-60, Math.min(60, zoomPower + deltaPower));

    const newZoom = zoomValue();

    // Preserve the world point under the cursor/fingers.
    const worldX = (screenX - offsetX) / oldZoom;
    const worldY = (screenY - offsetY) / oldZoom;

    offsetX = screenX - worldX * newZoom;
    offsetY = screenY - worldY * newZoom;
  }

  function distance(a, b) {
    return Math.hypot(a.x - b.x, a.y - b.y);
  }

  function midpoint(a, b) {
    return {
      x: (a.x + b.x) / 2,
      y: (a.y + b.y) / 2
    };
  }

  timeScaleInput.addEventListener("input", () => {
    advanceSimulationClock();
    timeScale = sliderToTimeScale(timeScaleInput.value);
    timeLabel.textContent = `Time ${formatTimeScale(timeScale)}`;
    updateHUD();
  });

  // Prevent the navigation gesture handler from treating slider use as space-dragging.
  ["pointerdown", "pointermove", "pointerup"].forEach(type => {
    timeScaleInput.addEventListener(type, e => e.stopPropagation());
  });


  function centerOnWorldPoint(worldX, worldY) {
    const z = zoomValue();
    offsetX = window.innerWidth / 2 - worldX * z;
    offsetY = window.innerHeight / 2 - worldY * z;
    updateHUD();
  }

  findMenu.addEventListener("change", () => {
    const choice = findMenu.value;

    if (choice === "origin") {
      centerOnWorldPoint(0, 0);
    } else if (choice === "sun") {
      centerOnWorldPoint(sunWorldX, sunWorldY);
    } else if (choice === "mercury") {
      const p = getMercuryWorldPosition();
      centerOnWorldPoint(p.x, p.y);
    } else if (choice === "earth") {
      const p = getEarthWorldPosition();
      centerOnWorldPoint(p.x, p.y);
    } else if (choice === "moon") {
      const p = getMoonWorldPosition();
      centerOnWorldPoint(p.x, p.y);
    }

    // Return menu to its placeholder for easy repeated use.
    findMenu.value = "";
  });

  ["pointerdown", "pointermove", "pointerup"].forEach(type => {
    findMenu.addEventListener(type, e => e.stopPropagation());
  });

  window.addEventListener("resize", () => {
    updateHUD();
  });

  updateHUD();

  // Advance simulated time and redraw four times per second.
  setInterval(() => {
    advanceSimulationClock();
    updateHUD();
  }, 250);
})();
</script>

</body>
</html>
