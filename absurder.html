<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Absurd Message Generator</title>

  <style>
    body {
      background: #848484;
      font-family: Futura, "Century Gothic", Arial, sans-serif;
      text-align: center;
      padding: 40px 20px;
      font-size: 24px;
    }

    h2 {
      font-size: 36px;
    }

    #message {
      font-size: 28px;
      margin: 30px 0;
    }

    button {
      font-size: 22px;
      padding: 14px 22px;
      border-radius: 18px;
    }
  </style>
</head>

<body>
  <h2>Random Absurd Message Generator</h2>

  <p id="message">Press the button. Regret nothing.</p>

  <button onclick="generateMessage()">Generate nonsense</button>

  <script>
    function generateMessage() {
      const subjects = [
  "The kettle",
  "A suspicious triangle",
  "Your left sock",
  "The Moon",
  "A Jobseeker",
  "A massive weapon",
  "A retired traffic cone",
  "The Department of Unnecessary Angles",
  "An unemployed seagull",
  "The last remaining biscuit",
  "A small but determined radiator",
  "Tuesday",
  "A huge turd"
];

      const actions = [
        "has been promoted beyond",
        "is quietly investigating",
        "can't stop farting unintentionally on",
        "shits upon",
        "accidentally pissed all over",
        "has declared war on",
        "is legally responsible for",
        "has become emotionally attached to",
        "is hiding underneath",
        "has accidentally invented",
        "has been banned from",
        "is refusing to acknowledge",
        "has filed a complaint against"
      ];

      const objects = [
        "its own competence.",
        "the concept of north.",
        "a ceremonial potato.",
        "three metres of suspicious carpet.",
        "the entire county of Denbighshire.",
        "a badly parked teaspoon.",
        "the number seven.",
        "an unauthorised cloud.",
        "your browsing history.",
        "a minor celestial incident."
      ];

      const subject =
        subjects[Math.floor(Math.random() * subjects.length)];

      const action =
        actions[Math.floor(Math.random() * actions.length)];

      const object =
        objects[Math.floor(Math.random() * objects.length)];

      document.getElementById("message").textContent =
        subject + " " + action + " " + object;
    }
  </script>
</body>
</html>
