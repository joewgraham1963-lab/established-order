<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D Simba - Physical Scale Universe</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#eee;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
canvas{display:block}
#top{position:fixed;left:10px;right:10px;top:10px;z-index:10;background:rgba(0,0,0,.58);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:9px 11px}
#title{font-weight:700;font-size:15px}
#sub,#stats{font-size:11px;opacity:.78;margin-top:3px}
#bottom{position:fixed;left:10px;right:10px;bottom:10px;z-index:10;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:8px}
select,button{background:#151515;color:#eee;border:1px solid #555;border-radius:8px;padding:7px 9px;font:inherit}
button{font-weight:700}
#zoom{flex:1;min-width:120px}
#info{position:fixed;left:10px;bottom:72px;z-index:10;max-width:min(390px,calc(100vw - 20px));background:rgba(0,0,0,.64);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:8px 10px;font-size:11px;line-height:1.35}
#badge{position:fixed;right:12px;top:96px;z-index:10;font-size:10px;opacity:.62;background:rgba(0,0,0,.45);padding:4px 6px;border-radius:7px}
</style>
</head>
<body>
<div id="top">
  <div id="title">3D SIMBA · PHYSICAL SCALE</div>
  <div id="sub">Sizes and distances use the same scale. Locator rings are signposts only.</div>
  <div id="stats"></div>
</div>
<div id="badge"></div>
<div id="info"></div>
<div id="bottom">
  <select id="dest">
    <option>Earth</option><option>Moon</option><option>Venus</option><option>Sun</option><option>Mercury</option><option>Jupiter</option><option>Saturn</option><option>Pluto</option>
    <option>Alpha Centauri</option><option>Polaris</option><option>Galactic Centre</option><option>Milky Way</option><option>Shirley's Galaxy</option><option>Simba</option><option>µ-Ziq</option><option>Observable Universe</option>
  </select>
  <button id="go">GO TO</button>
  <input id="zoom" type="range" min="-5" max="16" step=".01" value="-3.25">
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
(function(){
const AU_KM=149597870.7, LY_AU=63241.077, OBS_RADIUS_AU=46.5e9*LY_AU;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.00001,100000); camera.position.z=8;
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); renderer.setClearColor(0x000000,1); document.body.appendChild(renderer.domElement);
const world=new THREE.Group(); scene.add(world);
scene.add(new THREE.AmbientLight(0xffffff,.55));
const pointLight=new THREE.PointLight(0xffffff,1.4,0,2); world.add(pointLight);

const bgG=new THREE.BufferGeometry(), bg=[];
for(let i=0;i<420;i++){const z=2*Math.random()-1,a=Math.random()*Math.PI*2,r=80,s=Math.sqrt(1-z*z);bg.push(r*s*Math.cos(a),r*s*Math.sin(a),r*z);}
bgG.setAttribute('position',new THREE.Float32BufferAttribute(bg,3));
scene.add(new THREE.Points(bgG,new THREE.PointsMaterial({color:0xaabbd0,size:.05,transparent:true,opacity:.22,depthWrite:false})));

const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const radiusAU=km=>(km/2)/AU_KM;

const pos={
 Earth:V(0,0,0),
 Sun:V(-1,0,0),
 Moon:V(.00257,0,0),
 Venus:V(-.277,.18,0),
 Mercury:V(-1+.387,0,0),
 Jupiter:V(-1+5.204*Math.cos(.90),5.204*Math.sin(.90),0),
 Saturn:V(-1+9.58*Math.cos(-1.20),9.58*Math.sin(-1.20),0),
 Pluto:V(-1-39.48,0,0),
 Alpha:V(4.2465*LY_AU*.79,4.2465*LY_AU*.34,-4.2465*LY_AU*.51),
 Polaris:V(433*LY_AU*.12,433*LY_AU*.96,433*LY_AU*.25),
 GC:V(-26000*LY_AU,0,0),
 Simba:V(.0013,.0011,-.0016),
 Muziq:V(.012,0,0),
 ShirleyGalaxy:V(15e6*LY_AU*.73,15e6*LY_AU*.41,-15e6*LY_AU*.546)
};

const data={
 Earth:{p:pos.Earth,r:radiusAU(12742),c:0x3178c6,t:'Diameter 12,742 km'},
 Moon:{p:pos.Moon,r:radiusAU(3474.8),c:0xb7b7b7,t:'Mean distance 384,400 km'},
 Venus:{p:pos.Venus,r:radiusAU(12104),c:0xe6c27a,t:'Diameter 12,104 km · representative orbital position'},
 Sun:{p:pos.Sun,r:radiusAU(1392700),c:0xffd34d,t:'Diameter ~1.39 million km · distance 1 AU'},
 Mercury:{p:pos.Mercury,r:radiusAU(4879),c:0xaaa59d,t:'Diameter 4,879 km'},
 Jupiter:{p:pos.Jupiter,r:radiusAU(139820),c:0xd9b38c,t:'Diameter ~139,820 km · mean orbital distance 5.20 AU'},
 Saturn:{p:pos.Saturn,r:radiusAU(116460),c:0xd8c38f,t:'Diameter ~116,460 km · mean orbital distance 9.58 AU'},
 Pluto:{p:pos.Pluto,r:radiusAU(2377),c:0xbda98e,t:'Diameter ~2,377 km'},
 'Alpha Centauri':{p:pos.Alpha,r:radiusAU(1700000),c:0xffe4a6,t:'Star system ~4.2465 light-years away'},
 Polaris:{p:pos.Polaris,r:radiusAU(52000000),c:0xf5f2df,t:'North Star · about 433 light-years away'},
 'Galactic Centre':{p:pos.GC,r:2e-7,c:0xffb067,t:'Sagittarius A* · ~26,000 light-years away'},
 Simba:{p:pos.Simba,r:radiusAU(1),c:0xffffff,t:'Easter egg · locator only'}
};

const meshes={},rings={};
function addBody(n,d){
 const m=new THREE.Mesh(new THREE.SphereGeometry(1,n==='Earth'||n==='Sun'?32:20,20),new THREE.MeshPhongMaterial({color:d.c,emissive:n==='Sun'?d.c:0x000000,emissiveIntensity:n==='Sun'?.85:0}));
 m.userData.name=n; world.add(m); meshes[n]=m;
 const ring=new THREE.Mesh(new THREE.RingGeometry(.75,1,32),new THREE.MeshBasicMaterial({color:d.c,transparent:true,opacity:.72,side:THREE.DoubleSide,depthWrite:false}));
 world.add(ring); rings[n]=ring;
}
Object.keys(data).forEach(n=>addBody(n,data[n]));

const atmosphere=new THREE.Mesh(new THREE.SphereGeometry(1,32,24),new THREE.MeshBasicMaterial({color:0x63a9ff,transparent:true,opacity:.16,side:THREE.BackSide,depthWrite:false})); world.add(atmosphere);

function orbit(rad,col,op){
 const pts=[]; for(let i=0;i<=180;i++){const a=i/180*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a)*rad,Math.sin(a)*rad,0));}
 const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:col,transparent:true,opacity:op,depthWrite:false})); world.add(l); return l;
}
const moonOrbit=orbit(.00257,0x8aa0b8,.22), earthOrbit=orbit(1,0x876f3f,.16), jupiterOrbit=orbit(5.204,0x8f735a,.12), saturnOrbit=orbit(9.58,0x8b8065,.11), muziqOrbit=orbit(.012,0x8fdfe5,.16);

// Saturn's rings are also physically scaled, rather than given the usual science-poster treatment.
const saturnRings=new THREE.Mesh(
 new THREE.RingGeometry(1.24,2.33,64),
 new THREE.MeshBasicMaterial({color:0xc9b98f,transparent:true,opacity:.52,side:THREE.DoubleSide,depthWrite:false})
);
saturnRings.rotation.x=THREE.MathUtils.degToRad(26.7); world.add(saturnRings);

const MW_RADIUS_AU=50000*LY_AU, MW_HALF_AU=600*LY_AU, mwPhysical=[];
const mwG=new THREE.BufferGeometry(); mwG.setAttribute('position',new THREE.Float32BufferAttribute(new Float32Array(2200*3),3));
for(let i=0;i<2200;i++){const q=Math.pow(Math.random(),.65),r=q*MW_RADIUS_AU,a=Math.random()*Math.PI*2+q*6.5,z=(Math.random()-.5)*2*MW_HALF_AU*(1-q*.6);mwPhysical.push(V(pos.GC.x+r*Math.cos(a),r*Math.sin(a),z));}
const mw=new THREE.Points(mwG,new THREE.PointsMaterial({color:0xb9c9ff,size:.025,transparent:true,opacity:.45,depthWrite:false})); world.add(mw);

// Shirley's Galaxy: fictional location, physically scaled as a modest spiral galaxy about 90,000 ly across.
const SHIRLEY_RADIUS_AU=45000*LY_AU, shirleyPhysical=[];
const shirleyG=new THREE.BufferGeometry(); shirleyG.setAttribute('position',new THREE.Float32BufferAttribute(new Float32Array(1600*3),3));
for(let i=0;i<1600;i++){
 const q=Math.pow(Math.random(),.68),r=q*SHIRLEY_RADIUS_AU,arm=(i%3)*Math.PI*2/3,a=arm+q*7.2+(Math.random()-.5)*.55,z=(Math.random()-.5)*SHIRLEY_RADIUS_AU*.055*(1-q*.45);
 shirleyPhysical.push(V(pos.ShirleyGalaxy.x+r*Math.cos(a),pos.ShirleyGalaxy.y+r*Math.sin(a),pos.ShirleyGalaxy.z+z));
}
const shirleyGalaxy=new THREE.Points(shirleyG,new THREE.PointsMaterial({color:0xd8c8ff,size:.028,transparent:true,opacity:.52,depthWrite:false})); world.add(shirleyGalaxy);

const obs=new THREE.Mesh(new THREE.SphereGeometry(1,32,18),new THREE.MeshBasicMaterial({color:0x5478a8,wireframe:true,transparent:true,opacity:.035,depthWrite:false})); world.add(obs);

new THREE.TextureLoader().load('simba.jpg',tex=>{const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,opacity:.95,depthWrite:false}));s.scale.set(.72,.52,1);world.add(s);meshes.SimbaPhoto=s;});

// µ-Ziq · Chewed Corners: a deliberately non-astronomical cultural satellite.
new THREE.TextureLoader().load('μ-ziq.jpg',tex=>{
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,opacity:.96,depthWrite:false}));
 s.scale.set(.78,.72,1);world.add(s);meshes.MuziqPhoto=s;
});

// Shirley, sovereign of a fictional galaxy and, like every observer, centre of her observable universe.
new THREE.TextureLoader().load('shirley.jpg',tex=>{
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,opacity:.96,depthWrite:false}));
 s.scale.set(.82,.82,1);world.add(s);meshes.ShirleyPhoto=s;
});

let auPerUnit=Math.pow(10,-3.25), focusAU=pos.Earth.clone(), rotX=.12,rotY=-.35,flight=null;
const dest=document.getElementById('dest'),go=document.getElementById('go'),zoom=document.getElementById('zoom'),stats=document.getElementById('stats'),info=document.getElementById('info'),badge=document.getElementById('badge');

const targetLog={Earth:-4,Moon:-4,Venus:-2.35,Sun:-2.15,Mercury:-2.5,Jupiter:-1.4,Saturn:-1.35,Pluto:-1.2,'Alpha Centauri':4.65,Polaris:6.65,'Galactic Centre':8.45,'Milky Way':8.75,Simba:-4.1,'µ-Ziq':-3.35,"Shirley's Galaxy":9.0,'Observable Universe':14.65};

function fmt(au){
 au=Math.abs(au);
 if(au<.01)return Math.round(au*AU_KM).toLocaleString()+' km';
 if(au<1000)return au.toLocaleString(undefined,{maximumFractionDigits:3})+' AU';
 const ly=au/LY_AU;
 if(ly<1000)return ly.toLocaleString(undefined,{maximumFractionDigits:3})+' ly';
 if(ly<1e6)return (ly/1000).toFixed(2)+' kly';
 if(ly<1e9)return (ly/1e6).toFixed(2)+' Mly';
 return (ly/1e9).toFixed(2)+' Gly';
}
function focusFor(n){if(n==='Observable Universe'||n==='Milky Way')return pos.Earth.clone();if(n==='Alpha Centauri')return pos.Alpha.clone();if(n==='Polaris')return pos.Polaris.clone();if(n==='Galactic Centre')return pos.GC.clone();if(n==="Shirley's Galaxy")return pos.ShirleyGalaxy.clone();if(n==='µ-Ziq')return pos.Muziq.clone();return data[n]?data[n].p.clone():pos.Earth.clone();}
function showInfo(n){
 let s='';
 if(n==='Observable Universe')s='Observable universe · present comoving radius about 46.5 billion light-years.';
 else if(n==='Milky Way')s='Milky Way · schematic stellar distribution, about 100,000 light-years across.';
 else if(n==='µ-Ziq')s='µ-Ziq · Chewed Corners (2013) · cultural satellite in a deliberately fictional Earth orbit.';
 else if(n==="Shirley's Galaxy")s="SHIRLEY'S GALAXY · fictional spiral galaxy about 15 million light-years from Earth · Shirley is at the centre of her observable universe.";
 else if(data[n])s=n+' · '+data[n].t+(n!=='Earth'?' · Earth distance '+fmt(data[n].p.distanceTo(pos.Earth)):'');
 info.textContent=s;
}
function startFlight(n){
 const ff=focusAU.clone(),tf=focusFor(n),fl=Math.log10(auPerUnit),tl=targetLog[n]??fl;
 flight={start:performance.now(),dur:Math.min(6500,1100+Math.abs(tl-fl)*420),ff,tf,fl,tl}; showInfo(n);
}
function updateFlight(now){
 if(!flight)return;
 let t=(now-flight.start)/flight.dur;if(t>1)t=1;const s=t*t*(3-2*t);
 focusAU.copy(flight.ff).lerp(flight.tf,s);
 const lg=THREE.MathUtils.lerp(flight.fl,flight.tl,s);auPerUnit=Math.pow(10,lg);zoom.value=lg;
 if(t===1)flight=null;
}
const tmp=new THREE.Vector3();
const display=(p,out)=>out.copy(p).sub(focusAU).multiplyScalar(1/auPerUnit);

function updateWorld(){
 for(const [n,d] of Object.entries(data)){
   const m=meshes[n],rr=d.r/auPerUnit; display(d.p,tmp);m.position.copy(tmp);m.scale.setScalar(Math.max(rr,1e-10));
   const ring=rings[n];ring.position.copy(tmp);ring.quaternion.copy(camera.quaternion);ring.scale.setScalar(.085);ring.visible=rr<.018&&tmp.length()<70;
 }
 display(pos.Earth,tmp);atmosphere.position.copy(tmp);const er=data.Earth.r/auPerUnit;atmosphere.scale.setScalar(er*1.025);atmosphere.visible=er>.004;
 moonOrbit.scale.setScalar(1/auPerUnit);moonOrbit.position.copy(display(pos.Earth,new THREE.Vector3()));moonOrbit.visible=(.00257/auPerUnit)<30&&(.00257/auPerUnit)>.02;
 earthOrbit.scale.setScalar(1/auPerUnit);earthOrbit.position.copy(display(pos.Sun,new THREE.Vector3()));earthOrbit.visible=(1/auPerUnit)<30&&(1/auPerUnit)>.02;
 jupiterOrbit.scale.setScalar(1/auPerUnit);jupiterOrbit.position.copy(display(pos.Sun,new THREE.Vector3()));jupiterOrbit.visible=(5.204/auPerUnit)<30&&(5.204/auPerUnit)>.02;
 saturnOrbit.scale.setScalar(1/auPerUnit);saturnOrbit.position.copy(display(pos.Sun,new THREE.Vector3()));saturnOrbit.visible=(9.58/auPerUnit)<30&&(9.58/auPerUnit)>.02;
 display(pos.Saturn,tmp);saturnRings.position.copy(tmp);saturnRings.scale.setScalar(data.Saturn.r/auPerUnit);saturnRings.visible=(data.Saturn.r/auPerUnit)>.0007&&tmp.length()<70;
 muziqOrbit.scale.setScalar(1/auPerUnit);muziqOrbit.position.copy(display(pos.Earth,new THREE.Vector3()));muziqOrbit.visible=(.012/auPerUnit)<30&&(.012/auPerUnit)>.02;
 pointLight.position.copy(display(pos.Sun,new THREE.Vector3()));

 if(meshes.SimbaPhoto){display(pos.Simba,tmp);meshes.SimbaPhoto.position.copy(tmp);meshes.SimbaPhoto.visible=tmp.length()<12&&Math.log10(auPerUnit)<-2.5;}
 if(meshes.MuziqPhoto){display(pos.Muziq,tmp);meshes.MuziqPhoto.position.copy(tmp);meshes.MuziqPhoto.visible=tmp.length()<14&&Math.log10(auPerUnit)<-2.0;}

 const sgr=SHIRLEY_RADIUS_AU/auPerUnit;shirleyGalaxy.visible=sgr>.0015&&sgr<45;
 if(shirleyGalaxy.visible){const a=shirleyGalaxy.geometry.attributes.position.array;for(let i=0;i<shirleyPhysical.length;i++){const p=shirleyPhysical[i];a[i*3]=(p.x-focusAU.x)/auPerUnit;a[i*3+1]=(p.y-focusAU.y)/auPerUnit;a[i*3+2]=(p.z-focusAU.z)/auPerUnit;}shirleyGalaxy.geometry.attributes.position.needsUpdate=true;}
 if(meshes.ShirleyPhoto){
   display(pos.ShirleyGalaxy,tmp);meshes.ShirleyPhoto.position.copy(tmp);
   // Let the portrait respond to zoom instead of remaining the same screen size.
   const ss=Math.max(.035,Math.min(.82,sgr*.18));meshes.ShirleyPhoto.scale.set(ss,ss,1);
   meshes.ShirleyPhoto.visible=tmp.length()<70&&Math.log10(auPerUnit)>7.7&&Math.log10(auPerUnit)<11.5;
 }

 const dr=MW_RADIUS_AU/auPerUnit;mw.visible=dr>.0015&&dr<80;
 if(mw.visible){const a=mw.geometry.attributes.position.array;for(let i=0;i<mwPhysical.length;i++){const p=mwPhysical[i];a[i*3]=(p.x-focusAU.x)/auPerUnit;a[i*3+1]=(p.y-focusAU.y)/auPerUnit;a[i*3+2]=(p.z-focusAU.z)/auPerUnit;}mw.geometry.attributes.position.needsUpdate=true;}

 // At intergalactic zooms, keep both home galaxies discoverable rather than letting them vanish into blackness.
 if(Math.log10(auPerUnit)>10.3){
   const sr=meshes.ShirleyPhoto; if(sr) sr.material.opacity=Math.max(.18,Math.min(.75,sgr*45));
 } else if(meshes.ShirleyPhoto){meshes.ShirleyPhoto.material.opacity=.96;}

 display(pos.Earth,tmp);obs.position.copy(tmp);const or=OBS_RADIUS_AU/auPerUnit;obs.scale.setScalar(or);obs.visible=or>.15&&or<80;
}
go.onclick=()=>startFlight(dest.value);dest.onchange=()=>showInfo(dest.value);
zoom.oninput=()=>{flight=null;auPerUnit=Math.pow(10,parseFloat(zoom.value));};

let dragging=false,lx=0,ly=0,lastPinch=0,lastTouchCX=0,lastTouchCY=0,multiTouch=false;
renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lx=e.clientX;ly=e.clientY;renderer.domElement.setPointerCapture(e.pointerId);});
renderer.domElement.addEventListener('pointermove',e=>{if(!dragging||multiTouch)return;const dx=e.clientX-lx,dy=e.clientY-ly;flight=null;panFocusByPixels(dx,dy);lx=e.clientX;ly=e.clientY;});
renderer.domElement.addEventListener('pointerup',()=>dragging=false);
renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();flight=null;let lg=Math.log10(auPerUnit)+Math.sign(e.deltaY)*.12;lg=Math.max(-5,Math.min(16,lg));auPerUnit=Math.pow(10,lg);zoom.value=lg;},{passive:false});

// Two fingers now do two jobs naturally: pinch changes scale, while moving the
// pair together pans while pinching. One-finger drag now pans too, which is much more useful on a phone after GO TO.
function panFocusByPixels(dx,dy){
 const viewH=2*camera.position.z*Math.tan(THREE.MathUtils.degToRad(camera.fov*.5));
 const physPerPixel=auPerUnit*viewH/Math.max(innerHeight,1);
 const delta=new THREE.Vector3(-dx*physPerPixel,dy*physPerPixel,0);
 const q=new THREE.Quaternion().setFromEuler(new THREE.Euler(rotX,rotY,0,'XYZ')).invert();
 delta.applyQuaternion(q);
 focusAU.add(delta);
}
renderer.domElement.addEventListener('touchstart',e=>{
 if(e.touches.length===2){
   multiTouch=true; flight=null;
   const x0=e.touches[0].clientX,y0=e.touches[0].clientY,x1=e.touches[1].clientX,y1=e.touches[1].clientY;
   lastPinch=Math.hypot(x0-x1,y0-y1); lastTouchCX=(x0+x1)/2; lastTouchCY=(y0+y1)/2;
 }
},{passive:true});
renderer.domElement.addEventListener('touchmove',e=>{
 if(e.touches.length===2){
   multiTouch=true; flight=null;
   const x0=e.touches[0].clientX,y0=e.touches[0].clientY,x1=e.touches[1].clientX,y1=e.touches[1].clientY;
   const d=Math.hypot(x0-x1,y0-y1),cx=(x0+x1)/2,cy=(y0+y1)/2;
   if(lastPinch){
     let lg=Math.log10(auPerUnit)-Math.log10(d/lastPinch)*1.7;
     lg=Math.max(-5,Math.min(16,lg)); auPerUnit=Math.pow(10,lg); zoom.value=lg;
     panFocusByPixels(cx-lastTouchCX,cy-lastTouchCY);
   }
   lastPinch=d; lastTouchCX=cx; lastTouchCY=cy; e.preventDefault();
 }
},{passive:false});
renderer.domElement.addEventListener('touchend',e=>{
 if(e.touches.length<2){lastPinch=0;multiTouch=false;}
 if(e.touches.length===0)dragging=false;
});

function scaleName(){const lg=Math.log10(auPerUnit);if(lg<-3)return'Earth–Moon scale';if(lg<0)return'Solar-system scale';if(lg<5)return'Interstellar scale';if(lg<10)return'Galactic scale';return'Cosmic scale';}
function animate(now){
 requestAnimationFrame(animate);
 // Slow display orbit around Earth: one revolution every 90 seconds.
 const ma=(now/90000)*Math.PI*2;pos.Muziq.set(Math.cos(ma)*.012,Math.sin(ma)*.012,Math.sin(ma*.37)*.0018);
 updateFlight(now);world.rotation.x=rotX;world.rotation.y=rotY;updateWorld();
 stats.textContent='View width ≈ '+fmt(auPerUnit*9.1)+' · 1 scene unit = '+fmt(auPerUnit);badge.textContent=scaleName();
 meshes.Earth.rotation.y=now*.00005;meshes.Moon.rotation.y=now*.000015;meshes.Sun.rotation.y=now*.000008;
 renderer.render(scene,camera);
}
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
showInfo('Earth');animate(performance.now());
})();
</script>
</body>
</html>
