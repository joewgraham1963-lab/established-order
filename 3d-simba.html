<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Visible Universe 3D + Simba</title>
<style>
html,body{
  margin:0;height:100%;overflow:hidden;background:#000;color:#fff;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  touch-action:none;
}
#app{position:fixed;inset:0;}
canvas{display:block;width:100%;height:100%;touch-action:none}
.panel,.controls{
  position:fixed;left:12px;right:12px;z-index:10;
  background:rgba(0,0,0,.62);
  border:1px solid rgba(255,255,255,.18);
  border-radius:12px;padding:10px 12px;
}
.panel{top:12px}
.controls{bottom:12px}
.title{font-weight:700;letter-spacing:.04em;margin-bottom:4px}
.sub{opacity:.76;font-size:12px;line-height:1.35}
.row{display:flex;gap:8px;align-items:center}
button{
  background:#151515;color:#fff;border:1px solid #555;border-radius:9px;
  padding:8px 10px;font-weight:650
}
button.active{background:#f2d54a;color:#111;border-color:#f2d54a}
input[type=range]{width:100%}
#stats{margin-top:7px;font-size:12px;opacity:.88}
#hint{
  position:fixed;right:14px;top:132px;z-index:10;font-size:11px;
  opacity:.55;text-align:right;pointer-events:none
}
.yellow{color:#f2d54a}
</style>
</head>
<body>

<div id="app"></div>

<div class="panel">
  <div class="title">THE VISIBLE UNIVERSE · 3D</div>
  <div class="sub">
    Earth is fixed at the centre. Drag to rotate. Pinch to zoom.
    Distances are logarithmically compressed. Simba is in here too.
  </div>
</div>

<div id="hint">drag = rotate<br>pinch = zoom</div>

<div class="controls">
  <div class="row">
    <button id="play">▶ TIME</button>
    <button id="reset">NOW</button>
    <span style="font-size:12px;opacity:.75">speed</span>
    <input id="speed" type="range" min="0" max="8" step="1" value="3">
  </div>
  <div id="stats"></div>
</div>

<!-- Classic non-module build: deliberately boring, therefore useful. -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
(function(){
  const app = document.getElementById('app');

  if (!window.THREE) {
    const msg=document.createElement('div');
    msg.style.cssText='position:fixed;inset:35% 20px auto;text-align:center;color:#fff;font-size:18px;z-index:30';
    msg.textContent='3D library failed to load. Open this page once in Chrome or Firefox.';
    document.body.appendChild(msg);
    return;
  }

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000000);

  const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.01, 500);
  camera.position.set(0, 2.8, 11);

  const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(innerWidth, innerHeight);
  app.appendChild(renderer.domElement);

  const root = new THREE.Group();
  scene.add(root);

  scene.add(new THREE.AmbientLight(0xffffff, 1.25));

  const CURRENT_HORIZON_GLY = 46.5;
  const SCENE_HORIZON_RADIUS = 8.0;

  function compressedRadius(distanceLy, horizonGly){
    horizonGly = horizonGly || CURRENT_HORIZON_GLY;
    const d = Math.max(distanceLy, 1e-9);
    const horizonLy = horizonGly * 1e9;
    return SCENE_HORIZON_RADIUS *
      Math.log10(1+d) / Math.log10(1+horizonLy);
  }

  // Observable-universe shell
  const shell = new THREE.Mesh(
    new THREE.SphereGeometry(SCENE_HORIZON_RADIUS, 32, 22),
    new THREE.MeshBasicMaterial({
      color:0x7aa7ff,transparent:true,opacity:.09,wireframe:true
    })
  );
  root.add(shell);

  // Yellow inner glow
  const halo = new THREE.Mesh(
    new THREE.SphereGeometry(SCENE_HORIZON_RADIUS*.985, 28, 18),
    new THREE.MeshBasicMaterial({
      color:0xf2d54a,transparent:true,opacity:.025,side:THREE.BackSide
    })
  );
  root.add(halo);

  // Earth
  const earth = new THREE.Mesh(
    new THREE.SphereGeometry(.12,20,14),
    new THREE.MeshBasicMaterial({color:0xffffff})
  );
  root.add(earth);

  // axes
  const axisMat = new THREE.LineBasicMaterial({color:0x555555,transparent:true,opacity:.35});
  ['x','y','z'].forEach(function(axis){
    const a=new THREE.Vector3(), b=new THREE.Vector3();
    a[axis]=-SCENE_HORIZON_RADIUS;
    b[axis]= SCENE_HORIZON_RADIUS;
    const g=new THREE.BufferGeometry().setFromPoints([a,b]);
    root.add(new THREE.Line(g,axisMat));
  });

  function addDot(distanceLy, dir, colour, size){
    const p=new THREE.Vector3(dir[0],dir[1],dir[2]).normalize()
      .multiplyScalar(compressedRadius(distanceLy));
    const m=new THREE.Mesh(
      new THREE.SphereGeometry(size||.05,12,8),
      new THREE.MeshBasicMaterial({color:colour})
    );
    m.position.copy(p); root.add(m); return p;
  }

  const alphaPos=addDot(4.2465,[.82,-.22,.53],0xf2d54a,.09);
  addDot(8.6,[-.55,.43,.71],0xffffff,.055);
  addDot(642,[.20,.81,-.55],0xffb07a,.055);
  addDot(2.54e6,[-.77,.18,-.61],0xbfd4ff,.055);
  addDot(5.38e7,[.63,-.55,-.55],0xb7c7ff,.055);

  // Stable star field
  let seed=1963;
  function random(){
    seed=(seed*1664525+1013904223)>>>0;
    return seed/4294967296;
  }

  const count=5000;
  const arr=new Float32Array(count*3);
  for(let i=0;i<count;i++){
    const u=random(),v=random(),w=random();
    const theta=2*Math.PI*u;
    const zz=2*v-1;
    const s=Math.sqrt(1-zz*zz);
    const r=SCENE_HORIZON_RADIUS*Math.pow(w,.42);
    arr[i*3]=r*s*Math.cos(theta);
    arr[i*3+1]=r*zz;
    arr[i*3+2]=r*s*Math.sin(theta);
  }
  const starGeo=new THREE.BufferGeometry();
  starGeo.setAttribute('position',new THREE.BufferAttribute(arr,3));
  root.add(new THREE.Points(
    starGeo,
    new THREE.PointsMaterial({color:0xffffff,size:.024,transparent:true,opacity:.82})
  ));

  // Canvas labels
  function makeLabel(text, colour, scale){
    const c=document.createElement('canvas');
    c.width=512;c.height=96;
    const x=c.getContext('2d');
    x.font='bold 38px system-ui,sans-serif';
    x.fillStyle=colour||'#fff';
    x.textAlign='center';x.textBaseline='middle';
    x.fillText(text,256,48);
    const t=new THREE.CanvasTexture(c);
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({
      map:t,transparent:true,depthTest:false
    }));
    scale=scale||.5;
    sp.scale.set(scale*3.3,scale*.62,1);
    return sp;
  }

  const earthLabel=makeLabel('EARTH · YOU ARE HERE','#ffffff',.55);
  earthLabel.position.set(0,.36,0); root.add(earthLabel);

  const alphaLabel=makeLabel('ALPHA CENTAURI · 4.2465 ly','#f2d54a',.48);
  alphaLabel.position.copy(alphaPos).add(new THREE.Vector3(0,.24,0));
  root.add(alphaLabel);

  const horizonLabel=makeLabel('OBSERVABLE LIMIT · ≈ 46.5 Gly radius','#8fb2ff',.42);
  horizonLabel.position.set(0,SCENE_HORIZON_RADIUS+.38,0);
  root.add(horizonLabel);

  // Simba: preserve original X and Y exactly. Add secret Z.
  const simbaWorldX = 17976.8246236122;
  const simbaWorldY = -37470.3745070261;
  const simbaWorldZ = 31415.9265358979;

  const simbaPos=new THREE.Vector3(
    simbaWorldX,simbaWorldY,simbaWorldZ
  ).normalize().multiplyScalar(.92);

  const simbaMarker=new THREE.Mesh(
    new THREE.SphereGeometry(.026,12,8),
    new THREE.MeshBasicMaterial({color:0xffffff})
  );
  simbaMarker.position.copy(simbaPos);
  root.add(simbaMarker);

  let simbaSprite=null;
  const loader=new THREE.TextureLoader();
  loader.load('simba.jpg',function(tex){
    const mat=new THREE.SpriteMaterial({map:tex,transparent:true});
    simbaSprite=new THREE.Sprite(mat);
    simbaSprite.position.copy(simbaPos);
    simbaSprite.scale.set(.17,.22,1);
    root.add(simbaSprite);
  });

  // A deliberately faint Simba label
  const simbaLabel=makeLabel('SIMBA','#ffffff',.23);
  simbaLabel.position.copy(simbaPos).add(new THREE.Vector3(0,.11,0));
  if(simbaLabel.material) simbaLabel.material.opacity=.28;
  root.add(simbaLabel);

  // Custom rotation + pinch controls, avoiding OrbitControls/modules.
  let rotX=0,rotY=0;
  let distance=11;
  let dragging=false;
  let lastX=0,lastY=0;
  const pointers={};
  let pinchStart=0;
  let pinchDistanceStart=distance;

  function updateCamera(){
    distance=Math.max(2.7,Math.min(45,distance));
    camera.position.set(0,0,distance);
    camera.lookAt(0,0,0);
    root.rotation.x=rotX;
    root.rotation.y=rotY;
  }

  function pointerCount(){ return Object.keys(pointers).length; }
  function pinchDistance(){
    const vals=Object.values(pointers);
    if(vals.length<2) return 0;
    const dx=vals[0].x-vals[1].x;
    const dy=vals[0].y-vals[1].y;
    return Math.hypot(dx,dy);
  }

  renderer.domElement.addEventListener('pointerdown',function(e){
    pointers[e.pointerId]={x:e.clientX,y:e.clientY};
    renderer.domElement.setPointerCapture(e.pointerId);
    if(pointerCount()===1){
      dragging=true;lastX=e.clientX;lastY=e.clientY;
    }
    if(pointerCount()===2){
      pinchStart=pinchDistance();
      pinchDistanceStart=distance;
      dragging=false;
    }
  });

  renderer.domElement.addEventListener('pointermove',function(e){
    if(!pointers[e.pointerId]) return;
    pointers[e.pointerId]={x:e.clientX,y:e.clientY};

    if(pointerCount()===1 && dragging){
      const dx=e.clientX-lastX;
      const dy=e.clientY-lastY;
      rotY+=dx*.006;
      rotX+=dy*.006;
      rotX=Math.max(-1.45,Math.min(1.45,rotX));
      lastX=e.clientX;lastY=e.clientY;
    }else if(pointerCount()===2){
      const d=pinchDistance();
      if(pinchStart>0){
        distance=pinchDistanceStart*(pinchStart/d);
      }
    }
    updateCamera();
  });

  function endPointer(e){
    delete pointers[e.pointerId];
    if(pointerCount()===1){
      const v=Object.values(pointers)[0];
      lastX=v.x;lastY=v.y;dragging=true;
    }else if(pointerCount()===0){
      dragging=false;
    }
  }
  renderer.domElement.addEventListener('pointerup',endPointer);
  renderer.domElement.addEventListener('pointercancel',endPointer);

  renderer.domElement.addEventListener('wheel',function(e){
    e.preventDefault();
    distance*=Math.exp(e.deltaY*.001);
    updateCamera();
  },{passive:false});

  // Time
  let playing=false, yearsAhead=0, last=performance.now();
  const speeds=[0,1e3,1e5,1e6,1e7,1e8,1e9,5e9,1e10];
  const speedInput=document.getElementById('speed');
  const playBtn=document.getElementById('play');
  const resetBtn=document.getElementById('reset');
  const stats=document.getElementById('stats');

  playBtn.onclick=function(){
    playing=!playing;
    playBtn.classList.toggle('active',playing);
    playBtn.textContent=playing?'❚❚ TIME':'▶ TIME';
  };

  resetBtn.onclick=function(){
    yearsAhead=0;playing=false;
    playBtn.classList.remove('active');
    playBtn.textContent='▶ TIME';
  };

  function horizonAt(years){
    return CURRENT_HORIZON_GLY+years/1e9;
  }

  function animate(now){
    requestAnimationFrame(animate);
    const dt=Math.min((now-last)/1000,.08);
    last=now;

    if(playing){
      yearsAhead+=speeds[+speedInput.value]*dt;
    }

    // Illustrative expansion
    const h=horizonAt(yearsAhead);
    const scale=h/CURRENT_HORIZON_GLY;
    shell.scale.setScalar(scale);
    halo.scale.setScalar(scale);

    stats.innerHTML=
      'fast-forward: <span class="yellow">'+yearsAhead.toExponential(2)+' years</span> · '+
      'observable radius: <span class="yellow">'+h.toFixed(2)+' Gly</span>';

    renderer.render(scene,camera);
  }

  updateCamera();
  requestAnimationFrame(animate);

  addEventListener('resize',function(){
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });

})();
</script>
</body>
</html>
