<!doctype html>

<title>3D Simba - Physical Scale Universe</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#eee;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}

<script>
(function(){
const AU_KM=149597870.7, LY_AU=63241.077, OBS_RADIUS_AU=46.5e9*LY_AU;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.00001,100000); camera.position.z=8;
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); renderer.setClearColor(0x000000,1); document.body.appendChild(renderer.domElement);
const world=new THREE.Group(); scene.add(world);
scene.add(new THREE.AmbientLight(0xffffff,.16));
const pointLight=new THREE.PointLight(0xffffff,1.9,0,2); world.add(pointLight);

const bgG=new THREE.BufferGeometry(), bg=[];
for(let i=0;i<420;i++){const z=2*Math.random()-1,a=Math.random()*Math.PI*2,r=80,s=Math.sqrt(1-z*z);bg.push(r*s*Math.cos(a),r*s*Math.sin(a),r*z);}
bgG.setAttribute('position',new THREE.Float32BufferAttribute(bg,3));
scene.add(new THREE.Points(bgG,new THREE.PointsMaterial({color:0xaabbd0,size:.05,transparent:true,opacity:.22,depthWrite:false})));

// Earth-sky Milky Way: an internal view of the galactic plane.
// This is a faint celestial band centred on Earth, separate from the external 3-D Milky Way model.
// The orientation uses the IAU galactic north pole and ascending node in J2000 coordinates.
const MW_SKY_RADIUS_AU=0.18; // visual sky shell only, not a physical distance
const mwSkyGroup=new THREE.Group();world.add(mwSkyGroup);

function eqVecFromRaDec(raDeg,decDeg){
 const skyDeg=Math.PI/180;
 const ra=raDeg*skyDeg,dec=decDeg*skyDeg;
 return new THREE.Vector3(
  Math.cos(dec)*Math.cos(ra),
  Math.sin(dec),
  Math.cos(dec)*Math.sin(ra)
 );
}
// J2000 north galactic pole: RA 192.85948°, Dec +27.12825°.
// Build an orthonormal basis for the galactic plane.
const galN=eqVecFromRaDec(192.85948,27.12825).normalize();
let galX=eqVecFromRaDec(266.4051,-28.936175).normalize(); // approximate Galactic Centre direction
galX.sub(galN.clone().multiplyScalar(galX.dot(galN))).normalize();
const galY=new THREE.Vector3().crossVectors(galN,galX).normalize();

let mwSkySeed=424242;
const mwSkyRnd=()=>((mwSkySeed=(mwSkySeed*1664525+1013904223)>>>0)/4294967296);
const mwSkyPts=[];
for(let i=0;i<2400;i++){
 const lon=mwSkyRnd()*Math.PI*2;
 // Concentrate most points near the galactic plane, with a few broader outliers.
 const u=(mwSkyRnd()+mwSkyRnd()+mwSkyRnd()+mwSkyRnd())/4-.5;
 const lat=u*(i<2100?.16:.34);
 const c=Math.cos(lat),s=Math.sin(lat);
 const dir=galX.clone().multiplyScalar(Math.cos(lon)*c)
   .add(galY.clone().multiplyScalar(Math.sin(lon)*c))
   .add(galN.clone().multiplyScalar(s));
 const r=MW_SKY_RADIUS_AU*(.985+mwSkyRnd()*.03);
 mwSkyPts.push(dir.x*r,dir.y*r,dir.z*r);
}
const mwSkyGeom=new THREE.BufferGeometry();
mwSkyGeom.setAttribute('position',new THREE.Float32BufferAttribute(mwSkyPts,3));
const mwSkyMat=new THREE.PointsMaterial({
 color:0xd7d5c9,size:.022,transparent:true,opacity:.22,
 sizeAttenuation:true,depthWrite:false,blending:THREE.AdditiveBlending
});
const mwSky=new THREE.Points(mwSkyGeom,mwSkyMat);
mwSkyGroup.add(mwSky);

// Add a very faint diffuse ribbon so the band reads as haze, not only stars.
const mwRibbonGeom=new THREE.BufferGeometry(),mwRibbonPts=[];
for(let i=0;i<=720;i++){
 const lon=i/720*Math.PI*2;
 const dir=galX.clone().multiplyScalar(Math.cos(lon))
  .add(galY.clone().multiplyScalar(Math.sin(lon))).normalize().multiplyScalar(MW_SKY_RADIUS_AU*.997);
 mwRibbonPts.push(dir);
}
mwRibbonGeom.setFromPoints(mwRibbonPts);
const mwRibbon=new THREE.Line(
 mwRibbonGeom,
 new THREE.LineBasicMaterial({color:0xb8b4a8,transparent:true,opacity:.08,depthWrite:false})
);
mwSkyGroup.add(mwRibbon);


const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const radiusAU=km=>(km/2)/AU_KM;
// Earth-centred equatorial direction helper. Distances are physical light-years converted to AU.
const skyPos=(distLy,raHours,decDeg)=>{const ra=raHours*Math.PI/12,dec=decDeg*Math.PI/180,r=distLy*LY_AU;return V(r*Math.cos(dec)*Math.cos(ra),r*Math.sin(dec),r*Math.cos(dec)*Math.sin(ra));};

const pos={
 Earth:V(0,0,0),
 ISS:V(0,0,0),
 Sun:V(-1,0,0),
 Moon:V(.00257,0,0),
 Venus:V(0,0,0),
 Mercury:V(0,0,0),
 Mars:V(0,0,0),
 Jupiter:V(0,0,0),
 Saturn:V(0,0,0),
 Uranus:V(0,0,0),
 Neptune:V(0,0,0),
 Pluto:V(-1-39.48,0,0),
 Halley:V(0,0,0),
 Alpha:V(4.2465*LY_AU*.79,4.2465*LY_AU*.34,-4.2465*LY_AU*.51),
 R_Doradus:V(178*LY_AU*.58,-178*LY_AU*.71,178*LY_AU*.40),
 Stephenson:V(18900*LY_AU*.46,18900*LY_AU*.73,-18900*LY_AU*.505),
 Polaris:V(433*LY_AU*.12,433*LY_AU*.96,433*LY_AU*.25),
 GaiaBH1:skyPos(1560,262.17120816/15,-0.58109202),
 TON618:skyPos(10.8e9,12+28/60+24.9/3600,31+28/60+38/3600),
 GaiaBH1Companion:V(0,0,0),
 GC:V(-26000*LY_AU,0,0),
 Simba:V(.0013,.0011,-.0016),
 Muziq:V(.012,0,0),
 Andromeda:V(2.54e6*LY_AU*.82,2.54e6*LY_AU*.32,-2.54e6*LY_AU*.475),
 IC1101:V(1.04e9*LY_AU*.61,-1.04e9*LY_AU*.34,1.04e9*LY_AU*.716),
 ShirleyGalaxy:V(15e6*LY_AU*.73,15e6*LY_AU*.41,-15e6*LY_AU*.546),
 OrionNebula:skyPos(1344,5+35/60,-5.45),
 EagleNebula:skyPos(7000,18+18/60,-13.8),
 CarinaNebula:skyPos(7500,10+45/60,-59.9),
 LagoonNebula:skyPos(4100,18+3/60,-24.4),
 TarantulaNebula:skyPos(160000,5+38/60,-69.1),
 R136a1:skyPos(160000,5+38/60,-69.1).add(V(32*LY_AU,-18*LY_AU,11*LY_AU))
};

// Live low-precision planetary ephemeris. The coefficients are JPL's
// 1800–2050 approximate Keplerian elements, evaluated from the device clock.
const JPL={
 Mercury:[[0.38709927,0.00000037],[0.20563593,0.00001906],[7.00497902,-0.00594749],[252.25032350,149472.67411175],[77.45779628,0.16047689],[48.33076593,-0.12534081]],
 Venus:[[0.72333566,0.00000390],[0.00677672,-0.00004107],[3.39467605,-0.00078890],[181.97909950,58517.81538729],[131.60246718,0.00268329],[76.67984255,-0.27769418]],
 Earth:[[1.00000261,0.00000562],[0.01671123,-0.00004392],[-0.00001531,-0.01294668],[100.46457166,35999.37244981],[102.93768193,0.32327364],[0,0]],
 Mars:[[1.52371034,0.00001847],[0.09339410,0.00007882],[1.84969142,-0.00813131],[-4.55343205,19140.30268499],[-23.94362959,0.44441088],[49.55953891,-0.29257343]],
 Jupiter:[[5.20288700,-0.00011607],[0.04838624,-0.00013253],[1.30439695,-0.00183714],[34.39644051,3034.74612775],[14.72847983,0.21252668],[100.47390909,0.20469106]],
 Saturn:[[9.53667594,-0.00125060],[0.05386179,-0.00050991],[2.48599187,0.00193609],[49.95424423,1222.49362201],[92.59887831,-0.41897216],[113.66242448,-0.28867794]],
 Uranus:[[19.18916464,-0.00196176],[0.04725744,-0.00004397],[0.77263783,-0.00242939],[313.23810451,428.48202785],[170.95427630,0.40805281],[74.01692503,0.04240589]],
 Neptune:[[30.06992276,0.00026291],[0.00859048,0.00005105],[1.77004347,0.00035372],[-55.12002969,218.45945325],[44.96476227,-0.32241464],[131.78422574,-0.00508664]]
};
const deg=Math.PI/180;
function jdFromDate(d){return d.getTime()/86400000+2440587.5;}
function helioPlanet(name,d){
 const T=(jdFromDate(d)-2451545.0)/36525, q=JPL[name];
 const a=q[0][0]+q[0][1]*T,e=q[1][0]+q[1][1]*T,I=(q[2][0]+q[2][1]*T)*deg;
 const L=q[3][0]+q[3][1]*T,p=q[4][0]+q[4][1]*T,O=(q[5][0]+q[5][1]*T)*deg;
 let M=((L-p+180)%360+360)%360-180; M*=deg;
 let E=M;
 for(let k=0;k<8;k++) E-=(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));
 const xp=a*(Math.cos(E)-e), yp=a*Math.sqrt(1-e*e)*Math.sin(E), w=(p-(q[5][0]+q[5][1]*T))*deg;
 const cw=Math.cos(w),sw=Math.sin(w),cO=Math.cos(O),sO=Math.sin(O),cI=Math.cos(I),sI=Math.sin(I);
 return V((cw*cO-sw*sO*cI)*xp+(-sw*cO-cw*sO*cI)*yp,
          (cw*sO+sw*cO*cI)*xp+(-sw*sO+cw*cO*cI)*yp,
          (sw*sI)*xp+(cw*sI)*yp);
}

// Halley's Comet: compact two-body propagation from its 1986 perihelion.
// This is deliberately approximate, but it preserves the comet's very eccentric,
// retrograde 75-year orbit and is more than sufficient for this scale model.
const HALLEY={a:17.83414429,e:.967142908,i:162.262690*deg,O:58.420080*deg,w:111.332490*deg,periJD:2446470.5};
HALLEY.periodDays=365.2568983*Math.pow(HALLEY.a,1.5);
function halleyXYZfromE(E){
 const h=HALLEY,xp=h.a*(Math.cos(E)-h.e),yp=h.a*Math.sqrt(1-h.e*h.e)*Math.sin(E);
 const cw=Math.cos(h.w),sw=Math.sin(h.w),cO=Math.cos(h.O),sO=Math.sin(h.O),cI=Math.cos(h.i),sI=Math.sin(h.i);
 return V((cw*cO-sw*sO*cI)*xp+(-sw*cO-cw*sO*cI)*yp,
          (cw*sO+sw*cO*cI)*xp+(-sw*sO+cw*cO*cI)*yp,
          (sw*sI)*xp+(cw*sI)*yp);
}
function helioHalley(d){
 let M=2*Math.PI*((jdFromDate(d)-HALLEY.periJD)/HALLEY.periodDays);
 M=((M+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;
 let E=M;
 for(let k=0;k<14;k++) E-=(E-HALLEY.e*Math.sin(E)-M)/(1-HALLEY.e*Math.cos(E));
 return halleyXYZfromE(E);
}
// Compact lunar orbit model: current geocentric position with the main orbital perturbations.
function updateMoonPosition(d){
 const D=jdFromDate(d)-2451543.5, norm=a=>((a%360)+360)%360;
 const N=norm(125.1228-.0529538083*D)*deg,i=5.1454*deg,w=norm(318.0634+.1643573223*D)*deg;
 const a=60.2666,e=.054900,M=norm(115.3654+13.0649929509*D)*deg;
 let E=M+e*Math.sin(M)*(1+e*Math.cos(M));for(let k=0;k<5;k++)E-=(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));
 let xv=a*(Math.cos(E)-e),yv=a*Math.sqrt(1-e*e)*Math.sin(E),v=Math.atan2(yv,xv),r=Math.hypot(xv,yv);
 let xh=r*(Math.cos(N)*Math.cos(v+w)-Math.sin(N)*Math.sin(v+w)*Math.cos(i));
 let yh=r*(Math.sin(N)*Math.cos(v+w)+Math.cos(N)*Math.sin(v+w)*Math.cos(i));
 let zh=r*Math.sin(v+w)*Math.sin(i);
 let lon=Math.atan2(yh,xh)/deg,lat=Math.atan2(zh,Math.hypot(xh,yh))/deg;
 const Ms=norm(356.0470+.9856002585*D),ws=norm(282.9404+4.70935e-5*D),Ls=norm(Ms+ws),Lm=norm(N/deg+w/deg+M/deg),Dm=norm(Lm-Ls),F=norm(Lm-N/deg);
 lon+=-1.274*Math.sin((M/deg-2*Dm)*deg)+.658*Math.sin(2*Dm*deg)-.186*Math.sin(Ms*deg)-.059*Math.sin((2*M/deg-2*Dm)*deg)-.057*Math.sin((M/deg-2*Dm+Ms)*deg)+.053*Math.sin((M/deg+2*Dm)*deg)+.046*Math.sin((2*Dm-Ms)*deg)+.041*Math.sin((M/deg-Ms)*deg)-.035*Math.sin(Dm*deg)-.031*Math.sin((M/deg+Ms)*deg)-.015*Math.sin((2*F-2*Dm)*deg)+.011*Math.sin((M/deg-4*Dm)*deg);
 lat+=-.173*Math.sin((F-2*Dm)*deg)-.055*Math.sin((M/deg-F-2*Dm)*deg)-.046*Math.sin((M/deg+F-2*Dm)*deg)+.033*Math.sin((F+2*Dm)*deg)+.017*Math.sin((2*M/deg+F)*deg);
 r+=-.58*Math.cos((M/deg-2*Dm)*deg)-.46*Math.cos(2*Dm*deg);
 const rr=r*6378.14/AU_KM,L=lon*deg,B=lat*deg;pos.Moon.set(rr*Math.cos(B)*Math.cos(L),rr*Math.cos(B)*Math.sin(L),rr*Math.sin(B));
}

let lastEphemMinute=-1;
function updatePlanetPositions(force=false){
 const d=new Date(), minute=Math.floor(d.getTime()/60000); if(!force&&minute===lastEphemMinute)return; lastEphemMinute=minute;
 const earthH=helioPlanet('Earth',d); pos.Earth.set(0,0,0); pos.Sun.copy(earthH).multiplyScalar(-1);
 for(const n of ['Mercury','Venus','Mars','Jupiter','Saturn','Uranus','Neptune']) pos[n].copy(helioPlanet(n,d)).sub(earthH);
 pos.Halley.copy(helioHalley(d)).sub(earthH);
 updateMoonPosition(d);
 // Keep Pluto as the existing representative point for now; the eight major planets above are live.
}
updatePlanetPositions(true);

const data={
 Earth:{p:pos.Earth,r:radiusAU(12742),c:0x3178c6,t:'Diameter 7,918 miles'},
 ISS:{p:pos.ISS,r:(0.109/2)/AU_KM,c:0xf2f2f2,t:'International Space Station · span ~358 ft · orbit currently roughly 255–267 miles high · speed ~17,500 mph · period ~90–93 minutes'},

 'Gaia BH1':{p:pos.GaiaBH1,r:(2.95325*9.27)/AU_KM,c:0xbfd7ff,t:'Gaia BH1 · nearest known black hole · dormant stellar-mass black hole · mass ~9.3 Suns · event-horizon diameter ~34 miles · about 1,560 light-years away'},
 'Gaia BH1 Companion':{p:pos.GaiaBH1Companion,r:radiusAU(1290000),c:0xffefc4,t:'Sun-like G-type companion star · about 0.93 solar masses · physical diameter ~802,000 miles · bound to Gaia BH1'},

};

const meshes={},rings={};
const stellarBodies=new Set(['Sun','Alpha Centauri','R Doradus','Stephenson 2-18','Polaris','R136a1','Gaia BH1 Companion']);
function addBody(n,d){
 const seg=n==='Earth'?64:(n==='Moon'?48:(stellarBodies.has(n)?40:20));
 const rows=n==='Earth'?40:(n==='Moon'?32:(stellarBodies.has(n)?28:20));
 const isStar=stellarBodies.has(n);
 const mat=isStar
   ? new THREE.MeshPhongMaterial({color:d.c,emissive:d.c,emissiveIntensity:1.15,shininess:0})
   : new THREE.MeshPhongMaterial({color:d.c,emissive:0x000000,emissiveIntensity:0});
 const m=new THREE.Mesh(new THREE.SphereGeometry(1,seg,rows),mat);
 m.userData.name=n; world.add(m); meshes[n]=m;
 if(isStar){
   // Visual glow only. The solid sphere itself remains at the physical radius.
   const glow1=new THREE.Mesh(new THREE.SphereGeometry(1.10,24,16),new THREE.MeshBasicMaterial({color:d.c,transparent:true,opacity:.16,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.BackSide}));
   const glow2=new THREE.Mesh(new THREE.SphereGeometry(1.24,24,16),new THREE.MeshBasicMaterial({color:d.c,transparent:true,opacity:.055,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.BackSide}));
   m.add(glow1);m.add(glow2);
 }
 const ring=new THREE.Mesh(new THREE.RingGeometry(.75,1,32),new THREE.MeshBasicMaterial({color:d.c,transparent:true,opacity:.72,side:THREE.DoubleSide,depthWrite:false}));

async function loadCatalogManifest(){
 try{
  const r=await fetch('catalog/manifest.json',{cache:'no-store'});
  if(!r.ok)throw new Error('no manifest');
  const manifest=await r.json();
  if(!manifest||!Array.isArray(manifest.tiles))throw new Error('bad manifest');
  catalogExternalTiles=manifest.tiles.map(t=>({...t,loaded:false,loading:false}));
  catalogStatus='manifest';
 }catch(_){
  catalogStatus='starter';
 }
}

async function maybeLoadCatalogTiles(logScale){
 if(!catalogEnabled||!catalogExternalTiles.length)return;
 for(const t of catalogExternalTiles){
  if(t.loaded||t.loading)continue;
  const mn=t.minLog??-99,mx=t.maxLog??99;
  if(logScale<mn||logScale>mx)continue;
  t.loading=true;
  try{
   const r=await fetch(t.url,{cache:'force-cache'});
   if(!r.ok)throw new Error('tile');
   const arr=await r.json();
   if(Array.isArray(arr))arr.forEach(addCatalogTileObject);
   t.loaded=true;catalogLoadedExternal++;
  }catch(_){}
  t.loading=false;
 }
}

function updateCatalog(){

 let shown=0;
 for(const m of catalogObjects){
  const o=m.userData.catalog;
  const p=m.userData.physical;
  display(p,tmp);
  m.position.copy(tmp);

  const minLog=o.minLog??-99,maxLog=o.maxLog??99;
  const visible=lg>=minLog&&lg<=maxLog&&tmp.length()<110;
  m.visible=visible;
  if(!visible)continue;
  shown++;

  // Catalogue entries stay as unresolved locator points at this layer.
  // Their physical sizes remain metadata instead of being inflated into giant spheres.
  m.scale.setScalar(1);
 }
 maybeLoadCatalogTiles(lg);
 catalogGroup.userData.shown=shown;
}

function pickCatalogAt(clientX,clientY){

 // Make sure world matrices reflect the latest camera/scene orientation.
 scene.updateMatrixWorld(true);
 camera.updateMatrixWorld(true);

 let best=null,bestPx=20;
 const rect=renderer.domElement.getBoundingClientRect();

 for(const m of catalogObjects){
  if(!m.visible)continue;
  m.getWorldPosition(catalogPickWorld);
  catalogPickNdc.copy(catalogPickWorld).project(camera);
  if(catalogPickNdc.z<-1||catalogPickNdc.z>1)continue;

  const sx=rect.left+(catalogPickNdc.x*.5+.5)*rect.width;
  const sy=rect.top+(-catalogPickNdc.y*.5+.5)*rect.height;
  const d=Math.hypot(clientX-sx,clientY-sy);

  if(d<bestPx){bestPx=d;best=m;}
 }
 if(!best)return false;

 info.textContent=describeCatalogObject(o);

 // Briefly enlarge the selected locator so the user can see what was tapped.
 const oldSize=best.material.size;

 setTimeout(()=>{if(best&&best.material)best.material.size=oldSize;},650);
 return true;
}

function startFlight(n){
 const ff=focusAU.clone(),tf=focusFor(n),fl=Math.log10(auPerUnit),tl=targetLog[n]??fl;
 const distanceAU=ff.distanceTo(tf);
 const distanceLog=distanceAU>0?Math.log10(distanceAU/3.2):Math.max(fl,tl);
 const cruiseLog=Math.max(fl,tl,Math.min(15.75,distanceLog));
 const scaleSpan=Math.max(Math.abs(cruiseLog-fl),Math.abs(cruiseLog-tl));
 const dur=Math.min(10500,Math.max(2200,2600+scaleSpan*520));
 flight={start:performance.now(),dur,ff,tf,fl,tl,cruiseLog,departEnd:.32,arriveStart:.68};
 showInfo(n);
}
function updateFlight(now){
 if(!flight)return;
 let t=(now-flight.start)/flight.dur;if(t>1)t=1;
 const smooth=x=>x*x*(3-2*x);
 let lg;
 if(t<flight.departEnd){
   const q=smooth(t/flight.departEnd);
   focusAU.copy(flight.ff);
   lg=THREE.MathUtils.lerp(flight.fl,flight.cruiseLog,q);
 }else if(t<flight.arriveStart){
   const q=smooth((t-flight.departEnd)/(flight.arriveStart-flight.departEnd));
   focusAU.copy(flight.ff).lerp(flight.tf,q);
   lg=flight.cruiseLog;
 }else{
   const q=smooth((t-flight.arriveStart)/(1-flight.arriveStart));
   focusAU.copy(flight.tf);
   lg=THREE.MathUtils.lerp(flight.cruiseLog,flight.tl,q);
 }
 auPerUnit=Math.pow(10,lg);zoom.value=lg;
 if(t===1){focusAU.copy(flight.tf);auPerUnit=Math.pow(10,flight.tl);zoom.value=flight.tl;flight=null;}
}

 if(shirleyGalaxy.visible){const a=shirleyGalaxy.geometry.attributes.position.array;for(let i=0;i<shirleyPhysical.length;i++){const p=shirleyPhysical[i];a[i*3]=(p.x-focusAU.x)/auPerUnit;a[i*3+1]=(p.y-focusAU.y)/auPerUnit;a[i*3+2]=(p.z-focusAU.z)/auPerUnit;}shirleyGalaxy.geometry.attributes.position.needsUpdate=true;}
 const jlg=Math.log10(auPerUnit);
 display(pos.ShirleyGalaxy,tmp);
 joeOrbitLine.position.copy(tmp);
 joeOrbitLine.scale.setScalar(1/auPerUnit);
 joeOrbitLine.visible=tmp.length()<75&&jlg>-3&&jlg<.6;

 // Shirley A* is centred exactly on Shirley's Galaxy.
 display(pos.ShirleyGalaxy,tmp);
 shirleyBHGroup.position.copy(tmp);
 const sbr=SHIRLEY_RS_AU/auPerUnit;
 shirleyBHHole.scale.setScalar(Math.max(sbr,1e-12));
 shirleyBHGlow.scale.setScalar(Math.max(sbr,1e-12));
 shirleyBHGroup.visible=tmp.length()<80&&Math.log10(auPerUnit)>-7.5&&Math.log10(auPerUnit)<9.8;

 if(meshes.JoePhoto){
   const a=joeAngle();
   const jp=joePhysicalPosition(a);
   display(jp,tmp);meshes.JoePhoto.position.copy(tmp);
   const js=(jlg>-3&&jlg<.6)?0.68:Math.max(.16,Math.min(1.05,(SHIRLEY_RADIUS_AU/auPerUnit)*.12));
   meshes.JoePhoto.scale.set(js*.78,js,1);
   meshes.JoePhoto.visible=tmp.length()<75&&((jlg>-3&&jlg<.6)||(jlg>7.65&&jlg<9.75));
   if(meshes.JoePhoto.visible)applyJoeRelativity(a,jp);
 }

 if(meshes.ShirleyPhoto){
   display(pos.ShirleyGalaxy,tmp);meshes.ShirleyPhoto.position.copy(tmp);
   if(jlg>-3&&jlg<.6){
     meshes.ShirleyPhoto.scale.set(.72,.72,1);
     meshes.ShirleyPhoto.visible=tmp.length()<70;
   }else{
     // At galaxy scale the portrait still responds to zoom.
     const ss=Math.max(.035,Math.min(.82,sgr*.18));meshes.ShirleyPhoto.scale.set(ss,ss,1);
     meshes.ShirleyPhoto.visible=tmp.length()<70&&jlg>7.7&&jlg<11.5;
   }
 }

 const dr=MW_RADIUS_AU/auPerUnit;mw.visible=dr>.00012&&dr<100;
 if(mw.visible){const a=mw.geometry.attributes.position.array;for(let i=0;i<mwPhysical.length;i++){const p=mwPhysical[i];a[i*3]=(p.x-focusAU.x)/auPerUnit;a[i*3+1]=(p.y-focusAU.y)/auPerUnit;a[i*3+2]=(p.z-focusAU.z)/auPerUnit;}mw.geometry.attributes.position.needsUpdate=true;}

 const ar=AND_RADIUS_AU/auPerUnit;andromeda.visible=ar>.00012&&ar<90;
 if(andromeda.visible){const a=andromeda.geometry.attributes.position.array;for(let i=0;i<andPhysical.length;i++){const p=andPhysical[i];a[i*3]=(p.x-focusAU.x)/auPerUnit;a[i*3+1]=(p.y-focusAU.y)/auPerUnit;a[i*3+2]=(p.z-focusAU.z)/auPerUnit;}andromeda.geometry.attributes.position.needsUpdate=true;}

 const ir=IC_RADIUS_AU/auPerUnit;ic1101.visible=ir>.00012&&ir<90;
 if(ic1101.visible){const a=ic1101.geometry.attributes.position.array;for(let i=0;i<icPhysical.length;i++){const p=icPhysical[i];a[i*3]=(p.x-focusAU.x)/auPerUnit;a[i*3+1]=(p.y-focusAU.y)/auPerUnit;a[i*3+2]=(p.z-focusAU.z)/auPerUnit;}ic1101.geometry.attributes.position.needsUpdate=true;}

 // At intergalactic zooms, keep both home galaxies discoverable rather than letting them vanish into blackness.
 if(Math.log10(auPerUnit)>10.3){
   const sr=meshes.ShirleyPhoto; if(sr) sr.material.opacity=Math.max(.18,Math.min(.75,sgr*45));
 } else if(meshes.ShirleyPhoto){meshes.ShirleyPhoto.material.opacity=.96;}

 // Photographs and cultural sprites are visible-light artwork, not UV/X-ray emitters.
 if(bandMode!=='visible'){
   if(mwSkyGroup.visible){
    if(bandMode==='uv'){mwSkyMat.color.set(0x829fd0);mwSkyMat.opacity=.22*.38;mwRibbon.material.opacity=.08*.28;}
    else if(bandMode==='xray'){mwSkyMat.color.set(0x506070);mwSkyMat.opacity=.22*.05;mwRibbon.material.opacity=.08*.02;}
   }
   if(meshes.SimbaPhoto)meshes.SimbaPhoto.visible=false;
   if(meshes.MuziqPhoto)meshes.MuziqPhoto.visible=false;
   if(meshes.ShirleyPhoto)meshes.ShirleyPhoto.visible=false;
   if(meshes.JoePhoto)meshes.JoePhoto.visible=false;
 }


 // TON 618 close-up.
 display(pos.TON618,tmp);ton618Group.position.copy(tmp);
 const tonR=TON618_RS_AU/auPerUnit;
 ton618Hole.scale.setScalar(Math.max(tonR,1e-12));
 ton618Disk.scale.setScalar(Math.max(tonR,1e-12));
 ton618Glow.scale.setScalar(Math.max(tonR,1e-12));
 ton618Group.visible=tmp.length()<100&&Math.log10(auPerUnit)>3.0&&Math.log10(auPerUnit)<8.0;


 // Star clusters around Shirley's Galaxy and the representative TON 618 host environment.
 for(const cs of clusterGroups){
   display(cs.centre,tmp);
   cs.group.position.copy(tmp);
   cs.group.scale.setScalar(1/auPerUnit);
   const lg=Math.log10(auPerUnit);

   if(cs.name==="Shirley's Galaxy"){
     // Visible from local galactic detail through modest intergalactic views.
     cs.group.visible=tmp.length()<90&&lg>6.2&&lg<10.2;
   }else if(cs.name==="TON 618"){
     // Emerge when close enough to resolve a host environment, but vanish at event-horizon scales.
     cs.group.visible=tmp.length()<90&&lg>6.4&&lg<10.6;
   }
 }

 updateCatalog();

 // Representative cosmic web, centred on our observable-volume viewpoint. It emerges only at very large scales.
 webGroup.position.set(-focusAU.x/auPerUnit,-focusAU.y/auPerUnit,-focusAU.z/auPerUnit);webGroup.scale.setScalar(1/auPerUnit);
 const wlg=Math.log10(auPerUnit),wr=WEB_RADIUS_AU/auPerUnit;
 webGroup.visible=wlg>11.55&&wlg<14.72&&wr>.08&&wr<150;
 if(webGroup.visible){const fadeIn=Math.min(1,Math.max(0,(wlg-11.55)/.75)),fadeOut=Math.min(1,Math.max(0,(14.72-wlg)/.5));webLines.material.opacity=.105*fadeIn*fadeOut;webPoints.material.opacity=.34*fadeIn*fadeOut;}

 display(pos.Earth,tmp);
 const or=OBS_RADIUS_AU/auPerUnit;obs.position.copy(tmp);obs.scale.setScalar(or);obs.visible=or>.15&&or<80;
 // CMB is a shell centred on the observer. Its points are stored at physical AU scale.
 cmb.position.set(-focusAU.x/auPerUnit,-focusAU.y/auPerUnit,-focusAU.z/auPerUnit);cmb.scale.setScalar(1/auPerUnit);
 const cr=CMB_RADIUS_AU/auPerUnit;cmb.visible=cr>.12&&cr<90;
}
go.onclick=()=>startFlight(dest.value);dest.onchange=()=>showInfo(dest.value);
zoom.oninput=()=>{flight=null;auPerUnit=Math.pow(10,parseFloat(zoom.value));};

let dragging=false,lx=0,ly=0,downX=0,downY=0,pointerMoved=false,lastPinch=0,lastTouchCX=0,lastTouchCY=0,lastTouchAngle=0,multiTouch=false;
renderer.domElement.addEventListener('pointerdown',e=>{
 if(e.pointerType==='touch' && !e.isPrimary)return;
 dragging=true;lx=e.clientX;ly=e.clientY;downX=e.clientX;downY=e.clientY;pointerMoved=false;flight=null;
 try{renderer.domElement.setPointerCapture(e.pointerId);}catch(_){}
 e.preventDefault();
},{passive:false});
renderer.domElement.addEventListener('pointermove',e=>{
 if(!dragging||multiTouch)return;
 const dx=e.clientX-lx,dy=e.clientY-ly;
 if(Math.hypot(e.clientX-downX,e.clientY-downY)>9)pointerMoved=true;
 if(dx||dy){
   flight=null;
   // Orbit around the current focus, so the examined object stays centred.
   rotY+=dx*.006; rotX+=dy*.006;
   rotX=Math.max(-Math.PI*.49,Math.min(Math.PI*.49,rotX));
   lx=e.clientX;ly=e.clientY;
 }
 e.preventDefault();
},{passive:false});
renderer.domElement.addEventListener('pointerup',e=>{
 const wasTap=!pointerMoved&&!multiTouch;
 dragging=false;
 try{renderer.domElement.releasePointerCapture(e.pointerId);}catch(_){}
 if(wasTap)pickCatalogAt(e.clientX,e.clientY);
 pointerMoved=false;
});
renderer.domElement.addEventListener('pointercancel',()=>{dragging=false;multiTouch=false;});
renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();flight=null;let lg=Math.log10(auPerUnit)+Math.sign(e.deltaY)*.12;lg=Math.max(-8,Math.min(16,lg));auPerUnit=Math.pow(10,lg);zoom.value=lg;},{passive:false});

// Controls: one finger orbits around the current GO TO focus; pinch zooms;
// moving two fingers together pans the focus through space. A twist still rolls the view.
function panFocusByPixels(dx,dy){
 const viewH=2*camera.position.z*Math.tan(THREE.MathUtils.degToRad(camera.fov*.5));
 const physPerPixel=auPerUnit*viewH/Math.max(innerHeight,1);
 const delta=new THREE.Vector3(-dx*physPerPixel,dy*physPerPixel,0);
 const q=new THREE.Quaternion().setFromEuler(new THREE.Euler(rotX,rotY,rotZ,'XYZ')).invert();
 delta.applyQuaternion(q);
 focusAU.add(delta);
}
renderer.domElement.addEventListener('touchstart',e=>{
 if(e.touches.length===2){
   multiTouch=true; flight=null;
   const x0=e.touches[0].clientX,y0=e.touches[0].clientY,x1=e.touches[1].clientX,y1=e.touches[1].clientY;
   lastPinch=Math.hypot(x0-x1,y0-y1); lastTouchCX=(x0+x1)/2; lastTouchCY=(y0+y1)/2; lastTouchAngle=Math.atan2(y1-y0,x1-x0);
 }
},{passive:true});
renderer.domElement.addEventListener('touchmove',e=>{
 if(e.touches.length===2){
   multiTouch=true; flight=null;
   const x0=e.touches[0].clientX,y0=e.touches[0].clientY,x1=e.touches[1].clientX,y1=e.touches[1].clientY;
   const d=Math.hypot(x0-x1,y0-y1),cx=(x0+x1)/2,cy=(y0+y1)/2,ang=Math.atan2(y1-y0,x1-x0);
   if(lastPinch){
     let lg=Math.log10(auPerUnit)-Math.log10(d/lastPinch)*1.7;
     lg=Math.max(-8,Math.min(16,lg)); auPerUnit=Math.pow(10,lg); zoom.value=lg;
     const dx=cx-lastTouchCX,dy=cy-lastTouchCY;
     // Two-finger translation is the deliberate pan gesture.
     if(Math.hypot(dx,dy)>.6) panFocusByPixels(dx,dy);
     let da=ang-lastTouchAngle; if(da>Math.PI)da-=Math.PI*2; if(da<-Math.PI)da+=Math.PI*2;
     if(Math.abs(da)>.003) rotZ+=da;
   }
   lastPinch=d; lastTouchCX=cx; lastTouchCY=cy; lastTouchAngle=ang; e.preventDefault();
 }
},{passive:false});
renderer.domElement.addEventListener('touchend',e=>{
 if(e.touches.length<2){lastPinch=0;lastTouchAngle=0;multiTouch=false;}
 if(e.touches.length===0)dragging=false;
});

function scaleName(){const lg=Math.log10(auPerUnit);if(lg<-5)return'Event-horizon scale';if(lg<-3)return'Earth–Moon scale';if(lg<0)return'Solar-system scale';if(lg<5)return'Interstellar scale';if(lg<10)return'Galactic scale';return'Cosmic scale';}
function updateEarthOrientation(d){
 const jd=jdFromDate(d),T=(jd-2451545.0)/36525;
 const gst=((280.46061837+360.98564736629*(jd-2451545.0)+.000387933*T*T-T*T*T/38710000)%360+360)%360;
 meshes.Earth.rotation.order='ZYX';meshes.Earth.rotation.z=-23.4392911*deg;meshes.Earth.rotation.y=-gst*deg;
}
function animate(now){
 requestAnimationFrame(animate);
 // Slow display orbit around Earth: one revolution every 90 seconds.
 const ma=(now/90000)*Math.PI*2;pos.Muziq.set(Math.cos(ma)*.012,Math.sin(ma)*.012,Math.sin(ma*.37)*.0018);
 updatePlanetPositions();
 updateFlight(now);world.rotation.set(rotX,rotY,rotZ,'XYZ');updateWorld();
 stats.textContent='View width ≈ '+fmt(auPerUnit*9.1)+' · 1 scene unit = '+fmt(auPerUnit);
 const bandLabel=bandMode==='visible'?'':(bandMode==='uv'?' · UV VIEW':' · X-RAY VIEW');
 const catLabel=catalogEnabled?(' · CATALOG '+(catalogGroup.userData.shown||0)+(catalogStatus==='manifest'?' +':' ')):'';
 badge.textContent=scaleName()+bandLabel+catLabel;
 updateEarthOrientation(new Date());
 // Rhyl marker follows the real rotating Earth and dims on the night side.
 const rhylNormal=rhylMarker.position.clone().normalize().applyQuaternion(meshes.Earth.quaternion);
 const sunDir=pos.Sun.clone().sub(pos.Earth).normalize();
 const rhylDay=rhylNormal.dot(sunDir);rhylMarker.visible=(data.Earth.r/auPerUnit)>.018;
 rhylMarker.material.color.setHex(rhylDay>0?0xffef70:0x5a5124);
 rhylMap.visible=(data.Earth.r/auPerUnit)>.11;
 meshes.Moon.rotation.y=now*.000015;meshes.Sun.rotation.y=now*.000008;
 renderer.render(scene,camera);
}
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
loadCatalogManifest();
setBandMode('visible');showInfo('Earth');animate(performance.now());
})();
