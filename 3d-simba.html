<!doctype html>
<html lang="en">

<title>3D Simba - Physical Scale Universe</title>
<style>

canvas{display:block;-webkit-user-select:none;user-select:none}
#top{position:fixed;left:10px;right:10px;top:10px;z-index:10;background:rgba(0,0,0,.58);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:9px 11px}
#title{font-weight:700;font-size:15px}

button{font-weight:700}

#info{position:fixed;left:10px;bottom:126px;z-index:10;max-width:min(390px,calc(100vw - 20px));background:rgba(0,0,0,.64);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:8px 10px;font-size:11px;line-height:1.35}

</style>
</head>

<div id="top">
  <div id="title">3D SIMBA · PHYSICAL SCALE</div>
  <div id="sub">Sizes and distances use the same scale. Locator rings are signposts only.</div>
  <div id="stats"></div>
</div>
<div id="badge"></div>
<div id="info"></div>

const deg=Math.PI/180;
function jdFromDate(d){return d.getTime()/86400000+2440587.5;}
function helioPlanet(name,d){
 const T=(jdFromDate(d)-2451545.0)/36525, q=JPL[name];
 const a=q[0][0]+q[0][1]*T,e=q[1][0]+q[1][1]*T,I=(q[2][0]+q[2][1]*T)*deg;
 const L=q[3][0]+q[3][1]*T,p=q[4][0]+q[4][1]*T,O=(q[5][0]+q[5][1]*T)*deg;
 let M=((L-p+180)%360+360)%360-180; M*=deg;

 return V((cw*cO-sw*sO*cI)*xp+(-sw*cO-cw*sO*cI)*yp,

          (sw*sI)*xp+(cw*sI)*yp);
}
// Compact lunar orbit model: current geocentric position with the main orbital perturbations.
function updateMoonPosition(d){
 const D=jdFromDate(d)-2451543.5, norm=a=>((a%360)+360)%360;
 const N=norm(125.1228-.0529538083*D)*deg,i=5.1454*deg,w=norm(318.0634+.1643573223*D)*deg;
 const a=60.2666,e=.054900,M=norm(115.3654+13.0649929509*D)*deg;
 let E=M+e*Math.sin(M)*(1+e*Math.cos(M));for(let k=0;k<5;k++)E-=(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));
 let xv=a*(Math.cos(E)-e),yv=a*Math.sqrt(1-e*e)*Math.sin(E),v=Math.atan2(yv,xv),r=Math.hypot(xv,yv);
 let xh=r*(Math.cos(N)*Math.cos(v+w)-Math.sin(N)*Math.sin(v+w)*Math.cos(i));

 let zh=r*Math.sin(v+w)*Math.sin(i);

 const Ms=norm(356.0470+.9856002585*D),ws=norm(282.9404+4.70935e-5*D),Ls=norm(Ms+ws),Lm=norm(N/deg+w/deg+M/deg),Dm=norm(Lm-Ls),F=norm(Lm-N/deg);
 lon+=-1.274*Math.sin((M/deg-2*Dm)*deg)+.658*Math.sin(2*Dm*deg)-.186*Math.sin(Ms*deg)-.059*Math.sin((2*M/deg-2*Dm)*deg)-.057*Math.sin((M/deg-2*Dm+Ms)*deg)+.053*Math.sin((M/deg+2*Dm)*deg)+.046*Math.sin((2*Dm-Ms)*deg)+.041*Math.sin((M/deg-Ms)*deg)-.035*Math.sin(Dm*deg)-.031*Math.sin((M/deg+Ms)*deg)-.015*Math.sin((2*F-2*Dm)*deg)+.011*Math.sin((M/deg-4*Dm)*deg);
 lat+=-.173*Math.sin((F-2*Dm)*deg)-.055*Math.sin((M/deg-F-2*Dm)*deg)-.046*Math.sin((M/deg+F-2*Dm)*deg)+.033*Math.sin((F+2*Dm)*deg)+.017*Math.sin((2*M/deg+F)*deg);

 const rr=r*6378.14/AU_KM,L=lon*deg,B=lat*deg;pos.Moon.set(rr*Math.cos(B)*Math.cos(L),rr*Math.cos(B)*Math.sin(L),rr*Math.sin(B));
}

let lastEphemMinute=-1;
function updatePlanetPositions(force=false){
 const d=new Date(), minute=Math.floor(d.getTime()/60000); if(!force&&minute===lastEphemMinute)return; lastEphemMinute=minute;
 const earthH=helioPlanet('Earth',d); pos.Earth.set(0,0,0); pos.Sun.copy(earthH).multiplyScalar(-1);
 for(const n of ['Mercury','Venus','Mars','Jupiter','Saturn']) pos[n].copy(helioPlanet(n,d)).sub(earthH);
 updateMoonPosition(d);
 // Keep Pluto as the existing representative point for now; the six major planets above are live.
}
updatePlanetPositions(true);

const meshes={},rings={};

 m.userData.name=n; world.add(m); meshes[n]=m;

}

 const g=x.createLinearGradient(0,0,0,c.height);g.addColorStop(0,'#174b79');g.addColorStop(.5,'#1d6599');g.addColorStop(1,'#123f6c');x.fillStyle=g;x.fillRect(0,0,c.width,c.height);
 // Hand-drawn coastlines: still lightweight, but less like Earth was assembled from seven cardboard cut-outs.
 const polys=[
 [[.035,.19],[.075,.12],[.13,.09],[.18,.12],[.215,.18],[.235,.25],[.205,.29],[.19,.35],[.155,.37],[.135,.43],[.105,.40],[.075,.34],[.045,.30]],

 [[.45,.25],[.50,.22],[.56,.24],[.59,.31],[.575,.40],[.54,.47],[.51,.58],[.475,.65],[.445,.58],[.43,.47]],
 [[.49,.15],[.57,.12],[.66,.14],[.73,.18],[.79,.24],[.84,.31],[.81,.37],[.75,.39],[.70,.35],[.65,.38],[.60,.34],[.56,.27]],
 [[.76,.59],[.81,.57],[.86,.61],[.875,.68],[.84,.74],[.785,.73],[.75,.68]],
 [[.335,.10],[.365,.075],[.39,.10],[.375,.15],[.345,.16]],
 [[.455,.205],[.462,.19],[.469,.205],[.465,.23]],[[.472,.205],[.477,.19],[.482,.215]],
 [[.625,.43],[.64,.42],[.65,.46],[.64,.50]],[[.86,.43],[.875,.44],[.87,.49],[.855,.48]]];
 x.fillStyle='#66884c';x.strokeStyle='#9cb778';x.lineWidth=2;
 for(const poly of polys){x.beginPath();poly.forEach((p,i)=>i?x.lineTo(p[0]*c.width,p[1]*c.height):x.moveTo(p[0]*c.width,p[1]*c.height));x.closePath();x.fill();x.stroke();}
 // Polar ice and a restrained suggestion of terrain/cloud bands.
 x.fillStyle='rgba(235,245,250,.72)';x.fillRect(0,0,c.width,22);x.fillRect(0,c.height-16,c.width,16);
 x.strokeStyle='rgba(255,255,255,.16)';x.lineWidth=5;for(let i=0;i<13;i++){const y=(.15+i*.055)*c.height;x.beginPath();x.moveTo(0,y);for(let q=0;q<=24;q++){const xx=q*c.width/24;x.lineTo(xx,y+Math.sin(q*.9+i)*7);}x.stroke();}

}
function makeMoonTexture(){
 const c=document.createElement('canvas');c.width=768;c.height=384;const x=c.getContext('2d');x.fillStyle='#aaa9a3';x.fillRect(0,0,c.width,c.height);
 let seed=1971;const rnd=()=>((seed=(seed*1664525+1013904223)>>>0)/4294967296);
 for(let i=0;i<240;i++){const cx=rnd()*c.width,cy=rnd()*c.height,r=2+rnd()*18;x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.fillStyle=`rgba(55,55,52,${.025+rnd()*.13})`;x.fill();x.beginPath();x.arc(cx-r*.18,cy-r*.18,r*.72,0,Math.PI*2);x.strokeStyle=`rgba(230,230,220,${.025+rnd()*.10})`;x.lineWidth=Math.max(1,r*.08);x.stroke();}
 for(const m of [[.28,.43,.09],[.39,.33,.07],[.56,.39,.10],[.66,.53,.075],[.48,.59,.06]]){x.beginPath();x.arc(m[0]*c.width,m[1]*c.height,m[2]*c.height,0,Math.PI*2);x.fillStyle='rgba(75,76,73,.18)';x.fill();}

function orbit(rad,col,op){
 const pts=[]; for(let i=0;i<=180;i++){const a=i/180*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a)*rad,Math.sin(a)*rad,0));}
 const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:col,transparent:true,opacity:op,depthWrite:false})); world.add(l); return l;
}

const MW_RADIUS_AU=60000*LY_AU, MW_HALF_AU=550*LY_AU, mwPhysical=[];
// Milky Way: a deliberately flattened barred spiral. The old cloud was physically thin

const mwG=new THREE.BufferGeometry(); mwG.setAttribute('position',new THREE.Float32BufferAttribute(new Float32Array(3000*3),3));

   const a=.38,xx=x*Math.cos(a)-y*Math.sin(a),yy=x*Math.sin(a)+y*Math.cos(a);x=xx;y=yy;
 }else{
   const arm=i%4, a=arm*Math.PI/2+q*7.6+(Math.random()-.5)*.32;
   x=r*Math.cos(a); y=r*Math.sin(a);
 }

}

// Shirley, sovereign of a fictional galaxy and, like every observer, centre of her observable universe.
new THREE.TextureLoader().load('shirley.jpg',tex=>{
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,opacity:.96,depthWrite:false}));
 s.scale.set(.82,.82,1);world.add(s);meshes.ShirleyPhoto=s;
});

let auPerUnit=Math.pow(10,-3.25), focusAU=pos.Earth.clone(), rotX=.12,rotY=-.35,rotZ=0,flight=null;
const dest=document.getElementById('dest'),go=document.getElementById('go'),zoom=document.getElementById('zoom'),stats=document.getElementById('stats'),info=document.getElementById('info'),badge=document.getElementById('badge');

const targetLog={Earth:-4,Moon:-4,Venus:-2.35,Sun:-2.15,Mercury:-2.5,Mars:-2.1,Jupiter:-1.4,Saturn:-1.35,Pluto:-1.2,'Alpha Centauri':4.65,Polaris:-0.29,'Galactic Centre':8.45,'Milky Way':8.75,Andromeda:11.0,Simba:-4.1,'µ-Ziq':-3.35,"Shirley's Galaxy":9.0,'Observable Universe':14.65};

function fmt(au){
 au=Math.abs(au);
 if(au<.01)return Math.round(au*AU_KM).toLocaleString()+' km';
 if(au<1000)return au.toLocaleString(undefined,{maximumFractionDigits:3})+' AU';
 const ly=au/LY_AU;
 if(ly<1000)return ly.toLocaleString(undefined,{maximumFractionDigits:3})+' ly';
 if(ly<1e6)return (ly/1000).toFixed(2)+' kly';
 if(ly<1e9)return (ly/1e6).toFixed(2)+' Mly';
 return (ly/1e9).toFixed(2)+' Gly';
}
function focusFor(n){if(n==='Observable Universe'||n==='Milky Way')return pos.Earth.clone();if(n==='Alpha Centauri')return pos.Alpha.clone();if(n==='Polaris')return pos.Polaris.clone();if(n==='Galactic Centre')return pos.GC.clone();if(n==='Andromeda')return pos.Andromeda.clone();if(n==="Shirley's Galaxy")return pos.ShirleyGalaxy.clone();if(n==='µ-Ziq')return pos.Muziq.clone();return data[n]?data[n].p.clone():pos.Earth.clone();}
function showInfo(n){
 let s='';
 if(n==='Observable Universe')s='Observable universe · present comoving radius about 46.5 billion light-years.';
 else if(n==='Milky Way')s='Milky Way · barred spiral model, about 120,000 light-years across.';
 else if(n==='Andromeda')s='Andromeda (M31) · nearest major galaxy · about 2.54 million light-years from Earth · modelled as an inclined spiral.';
 else if(n==='µ-Ziq')s='µ-Ziq · Chewed Corners (2013) · cultural satellite in a deliberately fictional Earth orbit.';
 else if(n==="Shirley's Galaxy")s="SHIRLEY'S GALAXY · fictional spiral galaxy about 15 million light-years from Earth · Shirley is at the centre of her observable universe.";
 else if(data[n])s=n+' · '+data[n].t+(n!=='Earth'?' · Earth distance '+fmt(data[n].p.distanceTo(pos.Earth)):'');
 info.textContent=s;
}
// GO TO is a journey rather than a teleport:
// 1) pull away from the current object,
// 2) cross the distance at a scale large enough to show the separation,
// 3) dive into the destination.
function startFlight(n){
 const ff=focusAU.clone(), tf=focusFor(n);
 const fl=Math.log10(auPerUnit), tl=targetLog[n]??fl;
 const distanceAU=ff.distanceTo(tf);

 // Pick a cruise scale from the actual distance.  The destination remains
 // physically placed; this only decides how far the camera must pull back
 // before crossing the gap.
 const distanceLog=distanceAU>0 ? Math.log10(distanceAU/3.2) : Math.max(fl,tl);
 const cruiseLog=Math.max(fl,tl,Math.min(15.75,distanceLog));

 // Long trips get time to breathe, but stay tolerable on a phone.
 const scaleSpan=Math.max(Math.abs(cruiseLog-fl),Math.abs(cruiseLog-tl));
 const dur=Math.min(10500,Math.max(2200,2600+scaleSpan*520));

 flight={
   start:performance.now(),dur,ff,tf,fl,tl,cruiseLog,
   departEnd:.32,arriveStart:.68
 };
 showInfo(n);
}
function updateFlight(now){
 if(!flight)return;
 let t=(now-flight.start)/flight.dur;
 if(t>1)t=1;

 // smoothstep, used separately for each leg so nothing snaps.
 const smooth=x=>x*x*(3-2*x);
 let lg;

 if(t<flight.departEnd){
   // Departure: hold the current location while the starting world shrinks.
   const q=smooth(t/flight.departEnd);
   focusAU.copy(flight.ff);
   lg=THREE.MathUtils.lerp(flight.fl,flight.cruiseLog,q);
 }else if(t<flight.arriveStart){
   // Cruise: with both ends reduced to cosmic signposts, move through real space.
   const q=smooth((t-flight.departEnd)/(flight.arriveStart-flight.departEnd));
   focusAU.copy(flight.ff).lerp(flight.tf,q);
   lg=flight.cruiseLog;
 }else{
   // Arrival: hold the destination and dive back down through the scales.
   const q=smooth((t-flight.arriveStart)/(1-flight.arriveStart));
   focusAU.copy(flight.tf);
   lg=THREE.MathUtils.lerp(flight.cruiseLog,flight.tl,q);
 }

 auPerUnit=Math.pow(10,lg);
 zoom.value=lg;
 if(t===1){
   focusAU.copy(flight.tf);
   auPerUnit=Math.pow(10,flight.tl);
   zoom.value=flight.tl;
   flight=null;
 }
}
const tmp=new THREE.Vector3();
const display=(p,out)=>out.copy(p).sub(focusAU).multiplyScalar(1/auPerUnit);

function updateWorld(){
 for(const [n,d] of Object.entries(data)){
   const m=meshes[n],rr=d.r/auPerUnit; display(d.p,tmp);m.position.copy(tmp);m.scale.setScalar(Math.max(rr,1e-10));
   const ring=rings[n];ring.position.copy(tmp);ring.quaternion.copy(camera.quaternion);ring.scale.setScalar(.085);ring.visible=rr<.018&&tmp.length()<70&&auPerUnit<1000;
 }
 display(pos.Earth,tmp);atmosphere.position.copy(tmp);const er=data.Earth.r/auPerUnit;atmosphere.scale.setScalar(er*1.025);atmosphere.visible=er>.004;
 moonOrbit.scale.setScalar(1/auPerUnit);moonOrbit.position.copy(display(pos.Earth,new THREE.Vector3()));moonOrbit.visible=(.00257/auPerUnit)<30&&(.00257/auPerUnit)>.02;
 earthOrbit.scale.setScalar(1/auPerUnit);earthOrbit.position.copy(display(pos.Sun,new THREE.Vector3()));earthOrbit.visible=(1/auPerUnit)<30&&(1/auPerUnit)>.02;
 jupiterOrbit.scale.setScalar(1/auPerUnit);jupiterOrbit.position.copy(display(pos.Sun,new THREE.Vector3()));jupiterOrbit.visible=(5.204/auPerUnit)<30&&(5.204/auPerUnit)>.02;
 saturnOrbit.scale.setScalar(1/auPerUnit);saturnOrbit.position.copy(display(pos.Sun,new THREE.Vector3()));saturnOrbit.visible=(9.58/auPerUnit)<30&&(9.58/auPerUnit)>.02;
 display(pos.Saturn,tmp);saturnRings.position.copy(tmp);saturnRings.scale.setScalar(data.Saturn.r/auPerUnit);saturnRings.visible=(data.Saturn.r/auPerUnit)>.0007&&tmp.length()<70;
 muziqOrbit.scale.setScalar(1/auPerUnit);muziqOrbit.position.copy(display(pos.Earth,new THREE.Vector3()));muziqOrbit.visible=(.012/auPerUnit)<30&&(.012/auPerUnit)>.02;
 pointLight.position.copy(display(pos.Sun,new THREE.Vector3()));

 if(meshes.SimbaPhoto){display(pos.Simba,tmp);meshes.SimbaPhoto.position.copy(tmp);meshes.SimbaPhoto.visible=tmp.length()<12&&Math.log10(auPerUnit)<-2.5;}
 if(meshes.MuziqPhoto){display(pos.Muziq,tmp);meshes.MuziqPhoto.position.copy(tmp);meshes.MuziqPhoto.visible=tmp.length()<14&&Math.log10(auPerUnit)<-2.0;}

 const sgr=SHIRLEY_RADIUS_AU/auPerUnit;shirleyGalaxy.visible=sgr>.0015&&sgr<45;
 if(shirleyGalaxy.visible){const a=shirleyGalaxy.geometry.attributes.position.array;for(let i=0;i<shirleyPhysical.length;i++){const p=shirleyPhysical[i];a[i*3]=(p.x-focusAU.x)/auPerUnit;a[i*3+1]=(p.y-focusAU.y)/auPerUnit;a[i*3+2]=(p.z-focusAU.z)/auPerUnit;}shirleyGalaxy.geometry.attributes.position.needsUpdate=true;}
 if(meshes.ShirleyPhoto){
   display(pos.ShirleyGalaxy,tmp);meshes.ShirleyPhoto.position.copy(tmp);
   // Let the portrait respond to zoom instead of remaining the same screen size.
   const ss=Math.max(.035,Math.min(.82,sgr*.18));meshes.ShirleyPhoto.scale.set(ss,ss,1);
   meshes.ShirleyPhoto.visible=tmp.length()<70&&Math.log10(auPerUnit)>7.7&&Math.log10(auPerUnit)<11.5;
 }

 const dr=MW_RADIUS_AU/auPerUnit;mw.visible=dr>.0015&&dr<80;
 if(mw.visible){const a=mw.geometry.attributes.position.array;for(let i=0;i<mwPhysical.length;i++){const p=mwPhysical[i];a[i*3]=(p.x-focusAU.x)/auPerUnit;a[i*3+1]=(p.y-focusAU.y)/auPerUnit;a[i*3+2]=(p.z-focusAU.z)/auPerUnit;}mw.geometry.attributes.position.needsUpdate=true;}

 const ar=AND_RADIUS_AU/auPerUnit;andromeda.visible=ar>.0015&&ar<70;
 if(andromeda.visible){const a=andromeda.geometry.attributes.position.array;for(let i=0;i<andPhysical.length;i++){const p=andPhysical[i];a[i*3]=(p.x-focusAU.x)/auPerUnit;a[i*3+1]=(p.y-focusAU.y)/auPerUnit;a[i*3+2]=(p.z-focusAU.z)/auPerUnit;}andromeda.geometry.attributes.position.needsUpdate=true;}

 // At intergalactic zooms, keep both home galaxies discoverable rather than letting them vanish into blackness.
 if(Math.log10(auPerUnit)>10.3){
   const sr=meshes.ShirleyPhoto; if(sr) sr.material.opacity=Math.max(.18,Math.min(.75,sgr*45));
 } else if(meshes.ShirleyPhoto){meshes.ShirleyPhoto.material.opacity=.96;}

 display(pos.Earth,tmp);obs.position.copy(tmp);const or=OBS_RADIUS_AU/auPerUnit;obs.scale.setScalar(or);obs.visible=or>.15&&or<80;
}
go.onclick=()=>startFlight(dest.value);dest.onchange=()=>showInfo(dest.value);
zoom.oninput=()=>{flight=null;auPerUnit=Math.pow(10,parseFloat(zoom.value));};

let dragging=false,lx=0,ly=0,lastPinch=0,lastTouchCX=0,lastTouchCY=0,lastTouchAngle=0,multiTouch=false;
renderer.domElement.addEventListener('pointerdown',e=>{
 if(e.pointerType==='touch' && !e.isPrimary)return;
 dragging=true;lx=e.clientX;ly=e.clientY;flight=null;
 try{renderer.domElement.setPointerCapture(e.pointerId);}catch(_){}
 e.preventDefault();
},{passive:false});
renderer.domElement.addEventListener('pointermove',e=>{
 if(!dragging||multiTouch)return;
 const dx=e.clientX-lx,dy=e.clientY-ly;
 if(dx||dy){
   flight=null;
   // Orbit around the current focus, so the examined object stays centred.
   rotY+=dx*.006; rotX+=dy*.006;
   rotX=Math.max(-Math.PI*.49,Math.min(Math.PI*.49,rotX));
   lx=e.clientX;ly=e.clientY;
 }
 e.preventDefault();
},{passive:false});
renderer.domElement.addEventListener('pointerup',e=>{dragging=false;try{renderer.domElement.releasePointerCapture(e.pointerId);}catch(_){}});
renderer.domElement.addEventListener('pointercancel',()=>{dragging=false;multiTouch=false;});
renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();flight=null;let lg=Math.log10(auPerUnit)+Math.sign(e.deltaY)*.12;lg=Math.max(-5,Math.min(16,lg));auPerUnit=Math.pow(10,lg);zoom.value=lg;},{passive:false});

// Controls: one finger orbits around the current GO TO focus; pinch zooms;
// moving two fingers together pans the focus through space. A twist still rolls the view.
function panFocusByPixels(dx,dy){
 const viewH=2*camera.position.z*Math.tan(THREE.MathUtils.degToRad(camera.fov*.5));
 const physPerPixel=auPerUnit*viewH/Math.max(innerHeight,1);
 const delta=new THREE.Vector3(-dx*physPerPixel,dy*physPerPixel,0);
 const q=new THREE.Quaternion().setFromEuler(new THREE.Euler(rotX,rotY,rotZ,'XYZ')).invert();
 delta.applyQuaternion(q);
 focusAU.add(delta);
}
renderer.domElement.addEventListener('touchstart',e=>{
 if(e.touches.length===2){
   multiTouch=true; flight=null;
   const x0=e.touches[0].clientX,y0=e.touches[0].clientY,x1=e.touches[1].clientX,y1=e.touches[1].clientY;
   lastPinch=Math.hypot(x0-x1,y0-y1); lastTouchCX=(x0+x1)/2; lastTouchCY=(y0+y1)/2; lastTouchAngle=Math.atan2(y1-y0,x1-x0);
 }
},{passive:true});
renderer.domElement.addEventListener('touchmove',e=>{
 if(e.touches.length===2){
   multiTouch=true; flight=null;
   const x0=e.touches[0].clientX,y0=e.touches[0].clientY,x1=e.touches[1].clientX,y1=e.touches[1].clientY;
   const d=Math.hypot(x0-x1,y0-y1),cx=(x0+x1)/2,cy=(y0+y1)/2,ang=Math.atan2(y1-y0,x1-x0);
   if(lastPinch){
     let lg=Math.log10(auPerUnit)-Math.log10(d/lastPinch)*1.7;
     lg=Math.max(-5,Math.min(16,lg)); auPerUnit=Math.pow(10,lg); zoom.value=lg;
     const dx=cx-lastTouchCX,dy=cy-lastTouchCY;
     // Two-finger translation is the deliberate pan gesture.
     if(Math.hypot(dx,dy)>.6) panFocusByPixels(dx,dy);
     let da=ang-lastTouchAngle; if(da>Math.PI)da-=Math.PI*2; if(da<-Math.PI)da+=Math.PI*2;
     if(Math.abs(da)>.003) rotZ+=da;
   }
   lastPinch=d; lastTouchCX=cx; lastTouchCY=cy; lastTouchAngle=ang; e.preventDefault();
 }
},{passive:false});
renderer.domElement.addEventListener('touchend',e=>{
 if(e.touches.length<2){lastPinch=0;lastTouchAngle=0;multiTouch=false;}
 if(e.touches.length===0)dragging=false;
});

function scaleName(){const lg=Math.log10(auPerUnit);if(lg<-3)return'Earth–Moon scale';if(lg<0)return'Solar-system scale';if(lg<5)return'Interstellar scale';if(lg<10)return'Galactic scale';return'Cosmic scale';}
function updateEarthOrientation(d){
 const jd=jdFromDate(d),T=(jd-2451545.0)/36525;
 const gst=((280.46061837+360.98564736629*(jd-2451545.0)+.000387933*T*T-T*T*T/38710000)%360+360)%360;
 meshes.Earth.rotation.order='ZYX';meshes.Earth.rotation.z=-23.4392911*deg;meshes.Earth.rotation.y=gst*deg;
}
function animate(now){
 requestAnimationFrame(animate);
 // Slow display orbit around Earth: one revolution every 90 seconds.
 const ma=(now/90000)*Math.PI*2;pos.Muziq.set(Math.cos(ma)*.012,Math.sin(ma)*.012,Math.sin(ma*.37)*.0018);
 updatePlanetPositions();
 updateFlight(now);world.rotation.set(rotX,rotY,rotZ,'XYZ');updateWorld();
 stats.textContent='View width ≈ '+fmt(auPerUnit*9.1)+' · 1 scene unit = '+fmt(auPerUnit);badge.textContent=scaleName();
 updateEarthOrientation(new Date());rhylMarker.visible=(data.Earth.r/auPerUnit)>.018;meshes.Moon.rotation.y=now*.000015;meshes.Sun.rotation.y=now*.000008;
 renderer.render(scene,camera);
}
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
showInfo('Earth');animate(performance.now());
})();
</script>
</body>
