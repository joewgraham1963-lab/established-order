<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D Simba - Physical Scale Universe</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#eee;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
html,body,#app,canvas{touch-action:none;overscroll-behavior:none;}
canvas{display:block;-webkit-user-select:none;user-select:none}
#top{position:fixed;left:10px;right:10px;top:10px;z-index:10;background:rgba(0,0,0,.58);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:9px 11px}
#title{font-weight:700;font-size:15px}
#sub,#stats{font-size:11px;opacity:.78;margin-top:3px}
#bottom{position:fixed;left:10px;right:10px;bottom:10px;z-index:10;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:8px}
select,button{background:#151515;color:#eee;border:1px solid #555;border-radius:8px;padding:7px 9px;font:inherit}
button{font-weight:700}
#zoom{flex:1;min-width:120px}
#info{position:fixed;left:10px;bottom:126px;z-index:10;max-width:min(390px,calc(100vw - 20px));background:rgba(0,0,0,.64);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:8px 10px;font-size:11px;line-height:1.35}
#badge{position:fixed;right:12px;top:96px;z-index:10;font-size:10px;opacity:.62;background:rgba(0,0,0,.45);padding:4px 6px;border-radius:7px}
</style>
</head>
<body>
<div id="top">
  <div id="title">3D SIMBA · PHYSICAL SCALE</div>
  <div id="sub">Sizes and distances use the same scale. Locator rings are signposts only.</div>
  <div id="stats"></div>
</div>
<div id="badge"></div>
<div id="info"></div>
<div id="bottom">
  <select id="dest">
    <option>Earth</option><option>Moon</option><option>Venus</option><option>Sun</option><option>Mercury</option><option>Mars</option><option>Jupiter</option><option>Saturn</option><option>Pluto</option>
    <option>Alpha Centauri</option><option>Polaris</option><option>Galactic Centre</option><option>Milky Way</option><option>Andromeda</option><option>Shirley's Galaxy</option><option>Simba</option><option>µ-Ziq</option><option>Observable Universe</option>
  </select>
  <button id="go">GO TO</button>
  <input id="zoom" type="range" min="-5" max="16" step=".01" value="-3.25">
</div>

const deg=Math.PI/180;

function helioPlanet(name,d){

let lastEphemMinute=-1;
function updatePlanetPositions(force=false){
 const d=new Date(), minute=Math.floor(d.getTime()/60000); if(!force&&minute===lastEphemMinute)return; lastEphemMinute=minute;
 const earthH=helioPlanet('Earth',d); pos.Earth.set(0,0,0); pos.Sun.copy(earthH).multiplyScalar(-1);
 for(const n of ['Mercury','Venus','Mars','Jupiter','Saturn']) pos[n].copy(helioPlanet(n,d)).sub(earthH);
 updateMoonPosition(d);
 // Keep Pluto as the existing representative point for now; the six major planets above are live.
}

const meshes={},rings={};
function addBody(n,d){
 const seg=n==='Earth'?64:(n==='Moon'?48:(n==='Sun'?32:20));
 const isLuminous=(n==='Sun'||n==='Polaris'||n==='Alpha Centauri');
 const mat=isLuminous
   ? new THREE.MeshBasicMaterial({color:d.c})
   : new THREE.MeshPhongMaterial({color:d.c,shininess:n==='Earth'?8:12});
 const m=new THREE.Mesh(new THREE.SphereGeometry(1,seg,n==='Earth'?40:(n==='Moon'?32:20)),mat);
 m.userData.name=n; world.add(m); meshes[n]=m;
 const ring=new THREE.Mesh(new THREE.RingGeometry(.75,1,32),new THREE.MeshBasicMaterial({color:d.c,transparent:true,opacity:.72,side:THREE.DoubleSide,depthWrite:false}));
 world.add(ring); rings[n]=ring;
}

Object.keys(data).forEach(n=>addBody(n,data[n]));

function fmt(au){
 au=Math.abs(au);
 if(au<.01)return Math.round(au*AU_KM).toLocaleString()+' km';
 if(au<1000)return au.toLocaleString(undefined,{maximumFractionDigits:3})+' AU';
 const ly=au/LY_AU;
 if(ly<1000)return ly.toLocaleString(undefined,{maximumFractionDigits:3})+' ly';
 if(ly<1e6)return (ly/1000).toFixed(2)+' kly';
 if(ly<1e9)return (ly/1e6).toFixed(2)+' Mly';
 return (ly/1e9).toFixed(2)+' Gly';
}

// GO TO is a journey rather than a teleport:
// 1) pull away from the current object,
// 2) cross the distance at a scale large enough to show the separation,
// 3) dive into the destination.
function startFlight(n){
 const ff=focusAU.clone(), tf=focusFor(n);
 const fl=Math.log10(auPerUnit), tl=targetLog[n]??fl;
 const distanceAU=ff.distanceTo(tf);

 // Pick a cruise scale from the actual distance.  The destination remains
 // physically placed; this only decides how far the camera must pull back
 // before crossing the gap.
 const distanceLog=distanceAU>0 ? Math.log10(distanceAU/3.2) : Math.max(fl,tl);
 const cruiseLog=Math.max(fl,tl,Math.min(15.75,distanceLog));

 // Long trips get time to breathe, but stay tolerable on a phone.
 const scaleSpan=Math.max(Math.abs(cruiseLog-fl),Math.abs(cruiseLog-tl));
 const dur=Math.min(10500,Math.max(2200,2600+scaleSpan*520));

 flight={
   start:performance.now(),dur,ff,tf,fl,tl,cruiseLog,
   departEnd:.32,arriveStart:.68
 };
 showInfo(n);
}
function updateFlight(now){
 if(!flight)return;
 let t=(now-flight.start)/flight.dur;
 if(t>1)t=1;

 // smoothstep, used separately for each leg so nothing snaps.
 const smooth=x=>x*x*(3-2*x);
 let lg;

 if(t<flight.departEnd){
   // Departure: hold the current location while the starting world shrinks.
   const q=smooth(t/flight.departEnd);
   focusAU.copy(flight.ff);
   lg=THREE.MathUtils.lerp(flight.fl,flight.cruiseLog,q);
 }else if(t<flight.arriveStart){
   // Cruise: with both ends reduced to cosmic signposts, move through real space.
   const q=smooth((t-flight.departEnd)/(flight.arriveStart-flight.departEnd));
   focusAU.copy(flight.ff).lerp(flight.tf,q);
   lg=flight.cruiseLog;
 }else{
   // Arrival: hold the destination and dive back down through the scales.
   const q=smooth((t-flight.arriveStart)/(1-flight.arriveStart));
   focusAU.copy(flight.tf);
   lg=THREE.MathUtils.lerp(flight.cruiseLog,flight.tl,q);
 }

 auPerUnit=Math.pow(10,lg);
 zoom.value=lg;
 if(t===1){
   focusAU.copy(flight.tf);
   auPerUnit=Math.pow(10,flight.tl);
   zoom.value=flight.tl;
   flight=null;
 }
}

// moving two fingers together pans the focus through space. A twist still rolls the view.
function panFocusByPixels(dx,dy){
 const viewH=2*camera.position.z*Math.tan(THREE.MathUtils.degToRad(camera.fov*.5));
 const physPerPixel=auPerUnit*viewH/Math.max(innerHeight,1);
 const delta=new THREE.Vector3(-dx*physPerPixel,dy*physPerPixel,0);
 const q=new THREE.Quaternion().setFromEuler(new THREE.Euler(rotX,rotY,rotZ,'XYZ')).invert();
 delta.applyQuaternion(q);
 focusAU.add(delta);
}
renderer.domElement.addEventListener('touchstart',e=>{
 if(e.touches.length===2){
   multiTouch=true; flight=null;
   const x0=e.touches[0].clientX,y0=e.touches[0].clientY,x1=e.touches[1].clientX,y1=e.touches[1].clientY;
   lastPinch=Math.hypot(x0-x1,y0-y1); lastTouchCX=(x0+x1)/2; lastTouchCY=(y0+y1)/2; lastTouchAngle=Math.atan2(y1-y0,x1-x0);
 }
},{passive:true});
renderer.domElement.addEventListener('touchmove',e=>{
 if(e.touches.length===2){
   multiTouch=true; flight=null;
   const x0=e.touches[0].clientX,y0=e.touches[0].clientY,x1=e.touches[1].clientX,y1=e.touches[1].clientY;
   const d=Math.hypot(x0-x1,y0-y1),cx=(x0+x1)/2,cy=(y0+y1)/2,ang=Math.atan2(y1-y0,x1-x0);
   if(lastPinch){
     let lg=Math.log10(auPerUnit)-Math.log10(d/lastPinch)*1.7;
     lg=Math.max(-5,Math.min(16,lg)); auPerUnit=Math.pow(10,lg); zoom.value=lg;
     const dx=cx-lastTouchCX,dy=cy-lastTouchCY;
     // Two-finger translation is the deliberate pan gesture.
     if(Math.hypot(dx,dy)>.6) panFocusByPixels(dx,dy);
     let da=ang-lastTouchAngle; if(da>Math.PI)da-=Math.PI*2; if(da<-Math.PI)da+=Math.PI*2;
     if(Math.abs(da)>.003) rotZ+=da;
   }
   lastPinch=d; lastTouchCX=cx; lastTouchCY=cy; lastTouchAngle=ang; e.preventDefault();
 }
},{passive:false});
renderer.domElement.addEventListener('touchend',e=>{
 if(e.touches.length<2){lastPinch=0;lastTouchAngle=0;multiTouch=false;}
 if(e.touches.length===0)dragging=false;
});

function scaleName(){const lg=Math.log10(auPerUnit);if(lg<-3)return'Earth–Moon scale';if(lg<0)return'Solar-system scale';if(lg<5)return'Interstellar scale';if(lg<10)return'Galactic scale';return'Cosmic scale';}
function solarEquatorial(d){
 const jd=jdFromDate(d),T=(jd-2451545.0)/36525;
 const L0=((280.46646+36000.76983*T+.0003032*T*T)%360+360)%360;
 const M=(357.52911+35999.05029*T-.0001537*T*T)*deg;
 const C=(1.914602-.004817*T-.000014*T*T)*Math.sin(M)
        +(.019993-.000101*T)*Math.sin(2*M)+.000289*Math.sin(3*M);
 const trueLon=(L0+C)*deg;
 const omega=(125.04-1934.136*T)*deg;
 const lambda=trueLon-(.00569+.00478*Math.sin(omega))*deg;
 const eps=(23.439291-.0130042*T-.00000016*T*T+.000000504*T*T*T
           +.00256*Math.cos(omega))*deg;
 const ra=Math.atan2(Math.cos(eps)*Math.sin(lambda),Math.cos(lambda));
 const dec=Math.asin(Math.sin(eps)*Math.sin(lambda));
 return {ra,dec};
}
function updateEarthOrientation(d){
 const jd=jdFromDate(d),T=(jd-2451545.0)/36525;
 const gstDeg=((280.46061837+360.98564736629*(jd-2451545.0)+.000387933*T*T-T*T*T/38710000)%360+360)%360;
 const gst=gstDeg*deg;
 meshes.Earth.rotation.order='ZYX';
 meshes.Earth.rotation.z=-23.4392911*deg;
 meshes.Earth.rotation.y=gst;

 // Put the light above the real subsolar point.  Because this direction is
 // built in geographic coordinates and then given the same globe rotation,
 // Rhyl is dark at Rhyl night and bright at Rhyl day.
 const sunEq=solarEquatorial(d);
 let subLon=sunEq.ra-gst;
 subLon=Math.atan2(Math.sin(subLon),Math.cos(subLon));
 const subLocal=new THREE.Vector3(
   Math.cos(sunEq.dec)*Math.sin(subLon),
   Math.sin(sunEq.dec),
   Math.cos(sunEq.dec)*Math.cos(subLon)
 ).multiplyScalar(24);
 subLocal.applyQuaternion(meshes.Earth.quaternion).add(meshes.Earth.position);
 pointLight.position.copy(subLocal);
}
function animate(now){
 requestAnimationFrame(animate);
 // Slow display orbit around Earth: one revolution every 90 seconds.
 const ma=(now/90000)*Math.PI*2;pos.Muziq.set(Math.cos(ma)*.012,Math.sin(ma)*.012,Math.sin(ma*.37)*.0018);
 updatePlanetPositions();
 updateFlight(now);world.rotation.set(rotX,rotY,rotZ,'XYZ');updateWorld();
 stats.textContent='View width ≈ '+fmt(auPerUnit*9.1)+' · 1 scene unit = '+fmt(auPerUnit);badge.textContent=scaleName();
 updateEarthOrientation(new Date());
 const earthScreenR=data.Earth.r/auPerUnit;
 rhylMarker.visible=earthScreenR>.018;
 rhylMap.visible=earthScreenR>.11;
 rhylMap.material.opacity=Math.min(.92,Math.max(.18,(earthScreenR-.11)*5));
 meshes.Moon.rotation.y=now*.000015;meshes.Sun.rotation.y=now*.000008;
 display(pos.Polaris,tmp);polarisGlow.position.copy(tmp);
 const pr=data.Polaris.r/auPerUnit;
 polarisGlow.scale.setScalar(Math.max(.012,pr*5.2));
 polarisGlow.visible=pr>.003&&pr<18;
 renderer.render(scene,camera);
}
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
showInfo('Earth');animate(performance.now());
})();
</script>
