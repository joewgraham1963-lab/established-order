<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Visible Universe 3D + Simba</title>
<style>
html,body{
  margin:0;height:100%;overflow:hidden;background:#000;color:#fff;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  touch-action:none;
}
#app{position:fixed;inset:0;}
canvas{display:block;width:100%;height:100%;touch-action:none}
.panel,.controls{
  position:fixed;left:12px;right:12px;z-index:10;
  background:rgba(0,0,0,.62);
  border:1px solid rgba(255,255,255,.18);
  border-radius:12px;padding:10px 12px;
}
.panel{top:12px}
.controls{bottom:12px}
.title{font-weight:700;letter-spacing:.04em;margin-bottom:4px}
.sub{opacity:.76;font-size:12px;line-height:1.35}
.row{display:flex;gap:8px;align-items:center}
button{
  background:#151515;color:#fff;border:1px solid #555;border-radius:9px;
  padding:8px 10px;font-weight:650
}
button.active{background:#f2d54a;color:#111;border-color:#f2d54a}
input[type=range]{width:100%}
#stats{margin-top:7px;font-size:12px;opacity:.88}
#hint{
  position:fixed;right:14px;top:132px;z-index:10;font-size:11px;
  opacity:.55;text-align:right;pointer-events:none
}
.yellow{color:#f2d54a}
.navrow{display:flex;gap:7px;align-items:center;margin-top:8px}
.navrow select{
  min-width:0;flex:1;background:#111;color:#fff;border:1px solid #555;
  border-radius:9px;padding:8px;font-weight:650
}
#info{
  position:fixed;left:12px;right:12px;top:116px;z-index:12;
  background:rgba(0,0,0,.78);border:1px solid rgba(242,213,74,.42);
  border-radius:12px;padding:10px 12px;display:none;
  max-height:38vh;overflow:auto;font-size:12px;line-height:1.42;
}
#info .infoTitle{font-size:15px;font-weight:800;color:#f2d54a;margin-bottom:5px}
#info .coords{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;opacity:.92}
#infoClose{
  float:right;padding:3px 7px;margin:-2px -2px 4px 8px;
  font-size:12px
}
@media (max-height:650px){
  #info{top:108px;max-height:30vh}
  .panel{padding:8px 10px}
}
</style>
</head>
<body>

<div id="app"></div>

<div class="panel">
  <div class="title">THE VISIBLE UNIVERSE · 3D</div>
  <div class="sub">
    Drag to rotate. Pinch to zoom. Tap a named body for details.
    Distances are logarithmically compressed.
  </div>
  <div class="navrow">
    <select id="destination" aria-label="Destination">
      <option>Earth</option>
      <option>Moon</option>
      <option>Sun</option>
      <option>Mercury</option>
      <option>Pluto</option>
      <option>Alpha Centauri</option>
      <option>Simba</option>
      <option>Simba 2</option>
      <option>Observable Limit</option>
    </select>
    <button id="goto">GO TO</button>
  </div>
</div>

<div id="info">
  <button id="infoClose">×</button>
  <div id="infoBody"></div>
</div>

<div id="hint">drag = rotate<br>pinch = zoom<br>tap = inspect</div>

<div class="controls">
  <div class="row">
    <button id="play">▶ TIME</button>
    <button id="reset">NOW</button>
    <span style="font-size:12px;opacity:.75">speed</span>
    <input id="speed" type="range" min="0" max="8" step="1" value="3">
  </div>
  <div id="stats"></div>
</div>

<!-- Classic non-module build: deliberately boring, therefore useful. -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
(function(){
  const app = document.getElementById('app');

  if (!window.THREE) {
    const msg=document.createElement('div');
    msg.style.cssText='position:fixed;inset:35% 20px auto;text-align:center;color:#fff;font-size:18px;z-index:30';
    msg.textContent='3D library failed to load. Open this page once in Chrome or Firefox.';
    document.body.appendChild(msg);
    return;
  }

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000000);

  const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.01, 500);
  camera.position.set(0, 2.8, 11);

  const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(innerWidth, innerHeight);
  app.appendChild(renderer.domElement);

  const root = new THREE.Group();
  scene.add(root);

  scene.add(new THREE.AmbientLight(0xffffff, 1.25));

  const CURRENT_HORIZON_GLY = 46.5;
  const SCENE_HORIZON_RADIUS = 8.0;

  function compressedRadius(distanceLy, horizonGly){
    horizonGly = horizonGly || CURRENT_HORIZON_GLY;
    const d = Math.max(distanceLy, 1e-9);
    const horizonLy = horizonGly * 1e9;
    return SCENE_HORIZON_RADIUS *
      Math.log10(1+d) / Math.log10(1+horizonLy);
  }

  // Observable-universe shell
  const shell = new THREE.Mesh(
    new THREE.SphereGeometry(SCENE_HORIZON_RADIUS, 32, 22),
    new THREE.MeshBasicMaterial({
      color:0x7aa7ff,transparent:true,opacity:.09,wireframe:true
    })
  );
  root.add(shell);

  // Yellow inner glow
  const halo = new THREE.Mesh(
    new THREE.SphereGeometry(SCENE_HORIZON_RADIUS*.985, 28, 18),
    new THREE.MeshBasicMaterial({
      color:0xf2d54a,transparent:true,opacity:.025,side:THREE.BackSide
    })
  );
  root.add(halo);

  // Earth
  const earth = new THREE.Mesh(
    new THREE.SphereGeometry(.045,20,14),
    new THREE.MeshBasicMaterial({color:0xffffff})
  );
  root.add(earth);

  // axes
  const axisMat = new THREE.LineBasicMaterial({color:0x555555,transparent:true,opacity:.35});
  ['x','y','z'].forEach(function(axis){
    const a=new THREE.Vector3(), b=new THREE.Vector3();
    a[axis]=-SCENE_HORIZON_RADIUS;
    b[axis]= SCENE_HORIZON_RADIUS;
    const g=new THREE.BufferGeometry().setFromPoints([a,b]);
    root.add(new THREE.Line(g,axisMat));
  });

  function addDot(distanceLy, dir, colour, size){
    const p=new THREE.Vector3(dir[0],dir[1],dir[2]).normalize()
      .multiplyScalar(compressedRadius(distanceLy));
    const m=new THREE.Mesh(
      new THREE.SphereGeometry(size||.05,12,8),
      new THREE.MeshBasicMaterial({color:colour})
    );
    m.position.copy(p); root.add(m); return p;
  }

  // Interstellar display band. The local Solar System occupies the inner scene;
  // stars begin beyond it so 4.2465 ly actually feels like leaving home.
  // This is still a display mapping, not a literal linear scale.
  function stellarDisplayRadius(distanceLy){
    const nearestLy=4.2465;
    const outerStart=5.40;
    const horizonLy=CURRENT_HORIZON_GLY*1e9;
    const d=Math.max(distanceLy,nearestLy);
    const t=Math.log10(d/nearestLy)/Math.log10(horizonLy/nearestLy);
    return outerStart + (SCENE_HORIZON_RADIUS-outerStart)*Math.max(0,Math.min(1,t));
  }

  function addStellarDot(distanceLy, dir, colour, size){
    const p=new THREE.Vector3(dir[0],dir[1],dir[2]).normalize()
      .multiplyScalar(stellarDisplayRadius(distanceLy));
    const m=new THREE.Mesh(
      new THREE.SphereGeometry(size||.05,12,8),
      new THREE.MeshBasicMaterial({color:colour})
    );
    m.position.copy(p); root.add(m); return p;
  }

  const alphaPos=addStellarDot(4.2465,[.82,-.22,.53],0xf2d54a,.065);

  addStellarDot(8.6,[-.55,.43,.71],0xffffff,.050);
  addStellarDot(642,[.20,.81,-.55],0xffb07a,.050);
  addStellarDot(2.54e6,[-.77,.18,-.61],0xbfd4ff,.050);
  addStellarDot(5.38e7,[.63,-.55,-.55],0xb7c7ff,.050);

  // Stable star field
  let seed=1963;
  function random(){
    seed=(seed*1664525+1013904223)>>>0;
    return seed/4294967296;
  }

  const count=5000;
  const arr=new Float32Array(count*3);
  for(let i=0;i<count;i++){
    const u=random(),v=random(),w=random();
    const theta=2*Math.PI*u;
    const zz=2*v-1;
    const s=Math.sqrt(1-zz*zz);
    const r=SCENE_HORIZON_RADIUS*Math.pow(w,.42);
    arr[i*3]=r*s*Math.cos(theta);
    arr[i*3+1]=r*zz;
    arr[i*3+2]=r*s*Math.sin(theta);
  }
  const starGeo=new THREE.BufferGeometry();
  starGeo.setAttribute('position',new THREE.BufferAttribute(arr,3));
  root.add(new THREE.Points(
    starGeo,
    new THREE.PointsMaterial({color:0xffffff,size:.024,transparent:true,opacity:.82})
  ));

  // Canvas labels
  function makeLabel(text, colour, scale){
    const c=document.createElement('canvas');
    c.width=512;c.height=96;
    const x=c.getContext('2d');
    x.font='bold 38px system-ui,sans-serif';
    x.fillStyle=colour||'#fff';
    x.textAlign='center';x.textBaseline='middle';
    x.fillText(text,256,48);
    const t=new THREE.CanvasTexture(c);
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({
      map:t,transparent:true,depthTest:false
    }));
    scale=scale||.5;
    sp.scale.set(scale*3.3,scale*.62,1);
    return sp;
  }

  const earthLabel=makeLabel('EARTH · YOU ARE HERE','#ffffff',.42);
  earthLabel.position.set(0,.36,0); root.add(earthLabel);

  const alphaLabel=makeLabel('ALPHA CENTAURI · 4.2465 ly','#f2d54a',.36);
  alphaLabel.position.copy(alphaPos).add(new THREE.Vector3(0,.24,0));
  root.add(alphaLabel);

  const horizonLabel=makeLabel('OBSERVABLE LIMIT · ≈ 46.5 Gly radius','#8fb2ff',.42);
  horizonLabel.position.set(0,SCENE_HORIZON_RADIUS+.38,0);
  root.add(horizonLabel);

  // Simba: preserve original X and Y exactly. Add secret Z.
  const simbaWorldX = 17976.8246236122;
  const simbaWorldY = -37470.3745070261;
  const simbaWorldZ = 31415.9265358979;

  const simbaPos=new THREE.Vector3(
    simbaWorldX,simbaWorldY,simbaWorldZ
  ).normalize().multiplyScalar(.92);

  const simbaMarker=new THREE.Mesh(
    new THREE.SphereGeometry(.026,12,8),
    new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0,depthWrite:false})
  );
  simbaMarker.position.copy(simbaPos);
  root.add(simbaMarker);

  let simbaSprite=null;
  const loader=new THREE.TextureLoader();
  loader.load('simba.jpg',function(tex){
    const mat=new THREE.SpriteMaterial({map:tex,transparent:true});
    simbaSprite=new THREE.Sprite(mat);
    simbaSprite.position.copy(simbaPos);
    simbaSprite.scale.set(.065,.084,1);
    root.add(simbaSprite);
  });

  // A deliberately faint Simba label
  const simbaLabel=makeLabel('SIMBA','#ffffff',.23);
  simbaLabel.position.copy(simbaPos).add(new THREE.Vector3(0,.11,0));
  if(simbaLabel.material) simbaLabel.material.opacity=.28;
  root.add(simbaLabel);

  // Simba 2: second photograph, kept near Simba in the local scene.
  const simba2Pos = simbaPos.clone().add(new THREE.Vector3(0.085,-0.055,0.035));

  const simba2Marker=new THREE.Mesh(
    new THREE.SphereGeometry(.026,12,8),
    new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0,depthWrite:false})
  );
  simba2Marker.position.copy(simba2Pos);
  root.add(simba2Marker);

  let simba2Sprite=null;
  loader.load('simba-2.jpg',function(tex){
    const mat=new THREE.SpriteMaterial({map:tex,transparent:true});
    simba2Sprite=new THREE.Sprite(mat);
    simba2Sprite.position.copy(simba2Pos);
    simba2Sprite.scale.set(.10,.13,1);
    root.add(simba2Sprite);
  });

  const simba2Label=makeLabel('SIMBA 2','#ffffff',.20);
  simba2Label.position.copy(simba2Pos).add(new THREE.Vector3(0,.10,0));
  if(simba2Label.material) simba2Label.material.opacity=.28;
  root.add(simba2Label);

  // LOCAL SOLAR SYSTEM
  const sunLocalRadius = 2.35;
  const moonOrbitRadius = 0.22;
  const mercuryOrbitRadius = 0.92;
  const plutoOrbitRadius = 4.10;

  const sunObj = new THREE.Mesh(
    new THREE.SphereGeometry(.035,18,12),
    new THREE.MeshBasicMaterial({color:0xffd84a})
  );
  sunObj.position.set(sunLocalRadius,0,0);
  root.add(sunObj);

  const moonObj = new THREE.Mesh(
    new THREE.SphereGeometry(.016,16,10),
    new THREE.MeshBasicMaterial({color:0xd7d7d7})
  );
  root.add(moonObj);

  const mercuryObj = new THREE.Mesh(
    new THREE.SphereGeometry(.012,14,10),
    new THREE.MeshBasicMaterial({color:0xb9a692})
  );
  root.add(mercuryObj);

  const plutoObj = new THREE.Mesh(
    new THREE.SphereGeometry(.011,14,10),
    new THREE.MeshBasicMaterial({color:0xcab7a1})
  );
  root.add(plutoObj);

  const sunLabel = makeLabel('SUN','#ffd84a',.20);
  sunLabel.position.set(sunLocalRadius,.13,0);
  root.add(sunLabel);

  const moonLabel = makeLabel('MOON','#ffffff',.18);
  root.add(moonLabel);

  const mercuryLabel = makeLabel('MERCURY','#d8c7b2',.18);
  root.add(mercuryLabel);

  const plutoLabel = makeLabel('PLUTO','#d9c7b4',.18);
  root.add(plutoLabel);

  function circleLine(radius, colour, opacity, tilt){
    const pts=[];
    const segs=128;
    for(let i=0;i<=segs;i++){
      const a=i/segs*Math.PI*2;
      let x=Math.cos(a)*radius;
      let y=0;
      let z=Math.sin(a)*radius;
      if(tilt){
        const yy=y*Math.cos(tilt)-z*Math.sin(tilt);
        const zz=y*Math.sin(tilt)+z*Math.cos(tilt);
        y=yy; z=zz;
      }
      pts.push(new THREE.Vector3(x,y,z));
    }
    return new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({color:colour,transparent:true,opacity:opacity})
    );
  }

  const moonOrbitLine=circleLine(moonOrbitRadius,0xffffff,.18,.09);
  root.add(moonOrbitLine);

  const mercuryOrbitLine=circleLine(mercuryOrbitRadius,0xcdb9a3,.16,.12);
  mercuryOrbitLine.position.copy(sunObj.position);
  root.add(mercuryOrbitLine);

  const plutoOrbitLine=circleLine(plutoOrbitRadius,0xbca58f,.12,.30);
  plutoOrbitLine.position.copy(sunObj.position);
  root.add(plutoOrbitLine);

  function updateSolarSystem(simulatedYears){
    const days = simulatedYears * 365.2422;
    const moonA = 2*Math.PI * ((days / 27.321661) % 1);
    const mercuryA = 2*Math.PI * ((days / 87.9691) % 1);
    const plutoA = 2*Math.PI * ((days / 90560.0) % 1);

    moonObj.position.set(
      Math.cos(moonA)*moonOrbitRadius,
      Math.sin(moonA)*moonOrbitRadius*.09,
      Math.sin(moonA)*moonOrbitRadius
    );

    mercuryObj.position.set(
      sunObj.position.x + Math.cos(mercuryA)*mercuryOrbitRadius,
      Math.sin(mercuryA)*mercuryOrbitRadius*.12,
      Math.sin(mercuryA)*mercuryOrbitRadius
    );

    plutoObj.position.set(
      sunObj.position.x + Math.cos(plutoA)*plutoOrbitRadius,
      Math.sin(plutoA)*plutoOrbitRadius*.30,
      Math.sin(plutoA)*plutoOrbitRadius
    );

    moonLabel.position.copy(moonObj.position).add(new THREE.Vector3(0,.10,0));
    mercuryLabel.position.copy(mercuryObj.position).add(new THREE.Vector3(0,.09,0));
    plutoLabel.position.copy(plutoObj.position).add(new THREE.Vector3(0,.09,0));
  }

  updateSolarSystem(0);

  // -------------------------------------------------------------------------
  // OBJECT DIRECTORY, DETAILS, COORDINATES AND GO-TO NAVIGATION
  // -------------------------------------------------------------------------

  function modelRaDec(v){
    const r=Math.sqrt(v.x*v.x+v.y*v.y+v.z*v.z);
    if(r < 1e-12) return {ra:'—',dec:'—'};
    let ra=Math.atan2(v.z,v.x);
    if(ra<0) ra+=Math.PI*2;
    const hours=ra*12/Math.PI;
    const h=Math.floor(hours);
    const m=Math.floor((hours-h)*60);
    const s=((hours-h-m/60)*3600).toFixed(1);
    const dec=Math.asin(v.y/r)*180/Math.PI;
    const sign=dec<0?'−':'+';
    const ad=Math.abs(dec);
    const d=Math.floor(ad);
    const dm=Math.floor((ad-d)*60);
    const ds=((ad-d-dm/60)*3600).toFixed(0);
    return {
      ra:String(h).padStart(2,'0')+'h '+String(m).padStart(2,'0')+'m '+s+'s',
      dec:sign+String(d).padStart(2,'0')+'° '+String(dm).padStart(2,'0')+'′ '+ds+'″'
    };
  }

  const objectDirectory = {
    'Earth': {
      object:earth, type:'Terrestrial planet',
      detail:'Diameter 12,742 km · mean distance from Sun 1 AU · orbital period 365.256 days.',
      distance:'You are here.'
    },
    'Moon': {
      object:moonObj, type:'Natural satellite',
      detail:'Diameter 3,474.8 km · mean distance from Earth 384,400 km · sidereal orbit 27.3217 days.',
      distance:'Mean Earth distance: 384,400 km.'
    },
    'Sun': {
      object:sunObj, type:'G2 V star',
      detail:'Diameter about 1.39 million km · contains about 99.86% of the Solar System’s mass.',
      distance:'Mean Earth distance: 1 AU ≈ 149.6 million km.'
    },
    'Mercury': {
      object:mercuryObj, type:'Terrestrial planet',
      detail:'Diameter 4,879 km · orbital period 87.969 days · mean orbital distance 0.387 AU from the Sun.',
      distance:'Distance shown here is schematic.'
    },
    'Pluto': {
      object:plutoObj, type:'Dwarf planet',
      detail:'Diameter about 2,377 km · orbital period about 247.94 years · semi-major axis about 39.48 AU.',
      distance:'Distance shown here is schematic.'
    },
    'Alpha Centauri': {
      object:null, fixed:alphaPos, type:'Triple-star system',
      detail:'Nearest stellar system to the Sun. The closest component, Proxima Centauri, is about 4.2465 light-years away.',
      distance:'4.2465 light-years.'
    },
    'Simba': {
      object:simbaMarker, type:'Canine Easter egg',
      detail:'Coordinates inherited from the original infinite-space page. Location policy remains admirably opaque.',
      distance:'Hidden in the local compressed scene.',
      secret:true
    },
    'Simba 2': {
      object:simba2Marker, type:'Canine Easter egg',
      detail:'Second Simba photograph, taken five minutes after Simba 1 and placed nearby in the local scene.',
      distance:'Hidden near Simba in the local compressed scene.'
    },
    'Observable Limit': {
      object:null, fixed:new THREE.Vector3(0,0,SCENE_HORIZON_RADIUS),
      type:'Particle-horizon display',
      detail:'Illustrative present observable-universe radius: about 46.5 billion light-years in comoving distance.',
      distance:'≈ 46.5 Gly radius.'
    }
  };

  const selectableMeshes = [earth,moonObj,sunObj,mercuryObj,plutoObj,simbaMarker,simba2Marker];
  selectableMeshes.forEach(function(m){
    m.userData.directoryName = Object.keys(objectDirectory).find(function(k){
      return objectDirectory[k].object===m;
    });
  });

  // Alpha gets a small invisible-ish hit target because the visible dot was created
  // before the directory existed.
  const alphaHit = new THREE.Mesh(
    new THREE.SphereGeometry(.14,10,8),
    new THREE.MeshBasicMaterial({transparent:true,opacity:.001,depthWrite:false})
  );
  alphaHit.position.copy(alphaPos);
  alphaHit.userData.directoryName='Alpha Centauri';
  root.add(alphaHit);
  selectableMeshes.push(alphaHit);

  function localPositionFor(entry){
    if(entry.object) return entry.object.position.clone();
    return entry.fixed.clone();
  }

  const info = document.getElementById('info');
  const infoBody = document.getElementById('infoBody');
  document.getElementById('infoClose').onclick=function(){info.style.display='none';};

  function showInfo(name){
    const entry=objectDirectory[name];
    if(!entry) return;
    const p=localPositionFor(entry);
    const eq=modelRaDec(p);

    let coordLine =
      'model x '+p.x.toFixed(6)+' · y '+p.y.toFixed(6)+' · z '+p.z.toFixed(6);

    if(entry.secret){
      coordLine =
        'original x '+simbaWorldX.toFixed(10)+' · y '+simbaWorldY.toFixed(10)+
        ' · z '+simbaWorldZ.toFixed(10);
    }

    infoBody.innerHTML =
      '<div class="infoTitle">'+name+'</div>'+
      '<div><b>'+entry.type+'</b></div>'+
      '<div>'+entry.detail+'</div>'+
      '<div style="margin-top:5px">'+entry.distance+'</div>'+
      '<div class="coords" style="margin-top:6px">'+coordLine+'</div>'+
      '<div class="coords">model RA '+eq.ra+' · Dec '+eq.dec+'</div>'+
      '<div style="opacity:.58;margin-top:5px">RA/Dec here are directions in this 3-D model, not a live ephemeris.</div>';
    info.style.display='block';
  }

  let focusPoint = new THREE.Vector3(0,0,0);
  let followObject = earth;
  let flight = null;

  function destinationDistance(name){
    if(name==='Earth') return .42;
    if(name==='Moon') return .18;
    if(name==='Sun') return .22;
    if(name==='Mercury') return .18;
    if(name==='Pluto') return .18;
    if(name==='Alpha Centauri') return .24;
    if(name==='Simba') return .26;
    if(name==='Simba 2') return .26;
    if(name==='Observable Limit') return 1.2;
    return .8;
  }

  function startFlight(name){
    const entry=objectDirectory[name];
    if(!entry) return;

    // Freeze the starting focus in local coordinates. The destination is refreshed
    // during the flight in case the Moon or a planet is moving.
    followObject=null;
    flight={
      name:name,
      start:performance.now(),
      duration:(function(){
        const target=localPositionFor(entry);
        const d=flight?0:focusPoint.distanceTo(target);
        return Math.max(700, Math.min(5200, 700 + d*1800));
      })(),
      fromFocus:focusPoint.clone(),
      fromDistance:distance,
      toDistance:destinationDistance(name)
    };
    showInfo(name);
  }

  function updateFlight(now){
    if(!flight){
      if(followObject) focusPoint.copy(followObject.position);
      return;
    }

    const entry=objectDirectory[flight.name];
    const dest=localPositionFor(entry);
    let t=(now-flight.start)/flight.duration;
    if(t>=1) t=1;
    // Smoothstep. Apparently even interstellar travel benefits from easing.
    const e=t*t*(3-2*t);
    focusPoint.copy(flight.fromFocus).lerp(dest,e);
    distance=flight.fromDistance+(flight.toDistance-flight.fromDistance)*e;

    if(t>=1){
      focusPoint.copy(dest);
      followObject=entry.object || null;
      flight=null;
    }
  }

  const destinationSelect=document.getElementById('destination');
  document.getElementById('goto').onclick=function(){
    startFlight(destinationSelect.value);
  };

  // Custom rotation + pinch controls, avoiding OrbitControls/modules.
  let rotX=0,rotY=0;
  let distance=11;
  let dragging=false;
  let lastX=0,lastY=0;
  const pointers={};
  let pinchStart=0;
  let pinchDistanceStart=distance;

  function updateCamera(){
    distance=Math.max(0.07,Math.min(80,distance));
    camera.position.set(0,0,distance);
    camera.lookAt(0,0,0);
    root.rotation.x=rotX;
    root.rotation.y=rotY;

    // Shift the rotated root so the chosen local point sits at the camera target.
    const shifted=focusPoint.clone();
    shifted.applyEuler(root.rotation);
    root.position.copy(shifted).multiplyScalar(-1);
  }

  function pointerCount(){ return Object.keys(pointers).length; }
  function pinchDistance(){
    const vals=Object.values(pointers);
    if(vals.length<2) return 0;
    const dx=vals[0].x-vals[1].x;
    const dy=vals[0].y-vals[1].y;
    return Math.hypot(dx,dy);
  }

  let tapStartX=0,tapStartY=0,tapMoved=false;

  renderer.domElement.addEventListener('pointerdown',function(e){
    if(pointerCount()===0){
      tapStartX=e.clientX;tapStartY=e.clientY;tapMoved=false;
    }
    pointers[e.pointerId]={x:e.clientX,y:e.clientY};
    renderer.domElement.setPointerCapture(e.pointerId);
    if(pointerCount()===1){
      flight=null;
      dragging=true;lastX=e.clientX;lastY=e.clientY;
    }
    if(pointerCount()===2){
      pinchStart=pinchDistance();
      pinchDistanceStart=distance;
      dragging=false;
    }
  });

  renderer.domElement.addEventListener('pointermove',function(e){
    if(!pointers[e.pointerId]) return;
    pointers[e.pointerId]={x:e.clientX,y:e.clientY};
    if(Math.hypot(e.clientX-tapStartX,e.clientY-tapStartY)>7) tapMoved=true;

    if(pointerCount()===1 && dragging){
      const dx=e.clientX-lastX;
      const dy=e.clientY-lastY;
      rotY+=dx*.006;
      rotX+=dy*.006;
      rotX=Math.max(-1.45,Math.min(1.45,rotX));
      lastX=e.clientX;lastY=e.clientY;
    }else if(pointerCount()===2){
      const d=pinchDistance();
      if(pinchStart>0){
        distance=pinchDistanceStart*(pinchStart/d);
      }
    }
    updateCamera();
  });

  const raycaster=new THREE.Raycaster();
  const pointerNdc=new THREE.Vector2();

  function inspectAt(clientX,clientY){
    const rect=renderer.domElement.getBoundingClientRect();
    pointerNdc.x=((clientX-rect.left)/rect.width)*2-1;
    pointerNdc.y=-((clientY-rect.top)/rect.height)*2+1;
    raycaster.setFromCamera(pointerNdc,camera);
    const hits=raycaster.intersectObjects(selectableMeshes,false);
    if(hits.length){
      const name=hits[0].object.userData.directoryName;
      if(name){
        destinationSelect.value=name;
        showInfo(name);
      }
    }
  }

  function endPointer(e){
    const wasSingle = pointerCount()===1;
    const doTap = wasSingle && !tapMoved;
    const tx=e.clientX, ty=e.clientY;
    delete pointers[e.pointerId];
    if(doTap) inspectAt(tx,ty);
    if(pointerCount()===1){
      const v=Object.values(pointers)[0];
      lastX=v.x;lastY=v.y;dragging=true;
    }else if(pointerCount()===0){
      dragging=false;
    }
  }
  renderer.domElement.addEventListener('pointerup',endPointer);
  renderer.domElement.addEventListener('pointercancel',endPointer);

  renderer.domElement.addEventListener('wheel',function(e){
    e.preventDefault();
    flight=null;
    distance*=Math.exp(e.deltaY*.001);
    updateCamera();
  },{passive:false});

  // Time
  let playing=false, yearsAhead=0, last=performance.now();
  const speeds=[0,1e3,1e5,1e6,1e7,1e8,1e9,5e9,1e10];
  const speedInput=document.getElementById('speed');
  const playBtn=document.getElementById('play');
  const resetBtn=document.getElementById('reset');
  const stats=document.getElementById('stats');

  playBtn.onclick=function(){
    playing=!playing;
    playBtn.classList.toggle('active',playing);
    playBtn.textContent=playing?'❚❚ TIME':'▶ TIME';
  };

  resetBtn.onclick=function(){
    yearsAhead=0;playing=false;
    playBtn.classList.remove('active');
    playBtn.textContent='▶ TIME';
    destinationSelect.value='Earth';
    startFlight('Earth');
  };

  function horizonAt(years){
    return CURRENT_HORIZON_GLY+years/1e9;
  }

  function animate(now){
    requestAnimationFrame(animate);
    const dt=Math.min((now-last)/1000,.08);
    last=now;

    if(playing){
      yearsAhead+=speeds[+speedInput.value]*dt;
    }

    updateSolarSystem(yearsAhead);
    updateFlight(now);
    updateCamera();

    // Illustrative expansion
    const h=horizonAt(yearsAhead);
    const scale=h/CURRENT_HORIZON_GLY;
    shell.scale.setScalar(scale);
    halo.scale.setScalar(scale);

    stats.innerHTML=
      'warp flight · fast-forward: <span class="yellow">'+yearsAhead.toExponential(2)+' years</span> · '+
      'observable radius: <span class="yellow">'+h.toFixed(2)+' Gly</span> · '+
      'target: <span class="yellow">'+destinationSelect.value+'</span>';

    renderer.render(scene,camera);
  }

  updateCamera();
  requestAnimationFrame(animate);

  addEventListener('resize',function(){
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });

})();
</script>
</body>
</html>
